# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json

defaultPodOptions:
  automountServiceAccountToken: false

controllers:
  ambeserver:
    annotations:
      reloader.stakater.com/auto: "true"
    replicas: 2
    strategy: RollingUpdate
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
    containers:
      ambeserver:
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/dmrgo-ambeserver
          tag: v1.1.1@sha256:a29ad8f661a494d2e5fec9c6d71f9c55baef27a035d226217a0a6cb38ce173f9
        env:
          METRICS_ENABLED: "true"
          METRICS_BIND: "[::]"
          CLIENTS_WORKERS: "100"
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          limits:
            memory: 120Mi
          requests:
            cpu: 10m
            memory: 80Mi

service:
  ambeserver:
    controller: ambeserver
    ports:
      ambe:
        port: 2460
        protocol: UDP
      metrics:
        port: 9000
        primary: true

serviceMonitor:
  ambeserver:
    enabled: true
    serviceName: ambeserver
    endpoints:
      - port: metrics
        scheme: http
        path: /metrics
        interval: 30s
        scrapeTimeout: 10s
