apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ambeserver
  namespace: ambeserver
spec:
  interval: 1h
  targetNamespace: ambeserver
  path: ./services/ambeserver/resources
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
