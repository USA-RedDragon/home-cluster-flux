# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json

defaultPodOptions:
  automountServiceAccountToken: false

controllers:
  mosquitto-exporter:
    replicas: 1
    strategy: RollingUpdate
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    containers:
      mosquitto-exporter:
        image:
          repository: jacob.pub/ghcr.io/d0ugal/mosquitto-exporter
          tag: v0.2.56@sha256:2d7edf2cd9df65bd32c63f8c2516bfb25eb0a45fa53194d385e164e8b17ed807
          pullPolicy: IfNotPresent
        command:
          - /app/mosquitto-exporter
        args:
          - --config
          - /config/config.yaml
        env:
          - name: MOSQUITTO_BROKER_ENDPOINT
            value: tcp://mosquitto.mosquitto.svc.cluster.local:1883
          - name: MOSQUITTO_USERNAME
            value: mqtt-exporter
          - name: MOSQUITTO_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mosquitto-exporter
                key: password
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: false

configMaps:
  config:
    data:
      config.yaml: |
        logging:
          level: warn
          format: json

persistence:
  config:
    type: configMap
    identifier: config
    globalMounts:
      - path: /config
        readOnly: true

service:
  mosquitto-exporter:
    controller: mosquitto-exporter
    ports:
      metrics:
        port: 9234
        primary: true
        protocol: TCP

serviceMonitor:
  mosquitto-exporter:
    enabled: true
    serviceName: mosquitto-exporter
    endpoints:
      - port: metrics
        scheme: http
        path: /metrics
        interval: 15s
        scrapeTimeout: 10s
