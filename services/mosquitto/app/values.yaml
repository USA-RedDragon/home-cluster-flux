# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json

controllers:
  mosquitto:
    strategy: Recreate
    replicas: 1
    pod:
      priorityClassName: system-cluster-critical
      securityContext:
        fsGroup: 1883
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - alpha
                      - beta
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - delta
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
    initContainers:
      copy-auth:
        image:
          repository: jacob.pub/docker.io/eclipse-mosquitto
          tag: 2.1.2-alpine@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
          pullPolicy: IfNotPresent
        command:
          - sh
          - -c
          - rm -f /auth/passwd /auth/acl && cp /secret/passwd /secret/acl /auth/ && chmod 0400 /auth/passwd /auth/acl
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 32Mi
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          runAsUser: 1883
          runAsGroup: 1883
          capabilities:
            drop:
              - ALL
    containers:
      mosquitto:
        image:
          repository: jacob.pub/docker.io/eclipse-mosquitto
          tag: 2.1.2-alpine@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
          pullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          runAsUser: 1883
          runAsGroup: 1883
          capabilities:
            drop:
              - ALL
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true

service:
  mosquitto:
    controller: mosquitto
    type: LoadBalancer
    loadBalancerClass: metallb
    externalTrafficPolicy: Local
    ipFamilyPolicy: PreferDualStack
    ipFamilies:
      - IPv4
      - IPv6
    annotations:
      metallb.io/loadBalancerIPs: 192.168.254.11,fdeb:abba:237c:dead:0001::11
      tailscale.com/expose: "true"
      tailscale.com/hostname: "mqtt"
      tailscale.com/tags: "tag:mqtt,tag:k8s"
    labels:
      tailscale.com/proxy-class: "tailscale"
    ports:
      mqtt:
        port: 1883
        primary: true

configMaps:
  config:
    data:
      mosquitto.conf: |
        listener 1883
        allow_anonymous false
        persistence true
        persistence_location /mosquitto/data
        autosave_interval 1800
        persistent_client_expiration 1d
        log_dest stderr
        log_type error
        log_type warning
        log_type notice
        log_type subscribe

        plugin /usr/lib/mosquitto_password_file.so
        plugin_opt_password_file /mosquitto/auth/passwd
        plugin /usr/lib/mosquitto_acl_file.so
        plugin_opt_acl_file /mosquitto/auth/acl

        # listener 8883
        # cafile /tls/ca/tls-1.crt
        # certfile /tls/ca/tls-0.crt
        # keyfile /tls/tls.key

persistence:
  config:
    enabled: true
    type: configMap
    name: mosquitto
    advancedMounts:
      mosquitto:
        mosquitto:
        - path: /mosquitto/config/mosquitto.conf
          subPath: mosquitto.conf
  data:
    enabled: true
    storageClass: longhorn-nvme
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      mosquitto:
        mosquitto:
        - path: /mosquitto/data
  auth:
    enabled: true
    type: secret
    name: mosquitto-auth
    defaultMode: 0440
    advancedMounts:
      mosquitto:
        copy-auth:
          - path: /secret
            readOnly: true
  auth-runtime:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 1Mi
    advancedMounts:
      mosquitto:
        copy-auth:
          - path: /auth
        mosquitto:
          - path: /mosquitto/auth
            readOnly: true
