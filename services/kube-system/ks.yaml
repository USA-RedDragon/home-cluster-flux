apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  interval: 1h
  targetNamespace: kube-system
  path: ./services/kube-system/resources/metrics-server
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: etcd-backup
  namespace: kube-system
spec:
  interval: 1h
  targetNamespace: kube-system
  path: ./services/kube-system/resources/etcd-backup
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oidc
  namespace: kube-system
spec:
  interval: 1h
  targetNamespace: kube-system
  path: ./services/kube-system/resources/oidc
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
