apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  namespace: kube-system
spec:
  schedule: "@hourly"
  jobTemplate:
    spec:
      template:
        spec:
          imagePullSecrets:
          - name: registry-zot
          containers:
          - name: backup
            image: jacob.pub/docker.io/alpine:3.24.2@sha256:3cf95fe0816180395592b8373f3ec60663f076127617bbacb4eacf9667afe2e9
            imagePullPolicy: IfNotPresent
            volumeMounts:
            - name: backups
              mountPath: /backups
            - mountPath: /var/run/secrets/talos.dev
              name: talos-secrets
              readOnly: true
            - mountPath: /tmp
              name: tmp
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 0
            command:
            - /bin/sh
            - -c
            - |
              set -eu
              wget -O /tmp/talosctl https://github.com/siderolabs/talos/releases/download/v1.12.9/talosctl-linux-amd64
              chmod +x /tmp/talosctl
              back=$(date +%s)
              for entry in chi:192.168.1.249 psi:192.168.1.250 omega:192.168.1.251; do
                name=${entry%%:*}
                addr=${entry#*:}
                /tmp/talosctl -n "$addr" etcd snapshot "/tmp/etcd-$name.kubernetes-$back.db"
                gzip -9 -c "/tmp/etcd-$name.kubernetes-$back.db" > "/backups/etcd-$name.kubernetes-$back.db.gz"
                rm -f "/tmp/etcd-$name.kubernetes-$back.db"
              done
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2560Mi
          restartPolicy: OnFailure
          volumes:
          - name: tmp
            emptyDir:
              medium: Memory
              sizeLimit: 2Gi
          - name: backups
            nfs:
              server: 192.168.1.135
              path: /mnt/data/backups/Homelab/etcd
          - name: talos-secrets
            secret:
              secretName: etcd-backup-talos-secrets
