# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/values.schema.json
defaultPodOptions:
  automountServiceAccountToken: false

controllers:
  wireguard-tunnel:
    forceRename: wireguard-tunnel-app
    strategy: Recreate
    pod:
      enableServiceLinks: true
      securityContext:
        sysctls:
        - name: net.ipv4.conf.all.src_valid_mark
          value: '1'
        - name: net.ipv4.ip_forward
          value: '1'
        - name: net.ipv6.conf.all.forwarding
          value: '1'
    initContainers:
      wireguard-init:
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/wireguard
          tag: main@sha256:548372c47d0abf50e1a7e6d452798f91e252e4ce3f3dd203342f198eb25b151f
          pullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          mkdir -p /tmp/shim && \
          printf '%s\n' '#!/bin/sh' 'for a in "$@"; do case "$a" in *=*) k="${a%%=*}"; v="${a#*=}"; [ "$(cat "/proc/sys/$(echo "$k" | tr . /)")" = "$v" ] || exit 1;; esac; done' > /tmp/shim/sysctl && \
          chmod +x /tmp/shim/sysctl && \
          export PATH=/tmp/shim:$PATH && \
          set -x && \
          sleep 10 && \
          ip l del lan 2>/dev/null || true && \
          wg-quick up /etc/wireguard/lan.conf && \
          ip l del wgc1 2>/dev/null || true && \
          wg-quick up /etc/wireguard/wgc1.conf && \
          ip6tables -P INPUT DROP && \
          ip6tables -P FORWARD DROP && \
          iptables -P INPUT DROP && \
          iptables -P FORWARD DROP && \
          iptables -A INPUT -i lo -j ACCEPT && \
          iptables -A INPUT -i wgc1 -j ACCEPT && \
          iptables -A INPUT -i eth0 -p udp --dport 51820 -j ACCEPT && \
          iptables -A INPUT -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT && \
          ip6tables -A INPUT -i lo -j ACCEPT && \
          ip6tables -A INPUT -i wgc1 -j ACCEPT && \
          ip6tables -A INPUT -i eth0 -p udp --dport 51820 -j ACCEPT && \
          ip6tables -A INPUT -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT && \
          iptables -A INPUT -i lan -j ACCEPT && \
          iptables -A FORWARD -i lan -o eth0 -j DROP && \
          ip6tables -A FORWARD -i lan -o eth0 -j DROP && \
          iptables -A FORWARD -i lan -o wgc1 -j ACCEPT && \
          ip6tables -A FORWARD -i lan -o wgc1 -j ACCEPT && \
          iptables -A FORWARD -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT && \
          ip6tables -A FORWARD -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT && \
          iptables -t nat -A POSTROUTING -o wg+ ! -d 255.255.255.255 -j SNAT --to-source 10.54.25.4 && \
          iptables -t nat -A POSTROUTING ! -d 10.0.0.0/8 -o wgc1 -j MASQUERADE
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
    containers:
      app:
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/mesh-base
          tag: main@sha256:61634a4500f7aa91a7c8e0ae2070f91ffd92b93713867d530d53cd6fa9a5a694
          pullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          set -x && \
          NODE_NAME=KI5VMF-KUBERNETES && \
          ip link add dev br-wan type bridge && \
          ip link add dev br-dtdlink type bridge && \
          ip link set dev eth0 master br-wan && \
          ip link set br-wan up && \
          ip link set br-dtdlink up && \
          GW=$(ip route list 0/0 | awk '{ print $3 }') && \
          IP6_GW=$(ip -6 route list ::/0 | awk '{ print $3 }') && \
          IPV4_ADDRS=$(ip address show eth0 | grep 'inet ' | awk '{ print $2 }') && \
          for IPV4_ADDR in $IPV4_ADDRS; do \
              ip address del dev eth0 $IPV4_ADDR && \
              ip address add dev br-wan $IPV4_ADDR ; \
          done && \
          IPV6_ADDRS=$(ip address show eth0 | grep 'inet6 ' | awk '{ print $2 }') && \
          for IPV6_ADDR in $IPV6_ADDRS; do \
              if [[ $IPV6_ADDR == fe80:* ]]; then \
                  continue ; \
              fi && \
              ip address del dev eth0 $IPV6_ADDR && \
              ip address add dev br-wan $IPV6_ADDR ; \
          done && \
          mkdir -p /etc/iproute2/ && \
          echo "20 babel_in" >> /etc/iproute2/rt_tables && \
          echo "21 babel_super" >> /etc/iproute2/rt_tables && \
          echo "22 wan_in" >> /etc/iproute2/rt_tables && \
          echo "27 local_wan" >> /etc/iproute2/rt_tables && \
          echo "28 wan_out" >> /etc/iproute2/rt_tables && \
          echo "29 local_lan" >> /etc/iproute2/rt_tables && \
          echo "99 blackhole" >> /etc/iproute2/rt_tables && \
          ip r add $GW dev br-wan scope link table 28 && \
          ip route add default via $GW dev br-wan table 28 && \
          ip -6 route add $IP6_GW dev br-wan table 28 && \
          ip -6 route del default via $IP6_GW dev eth0 && \
          ip -6 route add default via $IP6_GW dev br-wan table 28 && \
          WAN_NET=$(ip route show dev br-wan | grep "proto kernel" | awk '{print $1}') && \
          if [ -n "$WAN_NET" ]; then \
              ip route add $WAN_NET dev br-wan table 27 ; \
          fi && \
          ip route add blackhole 0.0.0.0/0 table 99 && \
          ip address add dev br-dtdlink $NODE_IP/8 && \
          ip rule add pref 10 iif br-dtdlink lookup 29 && \
          ip rule add pref 20 iif br-dtdlink lookup 20 && \
          ip rule add pref 30 iif br-dtdlink lookup 21 && \
          ip rule add pref 60 iif br-dtdlink lookup 22 && \
          ip rule add pref 70 iif br-dtdlink lookup 99 && \
          ip rule add pref 110 lookup 29 && \
          ip rule add pref 120 lookup 20 && \
          ip rule add pref 130 lookup 21 && \
          ip rule add pref 140 lookup 27 && \
          ip rule add pref 150 lookup 28 && \
          ip rule add pref 160 lookup 22 && \
          ip -6 addr add $(ip -4 -o addr show dev wgc1 | awk '{split($4,a,"/"); split(a[1],o,"."); printf "fe80::200:%xff:fe%02x:%02x%02x/64", o[1], o[2], o[3], o[4]}') dev wgc1 && \
          iptables -A INPUT -i br-wan -p udp --dport 51820 -j ACCEPT && \
          ip6tables -A INPUT -i br-wan -p udp --dport 51820 -j ACCEPT && \
          iptables -A INPUT -i br-wan -p tcp --dport 9101 -j ACCEPT && \
          iptables -A INPUT -i br-wan -p tcp --dport 9102 -j ACCEPT && \
          iptables -A FORWARD -i lan -o br-wan -j DROP && \
          ip6tables -A FORWARD -i lan -o br-wan -j DROP && \
          mkdir -p /etc/meshlink && \
          echo "${NODE_IP} ${NODE_NAME}" >> /etc/meshlink/hosts && \
          echo "${NODE_IP} dtdlink.${NODE_NAME}.local.mesh" >> /etc/meshlink/hosts && \
          rsyslogd -n & \
          cat /etc/resolv.conf > /tmp/resolv.conf.auto && \
          echo -e "search local.mesh\nnameserver 127.0.0.1" > /etc/resolv.conf && \
          rm -rf /etc/s6/vtund && \
          rm -rf /etc/s6/olsrd && \
          mkdir -p /var/run/meshlink/hosts && \
          cp /etc/babel/babel.conf /tmp/babel-generated.conf && \
          sleep 10 && \
          exec s6-svscan /etc/s6
        env:
        - name: NODE_IP
          value: 10.54.25.4
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        resources:
          limits:
            memory: 30Mi
          requests:
            cpu: 10m
            memory: 20Mi
        ports:
        - name: wg
          containerPort: 51820
          protocol: UDP
      nginx:
        image:
          repository: jacob.pub/docker.io/nginx
          tag: mainline-alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
          pullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          runAsGroup: 101
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        envFrom:
        - secretRef:
            name: tiles-s3-reader
        resources:
          limits:
            memory: 16Mi
          requests:
            cpu: 5m
            memory: 4Mi
service:
  app:
    forceRename: wireguard-tunnel-app
    controller: wireguard-tunnel
    ports:
      wg:
        port: 51820
        protocol: UDP
      metrics-tunnel:
        port: 9101
        protocol: TCP
      metrics-supernode:
        port: 9102
        protocol: TCP
configMaps:
  nginx-config:
    forceRename: nginx-config
    data:
      nginx-config: |-
        load_module /etc/nginx/modules/ngx_http_js_module.so;
        pid /tmp/nginx.pid;
        env TILES_S3_ACCESS_KEY;
        env TILES_S3_SECRET_KEY;
        events {
          worker_connections 64;
        }
        stream {
          # Prometheus reaches the AREDN nodes' /cgi-bin/metrics over the mesh through these relays.
          server {
            listen 9101;
            proxy_pass 10.54.25.2:8080;
          }
          server {
            listen 9102;
            proxy_pass 10.54.25.3:8080;
          }
          # AREDN reads node info over IPv6 link-local (4.26.7: :8080/cgi-bin/sysinfo.json, 4.26.10: :80/a/sysinfo)
          # and sends the zone in the Host header,
          # which nginx http rejects (400), so answer it here without parsing the request.
          server {
            listen 8080;
            listen [::]:8080;
            listen [::]:80;
            return 'HTTP/1.0 200 OK\r\nContent-Type: application/json\r\nContent-Length: 115\r\nConnection: close\r\n\r\n{"api_version":"2.0","node":"KI5VMF-KUBERNETES","node_details":{"model":"Kubernetes pod","firmware_version":"n/a"}}';
          }
        }
        # The Squallar basemap mirror in MinIO, for mesh clients only: IPv4 port 80 on the node IP.
        # br-wan drops port 80 in the pod firewall and no Service exposes it.
        http {
          access_log /dev/stdout;
          server_tokens off;
          js_import tiles from /etc/nginx/tiles-s3.js;
          js_set $tiles_amz_date tiles.amzDate;
          js_set $tiles_s3_auth tiles.authorization;
          resolver 127.0.0.1 valid=60s ipv6=off;
          resolver_timeout 5s;
          map $request_uri $tiles_cache_control {
            ~^/tiles/status/ "public, max-age=60";
            default "public, max-age=604800, immutable";
          }
          server {
            listen 80;
            if ($server_addr != 10.54.25.4) {
              return 444;
            }
            location ~ ^/tiles/((?:basemap|status)/[A-Za-z0-9._-]+)$ {
              set $tiles_s3_host minio.minio.svc.cluster.local:9000;
              set $tiles_s3_path /squallar-basemap/$1;
              if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
                add_header Access-Control-Max-Age 86400 always;
                return 204;
              }
              if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
              }
              add_header Access-Control-Allow-Origin * always;
              add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, ETag" always;
              add_header Cache-Control $tiles_cache_control;
              proxy_pass_request_headers off;
              proxy_pass_request_body off;
              proxy_set_header Host $tiles_s3_host;
              proxy_set_header Authorization $tiles_s3_auth;
              proxy_set_header X-Amz-Date $tiles_amz_date;
              proxy_set_header X-Amz-Content-Sha256 UNSIGNED-PAYLOAD;
              proxy_set_header Range $http_range;
              proxy_set_header If-Range $http_if_range;
              proxy_set_header If-Match $http_if_match;
              proxy_set_header If-None-Match $http_if_none_match;
              proxy_set_header If-Modified-Since $http_if_modified_since;
              proxy_set_header Connection "";
              proxy_http_version 1.1;
              proxy_buffering off;
              proxy_connect_timeout 5s;
              proxy_hide_header Cache-Control;
              proxy_hide_header Strict-Transport-Security;
              proxy_hide_header Vary;
              proxy_hide_header X-Amz-Bucket-Region;
              proxy_hide_header X-Amz-Id-2;
              proxy_hide_header X-Amz-Request-Id;
              proxy_hide_header X-Ratelimit-Limit;
              proxy_hide_header X-Ratelimit-Remaining;
              proxy_pass http://minio.minio.svc.cluster.local:9000$tiles_s3_path;
            }
            location / {
              return 404;
            }
          }
        }
      tiles-s3.js: |-
        const crypto = require('crypto');

        function hmac(key, data) {
          return crypto.createHmac('sha256', key).update(data).digest();
        }

        function amzDate(r) {
          return new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
        }

        function authorization(r) {
          const v = r.variables;
          const date = v.tiles_amz_date;
          const day = date.slice(0, 8);
          const scope = day + '/us-east-1/s3/aws4_request';
          const canonical = [
            r.method,
            v.tiles_s3_path,
            '',
            'host:' + v.tiles_s3_host,
            'x-amz-content-sha256:UNSIGNED-PAYLOAD',
            'x-amz-date:' + date,
            '',
            'host;x-amz-content-sha256;x-amz-date',
            'UNSIGNED-PAYLOAD',
          ].join('\n');
          const toSign = [
            'AWS4-HMAC-SHA256',
            date,
            scope,
            crypto.createHash('sha256').update(canonical).digest('hex'),
          ].join('\n');
          let key = hmac('AWS4' + process.env.TILES_S3_SECRET_KEY, day);
          key = hmac(key, 'us-east-1');
          key = hmac(key, 's3');
          key = hmac(key, 'aws4_request');
          const signature = crypto.createHmac('sha256', key).update(toSign).digest('hex');
          return 'AWS4-HMAC-SHA256 Credential=' + process.env.TILES_S3_ACCESS_KEY + '/' + scope +
            ', SignedHeaders=host;x-amz-content-sha256;x-amz-date, Signature=' + signature;
        }

        export default { amzDate, authorization };
  server-babel-config:
    forceRename: server-babel-config
    data:
      babel.conf: |
        skip-kernel-setup true
        router-id 02:44:c0:a6:cb:04
        smoothing-half-life 10
        protocol-buffer-size 65536
        interface br-dtdlink type wired
        interface br-dtdlink rxcost 96
        interface br-dtdlink enable-timestamps false
        interface br-dtdlink split-horizon true
        interface wgc1 type tunnel
        interface wgc1 rxcost 206
        interface wgc1 update-interval 120
        interface wgc1 hello-interval 10
        interface wgc1 split-horizon true
        interface wgc1 rtt-min 10
        interface wgc1 rtt-max 400
        interface wgc1 max-rtt-penalty 400
        redistribute anyproto if wgc1 deny
        redistribute anyproto ip 10.0.0.0/8 ge 24 allow
        redistribute anyproto ip 44.0.0.0/8 ge 24 allow
        redistribute anyproto ip 172.31.0.0/16 eq 32 deny
        redistribute deny
        install ip 10.0.0.0/8 eq 8 allow table 21
        install ip 44.0.0.0/8 le 23 allow table 21
        install ip 0.0.0.0/0 eq 0 allow table 22
        install ip 10.0.0.0/8 ge 24 allow table 20
        install ip 44.0.0.0/8 ge 24 allow table 20
        install ip 0.0.0.0/0 ge 0 deny
persistence:
  nginx-config:
    type: configMap
    name: nginx-config
    advancedMounts:
      wireguard-tunnel:
        nginx:
        - path: /etc/nginx/nginx.conf
          subPath: nginx-config
          readOnly: true
        - path: /etc/nginx/tiles-s3.js
          subPath: tiles-s3.js
          readOnly: true
  nginx-tmp:
    type: emptyDir
    advancedMounts:
      wireguard-tunnel:
        nginx:
        - path: /tmp
        - path: /var/cache/nginx
          subPath: cache
  server-wireguard-config:
    type: secret
    name: server-wireguard-config
    advancedMounts:
      wireguard-tunnel:
        wireguard-init:
        - path: /etc/wireguard
        app:
        - path: /etc/wireguard
  server-babel-config:
    type: configMap
    name: server-babel-config
    advancedMounts:
      wireguard-tunnel:
        app:
        - path: /etc/babel
