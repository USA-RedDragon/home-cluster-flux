---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pushgateway
  namespace: monitoring
spec:
  install:
    remediation:
      retries: -1
  interval: 1m0s
  driftDetection:
    mode: enabled
  releaseName: pushgateway
  chart:
    spec:
      chart: prometheus-pushgateway
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      version: '2.17.0'
      interval: 1m0s
  valuesFrom:
    - kind: ConfigMap
      name: pushgateway-chart-values
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  install:
    remediation:
      retries: -1
  interval: 60m0s
  driftDetection:
    mode: enabled
  releaseName: loki
  chart:
    spec:
      chart: loki
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
      version: '18.15.1'
      interval: 60m0s
  valuesFrom:
    - kind: ConfigMap
      name: loki-chart-values
  # Drop chart dashboards that can't show data on single-binary Loki: bloom
  # components are off, the thanos objstore client isn't used, recording
  # rules aren't remote-written, and the *-resources dashboards chart
  # separate read/write pods.
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              $patch: delete
              apiVersion: v1
              kind: ConfigMap
              metadata:
                namespace: monitoring
                name: loki-dashboards-loki-bloom-build
          - patch: |
              $patch: delete
              apiVersion: v1
              kind: ConfigMap
              metadata:
                namespace: monitoring
                name: loki-dashboards-loki-bloom-gateway
          - patch: |
              $patch: delete
              apiVersion: v1
              kind: ConfigMap
              metadata:
                namespace: monitoring
                name: loki-dashboards-loki-thanos-object-storage
          - patch: |
              $patch: delete
              apiVersion: v1
              kind: ConfigMap
              metadata:
                namespace: monitoring
                name: loki-dashboards-loki-mixin-recording-rules
          - patch: |
              $patch: delete
              apiVersion: v1
              kind: ConfigMap
              metadata:
                namespace: monitoring
                name: loki-dashboards-loki-reads-resources
          - patch: |
              $patch: delete
              apiVersion: v1
              kind: ConfigMap
              metadata:
                namespace: monitoring
                name: loki-dashboards-loki-writes-resources
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  install:
    remediation:
      retries: -1
  interval: 60m0s
  driftDetection:
    mode: enabled
  releaseName: alloy
  dependsOn:
    - name: loki
  chart:
    spec:
      chart: alloy
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      version: '1.13.1'
      interval: 60m0s
  valuesFrom:
    - kind: ConfigMap
      name: alloy-chart-values
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-gateway
  namespace: monitoring
spec:
  install:
    remediation:
      retries: -1
  interval: 60m0s
  driftDetection:
    mode: enabled
  releaseName: alloy-gateway
  dependsOn:
    - name: loki
    - name: alloy
  chart:
    spec:
      chart: alloy
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      version: '1.13.1'
      interval: 60m0s
  valuesFrom:
    - kind: ConfigMap
      name: alloy-gateway-chart-values
