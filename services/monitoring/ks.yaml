apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: monitoring
spec:
  interval: 1h
  targetNamespace: monitoring
  path: ./services/monitoring/resources
  prune: true
  commonMetadata:
    annotations:
      kustomize.toolkit.fluxcd.io/prune: disabled
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
