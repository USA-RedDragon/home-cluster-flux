# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/values.schema.json
controllers:
  thanos-compactor:
    forceRename: thanos-compactor-app
    strategy: Recreate
    pod:
      enableServiceLinks: true
      imagePullSecrets:
      - name: registry-quay
    containers:
      app:
        image:
          repository: jacob.pub/quay.io/thanos/thanos
          tag: v0.42.4@sha256:b567818fe608067eb0f1d7c2c4fe361e7ad83c8a256234c97685f1d0bf670cc8
          pullPolicy: IfNotPresent
        args:
        - compact
        - --data-dir
        - /tmp/thanos-compact
        - --objstore.config-file=/etc/thanos/config.yaml
        - --wait
        # Prometheus has tsdb.outOfOrderTimeWindow set, which writes separate blocks
        # overlapping the regular ones; without this the compactor halts on them.
        - --compact.enable-vertical-compaction
        - --retention.resolution-raw=90d
        - --retention.resolution-5m=365d
        - --retention.resolution-1h=730d
        # Merging blocks spikes well above steady state; 650Mi was OOMKilled twice on
        # the first real compaction run.
        resources:
          limits:
            memory: 3Gi
          requests:
            cpu: 100m
            memory: 2304Mi
        ports:
        - name: http
          containerPort: 10902
          protocol: TCP
service:
  app:
    forceRename: thanos-compactor-app
    controller: thanos-compactor
    ports:
      http:
        port: 10902
persistence:
  bucket-config:
    type: secret
    name: minio-thanos
    advancedMounts:
      thanos-compactor:
        app:
        - path: /etc/thanos
          readOnly: true
  emptydir:
    type: emptyDir
    advancedMounts:
      thanos-compactor:
        app:
        - path: /tmp/thanos-compact
