apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - helm.yaml
  - metrics-actioner-helm.yaml
  - metrics-actioner-metrics.yaml
  - metrics-actioner-rbac.yaml
  - log-alerts.yaml
  - talos-logs.yaml
  - alloy-gateway-svc.yaml
  - loki-alert-rules.yaml
  - router-scrape.yaml
  - backup-alerts.yaml
  - node-disk-alerts.yaml
  - etcd-alerts.yaml
  - flux-alerts.yaml
  - observatory-svc.yaml
  - observatory-alerts.yaml
  - nut-exporter-helm.yaml
  - ups-alerts.yaml
  - snmp-exporter-helm.yaml
  - switch-alerts.yaml
  - thanos-prom.yaml
configMapGenerator:
  - name: querier-chart-values
    files:
      - values.yaml=querier-values.yaml
  - name: compactor-chart-values
    files:
      - values.yaml=compactor-values.yaml
  - name: store-chart-values
    files:
      - values.yaml=store-values.yaml
  - name: pushgateway-chart-values
    files:
      - values.yaml=pushgateway-values.yaml
  - name: metrics-actioner-chart-values
    files:
      - values.yaml=metrics-actioner-values.yaml
  - name: loki-chart-values
    files:
      - values.yaml=loki-values.yaml
  - name: alloy-chart-values
    files:
      - values.yaml=alloy-values.yaml
  - name: alloy-gateway-chart-values
    files:
      - values.yaml=alloy-gateway-values.yaml
  - name: nut-exporter-chart-values
    files:
      - values.yaml=nut-exporter-values.yaml
  - name: snmp-exporter-chart-values
    files:
      - values.yaml=snmp-exporter-values.yaml
configurations:
  - kustomizeconfig.yaml
