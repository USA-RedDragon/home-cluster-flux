# DaemonSet that tails every container log on its node and pushes to Loki.
image:
  registry: jacob.pub/docker.io
  repository: grafana/alloy
  tag: v1.20.0
  digest: sha256:5379c6abea0695b640b0adb5e8fa1317d99d11f6a28cad423be0a638f897cbca

configReloader:
  image:
    registry: jacob.pub/quay.io
    repository: prometheus-operator/prometheus-config-reloader
    tag: v0.94.0@sha256:142a1f11df8dd165f00375b0b1826aecb9c9adeb05c39855893138d7c7575ff7

alloy:
  enableReporting: false
  storagePath: /var/lib/alloy/data
  mounts:
    varlog: true
    extra:
      - name: alloy-data
        mountPath: /var/lib/alloy
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  configMap:
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      // Only this node's pods, so each DaemonSet replica tails its own files.
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = [
            "__meta_kubernetes_pod_label_app_kubernetes_io_name",
            "__meta_kubernetes_pod_label_app",
            "__meta_kubernetes_pod_controller_name",
          ]
          regex        = "^;*([^;]+)(;.*)?$"
          target_label = "app"
        }
        rule {
          source_labels = ["namespace", "container"]
          separator     = "/"
          target_label  = "job"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pod_logs" {
        path_targets = discovery.relabel.pod_logs.output
      }

      loki.source.file "pod_logs" {
        targets    = local.file_match.pod_logs.targets
        forward_to = [loki.process.pod_logs.receiver]
      }

      loki.process "pod_logs" {
        stage.cri {}

        stage.label_drop {
          values = ["filename"]
        }

        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

controller:
  type: daemonset
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  volumes:
    extra:
      - name: alloy-data
        hostPath:
          path: /var/lib/alloy
          type: DirectoryOrCreate

serviceMonitor:
  enabled: true
