# DaemonSet that tails every container log on its node and pushes to Loki.
image:
  registry: jacob.pub/docker.io
  repository: grafana/alloy
  tag: v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
  digest: sha256:5379c6abea0695b640b0adb5e8fa1317d99d11f6a28cad423be0a638f897cbca

configReloader:
  image:
    registry: jacob.pub/quay.io
    repository: prometheus-operator/prometheus-config-reloader
    tag: v0.94.0@sha256:404b7b6e9ab5bfec65b93a07debc11bf901062fac54af1eee92e877d738d8bf8

alloy:
  enableReporting: false
  storagePath: /var/lib/alloy/data
  mounts:
    varlog: true
    extra:
      - name: alloy-data
        mountPath: /var/lib/alloy
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  configMap:
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      // Only this node's pods, so each DaemonSet replica tails its own files.
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = [
            "__meta_kubernetes_pod_label_app_kubernetes_io_name",
            "__meta_kubernetes_pod_label_app",
            "__meta_kubernetes_pod_controller_name",
          ]
          regex        = "^;*([^;]+)(;.*)?$"
          target_label = "app"
        }
        rule {
          source_labels = ["namespace", "container"]
          separator     = "/"
          target_label  = "job"
        }
        // Loki's chart dashboards select its logs by app_instance="loki".
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app_kubernetes_io_instance"]
          regex         = "monitoring;loki;loki"
          target_label  = "app_instance"
          replacement   = "loki"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pod_logs" {
        path_targets = discovery.relabel.pod_logs.output
      }

      loki.source.file "pod_logs" {
        targets    = local.file_match.pod_logs.targets
        forward_to = [loki.process.pod_logs.receiver]
      }

      loki.process "pod_logs" {
        stage.cri {}

        // CNPG retention deletes each hourly Backup as it turns 28 days old,
        // and the operator then logs the vanished object as a Reconciler error:
        // one per database per hour. Drop only that exact shape; every other
        // backup error (e.g. "instance manager was restarted during backup")
        // still comes through.
        stage.match {
          selector = "{namespace=\"cnpg-system\"}"
          stage.drop {
            expression = `"msg":"Reconciler error","controller":"backup",.*"error":"terminal error: Backup\.postgresql\.cnpg\.io \\"[a-z0-9.-]+\\" not found"`
          }
        }

        stage.label_drop {
          values = ["filename"]
        }

        forward_to = [loki.write.default.receiver]
      }

      // Kubernetes API audit log (control-plane nodes only; the file doesn't
      // exist on workers). Talos logs every request twice at Metadata level,
      // ~3-19 GB/day per node. Keep only people, denials, and writes by
      // anything that isn't core automation (Flux's changes are in Git):
      // about 1 MB/day per node.
      local.file_match "audit" {
        path_targets = [{"__path__" = "/var/log/audit/kube/kube-apiserver.log", "job" = "kube-audit", "node" = sys.env("NODE_NAME")}]
      }

      loki.source.file "audit" {
        targets    = local.file_match.audit.targets
        forward_to = [loki.process.audit.receiver]
      }

      loki.process "audit" {
        stage.json {
          expressions = {
            stage       = "stage",
            verb        = "verb",
            username    = "user.username",
            code        = "responseStatus.code",
            resource    = "objectRef.resource",
            subresource = "objectRef.subresource",
            ts          = "stageTimestamp",
          }
        }

        stage.drop {
          source     = "stage"
          expression = "^(RequestReceived|ResponseStarted|Panic)$"
        }

        stage.template {
          source   = "class"
          // The chart runs this config through Helm tpl first, so each opening
          // double brace below is written as a Helm expression that prints one.
          template = `{{ "{{" }} if not (hasPrefix "system:" .username) }}human{{ "{{" }} else if or (eq .code "401") (eq .code "403") }}denied{{ "{{" }} else if and (regexMatch "^(create|update|patch|delete|deletecollection)$" .verb) (not (regexMatch "^(leases|events|selfsubjectaccessreviews|subjectaccessreviews|localsubjectaccessreviews|selfsubjectrulesreviews|tokenreviews)$" .resource)) (ne .subresource "status") (not (regexMatch "^system:(serviceaccount:(kube-system|flux-system|longhorn-system|kyverno|cnpg-system|metallb-system|cert-manager|monitoring):|node:|kube-|apiserver|volume-scheduler)" .username)) }}write{{ "{{" }} end }}`
        }

        stage.drop {
          source     = "class"
          expression = "^$"
        }

        stage.labels {
          values = { class = "" }
        }

        stage.label_drop {
          values = ["filename"]
        }

        stage.timestamp {
          source = "ts"
          format = "RFC3339Nano"
        }

        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

controller:
  type: daemonset
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  volumes:
    extra:
      - name: alloy-data
        hostPath:
          path: /var/lib/alloy
          type: DirectoryOrCreate

serviceMonitor:
  enabled: true
