deploymentMode: Monolithic

loki:
  image:
    registry: jacob.pub/docker.io
    repository: grafana/loki
    tag: 3.7.8
    digest: sha256:c70320a9dead75dcb7aa4e3e31423fdf8030632e8d5d958703e4c4c75ea92dea
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      # Must predate reject_old_samples_max_age (7d) or Alloy's backfill of
      # older lines gets a 500 and retries forever.
      - from: "2026-09-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki
      admin: loki
    s3:
      endpoint: minio.minio.svc.cluster.local:9000
      region: us-east-1
      accessKeyId: ${LOKI_S3_ACCESS_KEY_ID}
      secretAccessKey: ${LOKI_S3_SECRET_ACCESS_KEY}
      s3ForcePathStyle: true
      insecure: true
  compactor:
    retention_enabled: true
    delete_request_store: s3
  limits_config:
    retention_period: 30d
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
  # Default 4; Drilldown fires dozens of small queries per page and they
  # sat 7-12s in the queue while each ran in under a second.
  querier:
    max_concurrent: 16
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  sidecar: false
  extraEnvFrom:
    - secretRef:
        name: minio-loki
  persistence:
    storageClass: longhorn-r1
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false

chunksCache:
  enabled: false
resultsCache:
  enabled: false

lokiCanary:
  enabled: false
test:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
  dashboards:
    enabled: true
  rules:
    enabled: true
