deploymentMode: Monolithic

loki:
  image:
    registry: jacob.pub/docker.io
    repository: grafana/loki
    tag: 3.7.8
    digest: sha256:c70320a9dead75dcb7aa4e3e31423fdf8030632e8d5d958703e4c4c75ea92dea
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      # Must predate reject_old_samples_max_age (7d) or Alloy's backfill of
      # older lines gets a 500 and retries forever.
      - from: "2026-09-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki
      admin: loki
    s3:
      endpoint: minio.minio.svc.cluster.local:9000
      region: us-east-1
      accessKeyId: ${LOKI_S3_ACCESS_KEY_ID}
      secretAccessKey: ${LOKI_S3_SECRET_ACCESS_KEY}
      s3ForcePathStyle: true
      insecure: true
  compactor:
    retention_enabled: true
    delete_request_store: s3
  limits_config:
    retention_period: 180d
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
  # Default 4; Drilldown fires dozens of small queries per page and they
  # sat 7-12s in the queue while each ran in under a second.
  querier:
    max_concurrent: 16
  analytics:
    reporting_enabled: false
  # Log-based alerts. Rules come from ConfigMaps labelled loki_rule (the rules
  # sidecar writes them under /rules/<tenant>; the tenant is "fake" because
  # auth is disabled) and fire into the kube-prometheus-stack Alertmanager.
  rulerConfig:
    alertmanager_url: http://prometheus-stack-kube-prom-alertmanager.monitoring.svc.cluster.local:9093
    enable_api: true
    storage:
      type: local
      local:
        directory: /rules
    # Scratch space for evaluation; must not be the storage directory.
    rule_path: /var/loki/ruler-scratch

singleBinary:
  replicas: 1
  # Loads log alert rules from loki_rule ConfigMaps (see sidecar below).
  sidecar: true
  extraEnvFrom:
    - secretRef:
        name: minio-loki
  persistence:
    storageClass: longhorn-r1
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false

chunksCache:
  enabled: false
resultsCache:
  enabled: false

lokiCanary:
  enabled: false
test:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
  dashboards:
    enabled: true
  rules:
    enabled: true

sidecar:
  image:
    registry: jacob.pub/quay.io
    repository: kiwigrid/k8s-sidecar
    tag: 2.11.2
    digest: sha256:43afbcbff749bb3f3650ed7c97cb1f29f9686d91b5ea891ba68b7055e300eee9
  rules:
    folder: /rules/fake
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 128Mi
