deploymentMode: Monolithic

loki:
  image:
    registry: jacob.pub/docker.io
    repository: grafana/loki
    tag: 3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      # Must predate reject_old_samples_max_age (7d) or Alloy's backfill of
      # older lines gets a 500 and retries forever.
      - from: "2026-09-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki
      admin: loki
    s3:
      endpoint: minio.minio.svc.cluster.local:9000
      region: us-east-1
      accessKeyId: ${LOKI_S3_ACCESS_KEY_ID}
      secretAccessKey: ${LOKI_S3_SECRET_ACCESS_KEY}
      s3ForcePathStyle: true
      insecure: true
  compactor:
    retention_enabled: true
    delete_request_store: s3
  limits_config:
    retention_period: 180d
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
  # Default 4; Drilldown fires dozens of small queries per page and they
  # sat 7-12s in the queue while each ran in under a second.
  querier:
    max_concurrent: 16
  analytics:
    reporting_enabled: false
  # Log-based alerts. Rules come from ConfigMaps labelled loki_rule (the rules
  # sidecar writes them under /rules/<tenant>; the tenant is "fake" because
  # auth is disabled) and fire into the kube-prometheus-stack Alertmanager.
  rulerConfig:
    alertmanager_url: http://_http-web._tcp.alertmanager-operated.monitoring.svc.cluster.local
    enable_alertmanager_discovery: true
    enable_api: true
    storage:
      type: local
      local:
        directory: /rules
    # Scratch space for evaluation; must not be the storage directory.
    rule_path: /var/loki/ruler-scratch

singleBinary:
  replicas: 1
  # Loads log alert rules from loki_rule ConfigMaps (see sidecar below).
  sidecar: true
  extraEnvFrom:
    - secretRef:
        name: minio-loki
  persistence:
    storageClass: longhorn-r1
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 1280Mi
    limits:
      memory: 2560Mi

write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false

chunksCache:
  enabled: false
resultsCache:
  enabled: false

lokiCanary:
  enabled: false
test:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
  dashboards:
    enabled: true
  rules:
    enabled: true

sidecar:
  image:
    registry: jacob.pub/quay.io
    repository: kiwigrid/k8s-sidecar
    tag: 2.14.1@sha256:092dbe0c335fba9af414a27630ca68f34df6185784fa847d9954187e69dbfdd7
  rules:
    folder: /rules/fake
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 128Mi
