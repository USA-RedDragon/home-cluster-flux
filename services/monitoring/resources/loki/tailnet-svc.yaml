apiVersion: v1
kind: Service
metadata:
  name: loki-tailnet
  namespace: monitoring
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: loki
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: single-binary
    app.kubernetes.io/instance: loki
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      protocol: TCP
