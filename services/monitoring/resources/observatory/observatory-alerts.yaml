# The observatory PC's windows_exporter, scraped over the tailnet as job
# node_exporter_astro (scrape config in the scrape-configs secret).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: observatory
  namespace: monitoring
spec:
  groups:
    - name: observatory
      rules:
        - alert: ObservatoryUnreachable
          expr: up{job="node_exporter_astro"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Observatory PC unreachable for 15m"
            description: "windows_exporter on the observatory PC has not answered for 15m: the PC is off, hung, or off the tailnet."
        # NINA saves subs to C: before the uploader ships them, so a full disk
        # stops imaging.
        - alert: ObservatoryDiskFull
          expr: |
            windows_logical_disk_free_bytes{job="node_exporter_astro", volume="C:"}
              / windows_logical_disk_size_bytes{job="node_exporter_astro", volume="C:"} < 0.10
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Observatory C: is {{ $value | humanizePercentage }} free"
            description: "The observatory PC's C: drive is under 10% free. Check that nina-s3-uploader is uploading and cleaning up."
        - alert: ObservatoryDewHeatersNotBoosted
          expr: |
            (max(observatory_weather_temperature_celsius) - max(observatory_weather_dew_point_celsius)) < 3.5
              and on() max(observatory_switch_dew_heater_a_percent) < 100
              and on() max(observatory_safetymonitor_is_safe) == 1
              and on() max(observatory_mount_tracking_enabled) == 1
          for: 20m
          labels:
            severity: warning
          annotations:
            summary: "Dew margin is {{ $value | printf \"%.1f\" }} C and the dew heaters are not at 100%"
            description: "While the mount tracks, the sequence should run the dew heaters at 100% when air temperature minus dew point is under 4 C. They are still on UPB AutoDew, so the boost did not run or did not apply."
