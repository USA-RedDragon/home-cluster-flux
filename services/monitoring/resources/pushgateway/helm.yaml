---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pushgateway
  namespace: monitoring
spec:
  install:
    remediation:
      retries: -1
  interval: 1h0m0s
  maxHistory: 2
  driftDetection:
    mode: enabled
  releaseName: pushgateway
  chart:
    spec:
      chart: prometheus-pushgateway
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      version: '2.17.0'
      interval: 1h0m0s
  valuesFrom:
    - kind: ConfigMap
      name: pushgateway-chart-values
