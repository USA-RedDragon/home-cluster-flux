# Observatory PC UPS: CyberPower EC450G on the observatory's USB, served by
# NUT 2.8.5 (upsd on the tailnet IP, port 3493). The PC's own upsmon shuts it
# down after 60 s on battery or at low battery (C:\ProgramData\ups-shutdown).
# Reached through the tailscale egress Service "observatory" (observatory-svc.yaml).
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: nut-observatory
  namespace: monitoring
spec:
  staticConfigs:
    - targets: ["nut-exporter.monitoring.svc.cluster.local:9199"]
      labels:
        instance: observatory
        job: nut-observatory
        ups: observatory
  metricsPath: /ups_metrics
  params:
    server: ["observatory.monitoring.svc.cluster.local"]
    ups: ["observatory"]
  scrapeInterval: 15s
  # ~5s per scrape: go.nut fetches each variable's description and type
  # one round trip at a time over the tailnet.
  scrapeTimeout: 14s
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: nut-network
  namespace: monitoring
spec:
  staticConfigs:
    - targets: ["nut-exporter.monitoring.svc.cluster.local:9199"]
      labels:
        instance: closet-network
        job: nut-network
        ups: closet-network
  metricsPath: /ups_metrics
  params:
    server: ["192.168.1.1"]
    ups: ["ups"]
  scrapeInterval: 15s
  scrapeTimeout: 14s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ups
  namespace: monitoring
spec:
  groups:
    - name: ups
      rules:
        - alert: ObservatoryUPSOnBattery
          expr: network_ups_tools_ups_status{job="nut-observatory", flag="OB"} == 1
          for: 15s
          labels:
            severity: critical
          annotations:
            summary: "Observatory UPS on battery"
            description: "The observatory's EC450G is on battery ({{ with query \"network_ups_tools_battery_charge{job='nut-observatory'}\" }}{{ . | first | value }}{{ end }}% charge). The PC shuts itself down after 60s on battery. Log: {job=\"observatory\", app=\"ups\"}"
        - alert: ObservatoryUPSLowBattery
          expr: network_ups_tools_ups_status{job="nut-observatory", flag="LB"} == 1
          labels:
            severity: critical
          annotations:
            summary: "Observatory UPS battery low"
            description: "The EC450G reports low battery (LB: charge under 40% or runtime under 300s). upsmon shuts the PC down immediately on battery+LB."
        - alert: ObservatoryUPSReplaceBattery
          expr: network_ups_tools_ups_status{job="nut-observatory", flag="RB"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Observatory UPS battery needs replacing"
            description: "The EC450G sets RB (replace battery). Its battery is a 12V sealed lead-acid; replace it."
        # A healthy battery is back above 90% within a few hours of an outage.
        - alert: ObservatoryUPSBatteryNotCharging
          expr: |
            network_ups_tools_battery_charge{job="nut-observatory"} < 90
              and on(instance) network_ups_tools_ups_status{job="nut-observatory", flag="OL"} == 1
          for: 12h
          labels:
            severity: warning
          annotations:
            summary: "Observatory UPS battery stuck at {{ $value }}% on mains"
            description: "The EC450G has been on mains for 12h without recharging past 90%. The battery is probably worn out."
        # upsd down, the tailnet path broken, or the USB link to the UPS lost
        # (upsd then answers DATA-STALE and the exporter has nothing to give).
        # Not while the whole PC is unreachable: ObservatoryUnreachable covers that.
        - alert: ObservatoryUPSUnreachable
          expr: |
            (
              up{job="nut-observatory"} == 0
              or
              absent(
                network_ups_tools_ups_status{job="nut-observatory", flag="OL"} == 1
                or network_ups_tools_ups_status{job="nut-observatory", flag="OB"} == 1
              )
            )
            unless on() up{job="node_exporter_astro"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Observatory UPS not readable"
            description: "NUT on the observatory PC has no UPS data for 10m: the 'Network UPS Tools' service is down, the tailnet path is broken, or the UPS USB cable is out. Until it's back the PC will NOT shut down cleanly on a power cut. Check: upsc observatory@127.0.0.1 on the PC, and {job=\"observatory\", app=\"ups\"}."
        - alert: NetworkUPSOnBattery
          expr: network_ups_tools_ups_status{job="nut-network", flag="OB"} == 1
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "Mains is out: closet network UPS on battery"
            description: "The CP1500 carrying the router, modem, CRS310 and shelter fiber switch is on battery: {{ with query \"network_ups_tools_battery_runtime{job='nut-network'}\" }}{{ . | first | value | humanizeDuration }}{{ end }} of runtime left."
        - alert: NetworkUPSLowBattery
          expr: network_ups_tools_ups_status{job="nut-network", flag="LB"} == 1
          labels:
            severity: critical
          annotations:
            summary: "Closet network UPS battery low"
            description: "The CP1500 reports low battery (under 10% or 300s of runtime). The router, modem and shelter fiber go down when it runs out."
        - alert: NetworkUPSReplaceBattery
          expr: network_ups_tools_ups_status{job="nut-network", flag="RB"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Closet network UPS battery needs replacing"
            description: "The CP1500AVRLCD3 sets RB (replace battery)."
        - alert: NetworkUPSBatteryNotCharging
          expr: |
            network_ups_tools_battery_charge{job="nut-network"} < 90
              and on(instance) network_ups_tools_ups_status{job="nut-network", flag="OL"} == 1
          for: 12h
          labels:
            severity: warning
          annotations:
            summary: "Closet network UPS battery stuck at {{ $value }}% on mains"
            description: "The CP1500 has been on mains for 12h without recharging past 90%. The battery is probably worn out."
        - alert: NetworkUPSUnreachable
          expr: |
            up{job="nut-network"} == 0
              or
            absent(
              network_ups_tools_ups_status{job="nut-network", flag="OL"} == 1
              or network_ups_tools_ups_status{job="nut-network", flag="OB"} == 1
            )
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Closet network UPS not readable"
            description: "No data from NUT on the router for 10m: nut-server is down or the UPS USB cable is out. Check: ssh root@192.168.1.1 upsc ups@127.0.0.1 (the USB device must be owned by nut; /etc/hotplug.d/usb/30-libhid-ups sets that when the UPS is plugged in)."
