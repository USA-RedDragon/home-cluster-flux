# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json

controllers:
  nut-exporter:
    replicas: 1
    pod:
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
    containers:
      nut-exporter:
        image:
          repository: jacob.pub/ghcr.io/druggeri/nut_exporter
          tag: 3.3.0@sha256:276460d141c732772f8b1fcd785a7de272473e6d39fd85c32b163efc2999cb9a
          pullPolicy: IfNotPresent
        # NUT_EXPORTER_USERNAME / NUT_EXPORTER_PASSWORD: the read-only
        # k8s-monitor user in the observatory's upsd.users (home-cluster-secrets
        # nut-exporter.yaml).
        envFrom:
          - secretRef:
              name: nut-exporter
        env:
          - name: NUT_EXPORTER_VARIABLES
            value: battery.charge,battery.charge.low,battery.runtime,battery.runtime.low,battery.voltage,input.voltage,output.voltage,ups.load,ups.realpower.nominal,ups.status
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 64Mi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /metrics
                port: 9199
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /metrics
                port: 9199

service:
  nut-exporter:
    controller: nut-exporter
    ports:
      http:
        port: 9199
