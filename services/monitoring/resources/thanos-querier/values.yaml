# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/values.schema.json
defaultPodOptions:
  automountServiceAccountToken: false

controllers:
  thanos-querier:
    forceRename: thanos-querier-app
    strategy: Recreate
    pod:
      enableServiceLinks: true
      imagePullSecrets:
      - name: registry-quay
    containers:
      app:
        image:
          repository: jacob.pub/quay.io/thanos/thanos
          tag: v0.42.5@sha256:0a546b98a8dd47735456ab389983675ee363d68127e334937a9fceeea10da5e7
          pullPolicy: IfNotPresent
        args:
        - query
        - --http-address
        - 0.0.0.0:9090
        - --endpoint
        - dnssrv+_grpc._tcp.prometheus-stack-kube-prom-thanos-discovery.monitoring.svc.cluster.local
        # Blocks in the bucket, i.e. anything older than Prometheus' local retention.
        - --endpoint
        - dns+thanos-store-app.monitoring.svc.cluster.local:10901
        # Read the compactor's 5m/1h downsampled blocks for long ranges.
        - --query.auto-downsampling
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 400Mi
        ports:
        - name: query
          containerPort: 9090
          protocol: TCP
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 9090
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 9090
service:
  app:
    forceRename: thanos-querier-app
    controller: thanos-querier
    ports:
      query:
        port: 9090
