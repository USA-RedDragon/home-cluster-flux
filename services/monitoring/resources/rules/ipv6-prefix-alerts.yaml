apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ipv6-prefix
  namespace: monitoring
spec:
  groups:
    - name: ipv6-prefix
      rules:
        - alert: NodeIPv6PrefixOutsideHomeLanGroup
          expr: |
            count by (instance, device, address) (
              node_network_address_info{job="node-exporter", scope="global", address=~"[23][0-9a-f]{0,3}:.*", address!~"2600:8800:0:0[0-9a-f]{2}:.*"}
            ) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.instance }} has IPv6 address {{ $labels.address }} outside 2600:8800:0:0::/56"
            description: |
              The ISP delegated prefix changed or a node got a GUA from another prefix. The CiliumCIDRGroup home-lan-v6 (clusters/home/network-policies/deny-home-lan-v6.yaml) no longer covers the LAN, so pods with egress-internet can reach LAN hosts over IPv6.
              Renumber runbook: 1) read the new /56 from the router (ssh root@192.168.1.1 ifstatus wan6). 2) Replace 2600:8800:0:0::/56 with it in deny-home-lan-v6.yaml, in this alert, and in the CrowdSec mcswain/whitelists (services/crowdsec/resources/app/values.yaml), and run cscli allowlists add own-infra <new /56>. 3) Restart ds/cilium in kube-system so CiliumNode IPv6 addresses update. 4) Check hubble observe --verdict DROPPED shows the deny again for a pod to a LAN GUA.
