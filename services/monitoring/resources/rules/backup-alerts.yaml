# Backup CronJobs (restic, backup-sync, etcd/longhorn backups) that stop
# succeeding. KubeJobFailed only fires while a failed Job object exists, and
# these Jobs are deleted an hour after finishing, so a backup can fail every
# night unnoticed. The threshold follows the schedule: day-of-month
# schedules are monthly (35d), day-of-week schedules weekly (9d), the rest
# daily (2d).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backups
  namespace: monitoring
spec:
  groups:
    - name: backups
      rules:
        - alert: BackupStale
          expr: |
            (
              (time() - kube_cronjob_status_last_successful_time{cronjob=~".*(restic|backup).*"}) / 86400
                > 2
              and on (namespace, cronjob) kube_cronjob_info{schedule!~"\\S+ \\S+ [0-9].*|\\S+ \\S+ \\* \\S+ [^*].*"}
            )
            or
            (
              (time() - kube_cronjob_status_last_successful_time{cronjob=~".*(restic|backup).*"}) / 86400
                > 9
              and on (namespace, cronjob) kube_cronjob_info{schedule=~"\\S+ \\S+ \\* \\S+ [^*].*"}
            )
            or
            (
              (time() - kube_cronjob_status_last_successful_time{cronjob=~".*(restic|backup).*"}) / 86400
                > 35
              and on (namespace, cronjob) kube_cronjob_info{schedule=~"\\S+ \\S+ [0-9].*"}
            )
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Backup {{ $labels.namespace }}/{{ $labels.cronjob }} hasn't succeeded in {{ $value | printf \"%.0f\" }} days"
            description: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} last succeeded {{ $value | printf \"%.1f\" }} days ago. Its Jobs are cleaned up after an hour, so check the run's logs in Loki: {namespace=\"{{ $labels.namespace }}\", pod=~\"{{ $labels.cronjob }}-.*\"}"
        - alert: BackupNeverSucceeded
          expr: |
            (kube_cronjob_info{cronjob=~".*(restic|backup).*"}
              unless on (namespace, cronjob) kube_cronjob_status_last_successful_time)
            and on (namespace, cronjob) (time() - kube_cronjob_created) > 2 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Backup {{ $labels.namespace }}/{{ $labels.cronjob }} has never succeeded"
            description: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} is over 2 days old and has never completed successfully. Check its runs in Loki: {namespace=\"{{ $labels.namespace }}\", pod=~\"{{ $labels.cronjob }}-.*\"}"
        - alert: B2ScheduledBackupNotReady
          expr: |
            kube_customresource_b2backup_scheduledbackup_info{ready!="True", reason!="Suspended"}
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "ScheduledBackup {{ $labels.namespace }}/{{ $labels.name }} is not Ready ({{ $labels.reason }})"
            description: "b2-backup-operator reports ScheduledBackup {{ $labels.namespace }}/{{ $labels.name }} Ready={{ $labels.ready }} with reason {{ $labels.reason }} for over 1h, so its CronJob may not be current or may not fire. Run: b2bk doctor -n {{ $labels.namespace }} sb/{{ $labels.name }}"
        - alert: B2RepositoryNotReady
          expr: |
            kube_customresource_b2backup_repository_info{ready!="True", reason!="Suspended"}
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Backup Repository {{ $labels.namespace }}/{{ $labels.name }} is not Ready ({{ $labels.reason }})"
            description: "b2-backup-operator reports Repository {{ $labels.namespace }}/{{ $labels.name }} Ready={{ $labels.ready }} with reason {{ $labels.reason }} for over 1h. Backups into it cannot run until it is Ready. Run: b2bk doctor -n {{ $labels.namespace }} repo/{{ $labels.name }}"
        - alert: LonghornVolumeBackupStale
          expr: |
            (
              (time() - max by (volume, pvc_namespace, pvc) (longhorn_volume_last_backup_at)) / 86400 > 2
            )
            and on (volume)
            (
              max by (volume) (
                kube_customresource_longhorn_volume_recurring_job{default_group="enabled"}
                or kube_customresource_longhorn_volume_recurring_job{backup_job="enabled"}
              )
            )
            and on (volume)
            (
              time() - max by (volume) (kube_customresource_longhorn_volume_created) > 2 * 86400
            )
            unless on (volume)
            (
              max by (volume) (longhorn_volume_last_backup_at)
                > on (volume)
              max by (volume) (kube_customresource_longhorn_volume_last_pod_ref)
            )
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} has no backup in the last 2 days"
            description: "Volume {{ $labels.volume }} ({{ $labels.pvc_namespace }}/{{ $labels.pvc }}) is in the nightly Longhorn backup job but its last backup is {{ $value | printf \"%.0f\" }} days old (over 20000 means never). Detached volumes are skipped by the recurring job, so this only fires for one whose last backup predates its detach; back it up by hand from the Longhorn UI. For attached volumes check the backup-* Jobs in longhorn-system."
