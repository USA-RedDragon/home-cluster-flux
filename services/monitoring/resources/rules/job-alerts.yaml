apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: jobs
  namespace: monitoring
spec:
  groups:
    - name: jobs
      rules:
        - alert: CronJobFailing
          expr: |
            (
              (time() - kube_cronjob_status_last_successful_time{namespace!~"tfe"})
                > clamp_min(2 * (kube_cronjob_next_schedule_time - kube_cronjob_status_last_schedule_time), 7200)
              or
              (time() - kube_cronjob_created{namespace!~"tfe"})
                > clamp_min(2 * (kube_cronjob_next_schedule_time - kube_cronjob_status_last_schedule_time), 7200)
                unless on (namespace, cronjob) kube_cronjob_status_last_successful_time
            )
            and on (namespace, cronjob) kube_cronjob_spec_suspend == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has not succeeded for {{ $value | humanizeDuration }}"
            description: "No successful run in the longer of 2h or two schedule intervals. Clears on the next successful run. Check `kubectl -n {{ $labels.namespace }} get jobs` and the newest job's pod logs."
        - alert: KubeJobFailed
          expr: |
            kube_job_failed{namespace!~"tfe"} > 0
              unless on (namespace, job_name) kube_job_owner{owner_kind="CronJob"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed"
            description: "A Job not created by a CronJob failed. Delete it after checking its logs to clear this alert."
