# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/values.schema.json
controllers:
  metrics-actioner:
    forceRename: metrics-actioner-app
    strategy: Recreate
    serviceAccount:
      name: metrics-actioner
    pod:
      enableServiceLinks: true
      labels:
        policy.mcswain.dev/egress-kubeapi: 'true'
        policy.mcswain.dev/egress-coredns: 'true'
        policy.mcswain.dev/egress-internet: 'true'
    containers:
      app:
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/metrics-actioner
          tag: v0.0.17@sha256:6bb7a44843ca5c6388bd0745752a9c8e9b915e590248113424766a6bdc2f82c8
          pullPolicy: IfNotPresent
        args:
        - --config=/config/config.yaml
        resources:
          requests:
            cpu: 20m
            memory: 40Mi
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 8081
          protocol: TCP
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8080
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8080
service:
  app:
    forceRename: metrics-actioner-app
    controller: metrics-actioner
    ports:
      http:
        port: 8080
      metrics:
        port: 8081
configMaps:
  config:
    forceRename: config
    data:
      config.yaml: |
        http:
          pprof:
            enabled: true
          metrics:
            enabled: true
            ipv4_host: '0.0.0.0'
        actions:
        - match_common_labels:
            remediation: restart-trunk-recorder
          action: rollout-restart-deployment
          # The trunk-recorder alerts aggregate away the namespace label, so it
          # has to be given here or every restart fails "missing namespace option".
          options:
            deployment: trunk-recorder-app
            namespace: trunk-recorder
        - match_common_labels:
            alertname: TargetDown
            job: aredn-manager
          action: ssh
          options:
            command: 'docker restart oklahoma-tunnel'
            host: 'kp4djt.zapto.org'
            port: '333'
            user: 'ki5vmf'
            key: '/secrets/ki5vmf.pem'
            hostKeys: |
              [kp4djt.zapto.org]:333 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID8Dy1TZ1lN8WAZcgdODY9SNVWqWB+hGfsVEzMaUV7n+
              [kp4djt.zapto.org]:333 ssh-rsa 
              [kp4djt.zapto.org]:333 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBL7nYBnYt6DZYqQS3sVppbM5x9vKd3nNp5nZfSiaMU67PeYpzZ3mx/c+R3oWEY27RuLVuHm8DoZRpED4qyDgfL0=
persistence:
  config:
    type: configMap
    name: config
    items:
    - key: config.yaml
      path: config.yaml
    advancedMounts:
      metrics-actioner:
        app:
        - path: /config
  secrets:
    type: secret
    name: metrics-actioner-secrets
    items:
    - key: ki5vmf.pem
      path: ki5vmf.pem
    advancedMounts:
      metrics-actioner:
        app:
        - path: /secrets
          readOnly: true
