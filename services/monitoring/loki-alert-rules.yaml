# Log-based alerts, evaluated by the Loki ruler (loaded by its rules sidecar
# via the loki_rule label) and sent to the kube-prometheus-stack Alertmanager.
# Thresholds were checked against real data on 2026-09-28.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alert-rules
  namespace: monitoring
  labels:
    loki_rule: "1"
data:
  log-alerts.yaml: |
    groups:
      - name: log-pipeline
        rules:
          # "Logged in the last day but not the last 30m" per source. ESPHome
          # devices are excluded: at INFO they can legitimately stay quiet.
          - alert: LogSourceSilent
            expr: |
              (sum by (node) (count_over_time({job="talos"}[24h])))
                unless
              (sum by (node) (count_over_time({job="talos"}[30m])))
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Talos node {{ $labels.node }} has sent no logs for 30m"
              description: "Talos node {{ $labels.node }} has sent no logs for 30m. Check the talos-logs Vector pod on it and the node's machine.logging config."
          - alert: LogSourceSilent
            expr: |
              (sum by (host) (count_over_time({job="syslog", host=~"OpenWrt|truenas"}[24h])))
                unless
              (sum by (host) (count_over_time({job="syslog", host=~"OpenWrt|truenas"}[30m])))
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.host }} has sent no syslog for 30m"
              description: "{{ $labels.host }} has sent no syslog for 30m. Check its remote syslog setting and the alloy-gateway-syslog Service (192.168.254.13)."
          - alert: LogSourceSilent
            expr: absent_over_time({job="homeassistant"}[30m])
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Home Assistant has sent no logs for 30m"
              description: "Home Assistant has sent no logs for 30m. Check the local_loki_alloy add-on."
          - alert: LogSourceSilent
            expr: absent_over_time({job="observatory", app="symmetricds"}[30m])
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Observatory has sent no SymmetricDS logs for 30m"
              description: "The observatory has sent no SymmetricDS logs for 30m. Check the Alloy Windows service there, and SymmetricDS itself."
          - alert: LogSourceSilent
            expr: absent_over_time({job="kubernetes-events"}[30m])
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "No Kubernetes events reaching Loki for 30m"
              description: "No Kubernetes events have reached Loki for 30m. Check the alloy-gateway Deployment in monitoring."
          - alert: LogSourceSilent
            expr: absent_over_time({namespace="kube-system"}[15m])
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "No pod logs reaching Loki for 15m"
              description: "No pod logs have reached Loki for 15m (kube-system always logs). Check the alloy DaemonSet in monitoring."

      - name: log-hardware
        rules:
          # Grouped by root cause: one alert per unreachable NUT server (value =
          # number of clients affected), plus one for a driver with no UPS.
          # The observatory PC's Alloy ships System-log warnings and errors as
          # JSON. WHEA = machine-check / PCIe AER / memory errors reported by
          # the firmware; "Error" level means uncorrected.
          - alert: ObservatoryHardwareError
            expr: |
              sum by (levelText) (count_over_time({job="observatory", app="windows-system"}
                | json | source="Microsoft-Windows-WHEA-Logger" [15m])) > 0
            labels:
              severity: critical
            annotations:
              summary: "Observatory PC logged a WHEA hardware error ({{ $labels.levelText }})"
              description: "The firmware reported a CPU, memory or PCIe error on the observatory PC. Warning = corrected (watch for repeats), Error = uncorrected. Query: {job=\"observatory\", app=\"windows-system\"} | json | source=\"Microsoft-Windows-WHEA-Logger\""
          - alert: ObservatoryStorageErrors
            expr: |
              sum by (source, event_id) (count_over_time({job="observatory", app="windows-system"}
                | json | source=~"disk|Ntfs|Microsoft-Windows-Ntfs|volmgr|rcraid|rcbottom|stornvme|storahci|Microsoft-Windows-StorPort|Microsoft-Windows-Disk" [15m])) > 0
            labels:
              severity: critical
            annotations:
              summary: "Observatory PC storage error: {{ $labels.source }} event {{ $labels.event_id }}"
              description: "Disk, RAID driver or filesystem errors on the observatory PC (its C: is an AMD RAID1). Query: {job=\"observatory\", app=\"windows-system\"} | json | source=\"{{ $labels.source }}\""
          # The observatory's C: is an AMD RAID1 (two 990 EVOs) that Windows
          # always calls healthy. The "raid monitor" task polls rcadm every
          # 15 minutes into C:\ProgramData\raid-monitor\logs\raid.log.
          - alert: ObservatoryRAIDDegraded
            expr: sum by (state) (count_over_time({job="observatory", app="raid"} |= " raid DEGRADED " | regexp "state=(?P<state>\\S+)" [20m])) > 0
            labels:
              severity: critical
            annotations:
              summary: "Observatory RAID1 is {{ $labels.state }}"
              description: "The observatory's boot mirror has lost a member or is rebuilding. Detail and rebuild progress: {job=\"observatory\", app=\"raid\"}. Raw output: C:\\ProgramData\\raid-monitor\\logs\\last-run.txt"
          - alert: ObservatoryRAIDUnknown
            expr: sum(count_over_time({job="observatory", app="raid"} |= " raid ERROR " [20m])) > 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Observatory RAID status can't be read"
              description: "rcadm failed or its output didn't parse. Query: {job=\"observatory\", app=\"raid\"} |= \"ERROR\""
          - alert: ObservatoryRAIDMonitorSilent
            expr: absent_over_time({job="observatory", app="raid"} [45m])
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Observatory RAID monitor has not reported in 45m"
              description: "Check the 'raid monitor' scheduled task and the Alloy service on the observatory PC."
          # Daily at 13:00 as SYSTEM on the observatory PC
          # (C:\ProgramData\restic\backup.ps1), to B2 k8s/observatory.
          - alert: ObservatoryBackupFailed
            expr: sum(count_over_time({job="observatory", app="restic"} |= "restic backup FAILED" [1h])) > 0
            labels:
              severity: warning
            annotations:
              summary: "Observatory PC backup failed"
              description: "The observatory's restic backup failed. Query: {job=\"observatory\", app=\"restic\"}"
          - alert: ObservatoryBackupMissing
            expr: absent_over_time({job="observatory", app="restic"} |= "restic backup ok" [36h])
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Observatory PC has not backed up in 36h"
              description: "No successful restic backup from the observatory PC in 36h. Check the 'restic backup' scheduled task and C:\\ProgramData\\restic\\logs\\restic.log."
          # NUT on the observatory PC (C:\ProgramData\ups-shutdown\logs\ups.log).
          # Shutdown lines are written as the PC goes down and may only reach
          # Loki after it boots again (Alloy keeps its place in the file, and
          # the timestamp stage keeps their real time), hence the long window;
          # the RECOVERED line is written at that next boot.
          - alert: ObservatoryUPSShutdown
            expr: sum by (event) (count_over_time({job="observatory", app="ups"} |~ " ups (FSD|SHUTDOWN|RECOVERED) " | regexp " ups (?P<event>[A-Z]+) " [6h])) > 0
            labels:
              severity: critical
            annotations:
              summary: "Observatory UPS shutdown ({{ $labels.event }})"
              description: "The observatory PC was shut down by NUT after a power cut (or is back after one). Sequence: {job=\"observatory\", app=\"ups\"}"
          - alert: UPSServerUnreachable
            expr: |
              count by (ups_server) (sum by (ups_server, node, host) (count_over_time({job=~"talos|syslog"}
                |~ "(?i)(connect failed|driver not connected)"
                | regexp "(?:ups@|UPS \\[)(?P<ups_server>\\d+\\.\\d+\\.\\d+\\.\\d+)"
                | ups_server != "" [10m])))
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "UPS server {{ $labels.ups_server }} unreachable from {{ $value }} hosts"
              description: "{{ $value }} hosts (Talos nodes, router, NAS) cannot reach UPS server {{ $labels.ups_server }}, so they will not shut down cleanly on power loss. Which ones: {job=~\"talos|syslog\"} |= \"{{ $labels.ups_server }}\""
          - alert: UPSDriverNoDevice
            expr: |
              sum by (host) (count_over_time({job="homeassistant", identifier=~".*nut"}
                |~ "(?i)(No matching HID UPS|driver is (still )?not (currently )?connected)" [10m])) > 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "No UPS attached to the NUT server on {{ $labels.host }}"
              description: "The NUT driver on {{ $labels.host }} finds no USB UPS and restart-loops, so it serves nothing to its clients. Check the UPS USB cable."
          - alert: KernelStorageErrors
            expr: |
              sum by (node) (count_over_time({job="talos", service="kernel"}
                |~ "(?i)(I/O error|blk_update_request|critical medium error|nvme.*(timeout|reset controller|controller is down)|EXT4-fs error|XFS .*(metadata I/O error|corruption|shut down)|Out of memory: Killed process)"
                != "Memory cgroup" [10m])) > 0
            labels:
              severity: critical
            annotations:
              summary: "Kernel storage/memory errors on {{ $labels.node }}"
              description: "Disk I/O, NVMe, filesystem errors or a host-level OOM kill in the last 10m. Container memory-limit OOMs are excluded (metrics cover those). Query: {job=\"talos\", node=\"{{ $labels.node }}\", service=\"kernel\"}"
          - alert: NASStorageEvents
            expr: |
              sum by (app) (count_over_time({job="syslog", host="truenas", app=~"zed|smartd|zfs.*|kernel"}
                |~ "(?i)(FAILING_NOW|Currently unreadable|Offline uncorrectable|self-test.*fail|SMART Failure|DEGRADED|FAULTED|UNAVAIL|checksum error|io error|data error|vdev.*(removed|fault))"
                != "Raw_Read_Error_Rate" [10m])) > 0
            labels:
              severity: critical
            annotations:
              summary: "TrueNAS storage event from {{ $labels.app }}"
              description: "ZFS pool/vdev state change or SMART failure on the NAS. Query: {host=\"truenas\", app=\"{{ $labels.app }}\"}"
          # Cable modem health, from the router side. Nothing polls the Arris S33
          # any more (HNAP scraping crashed it; modem-exporter removed 2026-10-04).
          # Baseline without polling was one drop pair (10 min apart) in 5.6 days.
          - alert: WANDropsRepeating
            expr: |
              sum(count_over_time({host="OpenWrt"} |= "Interface 'wan' has lost the connection" [24h])) >= 3
            labels:
              severity: warning
            annotations:
              summary: "WAN dropped {{ $value }} times in 24h"
              description: "The cable modem keeps losing the link and nothing is polling it, so suspect modem firmware/hardware or Cox's plant (mid-split rollout). Give Cox the drop times from: {host=\"OpenWrt\"} |= \"Interface 'wan' has lost the connection\" (not the modem's DRW/T3 ranging messages, which are routine)."

      - name: log-apps
        rules:
          - alert: SymmetricDSErrors
            expr: sum(count_over_time({job="observatory", app="symmetricds"} |= " ERROR " [30m])) > 10
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Observatory SymmetricDS logged {{ $value }} errors in 30m"
              description: "Target Scheduler sync to astro-processing is failing repeatedly (often SQLITE_BUSY). Query: {job=\"observatory\", app=\"symmetricds\"} |= \" ERROR \""
          # The AM5 refuses a sync more than a few degrees from where it thinks
          # it points. On 2026-10-05/06 it had lost its position by ~20 deg:
          # NINA still centred by offset, but flips and limits ran on the wrong
          # position and a night of subs carried bogus header coordinates.
          - alert: NINAMountSyncFailed
            expr: sum(count_over_time({job="observatory", app="nina"} |= "Failed to SyncToCoordinates" [15m])) > 0
            labels:
              severity: critical
            annotations:
              summary: "Mount rejected {{ $value }} plate-solve syncs in 15m"
              description: "The AM5 refused SyncToCoordinates after a solve: it has lost its home position (or the target is within 5 deg of the pole). Its flip and limit decisions are wrong until it is re-homed. Query: {job=\"observatory\", app=\"nina\"} |= \"SyncToCoordinates\""
          - alert: NINAPlateSolveFailing
            expr: sum(count_over_time({job="observatory", app="nina"} |= "Plate solve failed" [1h])) >= 20
            labels:
              severity: warning
            annotations:
              summary: "{{ $value }} plate solves failed in the last hour"
              description: "Clouds, focus, or a mount far off target. Query: {job=\"observatory\", app=\"nina\"} |= \"Plate solve failed\""
          - alert: K8sWarningEventStorm
            expr: |
              sum by (namespace, reason) (count_over_time({job="kubernetes-events", type="Warning"} | json | __error__="" [15m])) > 20
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.reason }} events repeating in {{ $labels.namespace }}"
              description: "More than 20 {{ $labels.reason }} warning events in 15m, usually a controller stuck retrying. Query: {job=\"kubernetes-events\", type=\"Warning\", namespace=\"{{ $labels.namespace }}\"}"
