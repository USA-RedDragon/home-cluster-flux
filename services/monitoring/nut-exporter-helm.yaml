# Prometheus exporter for NUT servers. Scraped per UPS by the ScrapeConfigs in
# ups-alerts.yaml (/ups_metrics?server=...&ups=...).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nut-exporter
  namespace: monitoring
spec:
  install:
    remediation:
      retries: -1
  interval: 60m0s
  driftDetection:
    mode: enabled
  releaseName: nut-exporter
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: nut-exporter-chart-values
