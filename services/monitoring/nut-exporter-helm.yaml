# Prometheus exporter for NUT servers. Scraped per UPS by the ScrapeConfigs in
# ups-alerts.yaml (/ups_metrics?server=...&ups=...).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nut-exporter
  namespace: monitoring
spec:
  install:
    remediation:
      retries: -1
  interval: 60m0s
  driftDetection:
    mode: enabled
  releaseName: nut-exporter
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: '5.2.1'
      interval: 60m0s
  valuesFrom:
    - kind: ConfigMap
      name: nut-exporter-chart-values
