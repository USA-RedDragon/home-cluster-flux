# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Receives Talos service and kernel logs and pushes them to Loki. Alloy has no
# raw JSON-lines receiver, so this is Vector. It runs on the host network but
# binds 127.0.0.1 only: each node's Talos sends to its own local copy, and
# nothing is reachable from off the node. The Talos side is
# machine.logging.destinations + KmsgLogConfig in the talos repo.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: talos-logs
  namespace: monitoring
spec:
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: bjw-s
  interval: 1h
  driftDetection:
    mode: enabled
  dependsOn:
    - name: loki
  values:
    defaultPodOptions:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

    controllers:
      talos-logs:
        type: daemonset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          vector:
            image:
              repository: jacob.pub/docker.io/timberio/vector
              tag: 0.58.0-distroless-libc@sha256:6c93dfe2554cc7e38316d618961cd657d5271c7a7aa727e0007502b28cb82c2e
            args: ["--config", "/etc/vector/vector.yaml"]
            env:
              NODE_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

    configMaps:
      config:
        data:
          vector.yaml: |
            data_dir: /var/lib/vector
            sources:
              talos_service:
                type: socket
                mode: udp
                address: 127.0.0.1:6050
                decoding:
                  codec: json
              talos_kernel:
                type: socket
                mode: udp
                address: 127.0.0.1:6051
                decoding:
                  codec: json
            transforms:
              talos:
                type: remap
                inputs: [talos_service, talos_kernel]
                source: |
                  .node = get_env_var("NODE_NAME") ?? "unknown"
                  svc = del(."talos-service")
                  .service = if is_null(svc) { "kernel" } else { svc }
                  if exists(."talos-level") { .level = del(."talos-level") }
                  .timestamp = parse_timestamp(del(."talos-time"), "%+") ?? now()
                  del(.host)
                  del(.port)
                  del(.source_type)
              # delta and epsilon run SELinux in permissive mode (the other
              # nodes never load it) and log every would-be denial: ~194k
              # audit record lines/h, mostly pod writes to unlabeled volumes.
              # Nothing is enforced, so drop the records; the kernel's
              # "audit: rate limit exceeded" summaries still come through.
              drop_audit:
                type: filter
                inputs: [talos]
                condition: '!match(to_string(.msg) ?? "", r''^type=(AVC|USER_AVC|SYSCALL|PATH|PROCTITLE|CWD|EOE|SOCKADDR|MAC_STATUS) '')'
              # The Talos console dashboard polls machined over localhost with
              # the same 10 read-only calls, and each call logs an authz line
              # plus an OK line: ~14k lines/h per node. Drop those calls and
              # successful authz lines; other methods' OK lines (apply-config,
              # reboot, ...) still come through as the audit trail.
              drop_dashboard_polls:
                type: filter
                inputs: [drop_audit]
                condition: |
                  msg = to_string(.msg) ?? ""
                  authz = match(msg, r'machined/authz/authorizer authorized \(')
                  poll = match(msg, r'machined OK \[/machine\.MachineService/(Version|SystemStat|ServiceList|Processes|NetworkDeviceStats|Memory|LoadAvg|DiskStats|CPUInfo|CPUFreqStats)\] \S+ unary Success')
                  !(.service == "machined" && (authz || poll))
            sinks:
              loki:
                type: loki
                inputs: [drop_dashboard_polls]
                endpoint: http://loki.monitoring.svc.cluster.local:3100
                encoding:
                  codec: json
                  except_fields: [node, service, timestamp]
                # app-template runs this through Helm tpl, so Vector's braces are escaped.
                labels:
                  job: talos
                  node: '{{ "{{" }} node }}'
                  service: '{{ "{{" }} service }}'
                out_of_order_action: accept

    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/vector
      data:
        type: emptyDir
        globalMounts:
          - path: /var/lib/vector
