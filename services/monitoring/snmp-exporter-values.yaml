fullnameOverride: snmp-exporter

# The image's built-in snmp.yml already has the modules we need: if_mib (port
# counters, link state and speed) and mikrotik (SFP DOM, board temperature,
# fans). The switches take the default "public" v2c community (auth public_v2).
image:
  repository: jacob.pub/quay.io/prometheus/snmp-exporter

resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    memory: 128Mi

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

serviceMonitor:
  enabled: false
