# Single replica that feeds Loki from outside the log DaemonSet:
# - Kubernetes events, once rather than once per node. The API server drops
#   events after an hour; Loki keeps them 30d.
# - LAN syslog on 192.168.254.13 (alloy-gateway-syslog Service).
# - A push-only Loki API on the tailnet (alloy-gateway-push Service), so
#   tailnet hosts can send logs without being able to query Loki.
image:
  registry: jacob.pub/docker.io
  repository: grafana/alloy
  tag: v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
  digest: sha256:5379c6abea0695b640b0adb5e8fa1317d99d11f6a28cad423be0a638f897cbca

configReloader:
  image:
    registry: jacob.pub/quay.io
    repository: prometheus-operator/prometheus-config-reloader
    tag: v0.94.0@sha256:142a1f11df8dd165f00375b0b1826aecb9c9adeb05c39855893138d7c7575ff7

# The alloy release already owns the PodLogs CRD.
crds:
  create: false

alloy:
  enableReporting: false
  # For syslog_format = "raw" on the UDP listener (lenient ESPHome parsing).
  # Nothing else in this config is experimental.
  stabilityLevel: experimental
  extraPorts:
    - name: push
      port: 3500
      targetPort: 3500
      protocol: TCP
    - name: syslog-udp
      port: 5514
      targetPort: 5514
      protocol: UDP
    - name: syslog-tcp
      port: 5601
      targetPort: 5601
      protocol: TCP
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  configMap:
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      loki.source.kubernetes_events "cluster" {
        log_format = "json"
        forward_to = [loki.process.events.receiver]
      }

      // Normal/Warning is low-cardinality and the most useful filter.
      loki.process "events" {
        stage.json {
          expressions = { type = "type", reason = "reason" }
        }
        // Kyverno audit results were 99.6% of Warning events and already
        // live in its PolicyReports; they buried the real warnings.
        stage.drop {
          source = "reason"
          value  = "PolicyViolation"
        }
        stage.labels {
          values = { type = "" }
        }
        stage.static_labels {
          values = { job = "kubernetes-events" }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.source.api "push" {
        http {
          listen_address = "0.0.0.0"
          listen_port    = 3500
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.relabel "syslog" {
        forward_to = []
        rule {
          source_labels = ["__syslog_message_hostname"]
          target_label  = "host"
        }
        rule {
          source_labels = ["__syslog_message_app_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__syslog_message_severity"]
          target_label  = "level"
        }
        rule {
          source_labels = ["__syslog_connection_ip_address"]
          target_label  = "source_ip"
        }
      }

      // TCP/RFC5424: TrueNAS.
      loki.source.syslog "tcp" {
        listener {
          address       = "0.0.0.0:5601"
          protocol      = "tcp"
          syslog_format = "rfc5424"
          labels        = { job = "syslog" }
        }
        relabel_rules = loki.relabel.syslog.rules
        forward_to    = [loki.write.default.receiver]
      }

      // UDP/RFC3164: OpenWrt logd and ESPHome. ESPHome omits the timestamp
      // until SNTP syncs after boot, which the strict rfc3164 parser rejects
      // (losing reset reasons), so take it raw and parse leniently here.
      // Raw mode still decodes the priority into severity/facility.
      loki.relabel "syslog_udp" {
        forward_to = []
        rule {
          source_labels = ["__syslog_message_severity"]
          target_label  = "level"
        }
        rule {
          source_labels = ["__syslog_connection_ip_address"]
          target_label  = "source_ip"
        }
      }

      loki.source.syslog "udp" {
        listener {
          address       = "0.0.0.0:5514"
          protocol      = "udp"
          syslog_format = "raw"
          labels        = { job = "syslog" }
        }
        relabel_rules = loki.relabel.syslog_udp.rules
        forward_to    = [loki.process.syslog_udp.receiver]
      }

      loki.process "syslog_udp" {
        stage.regex {
          expression = "^(?:[A-Z][a-z]{2} [ \\d]\\d \\d{2}:\\d{2}:\\d{2} )?(?P<host>\\S+) (?P<app>[^\\s:\\[]+)(?:\\[\\d+\\])?: (?P<msg>.*)$"
        }
        stage.labels {
          values = { host = "", app = "" }
        }
        stage.output {
          source = "msg"
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

controller:
  type: deployment
  replicas: 1

serviceMonitor:
  enabled: true
