# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Polls the ARRIS S33 cable modem (192.168.100.1) over its HNAP API: channel
# metrics for Prometheus, and its DOCSIS event log (T3/T4 timeouts, SYNC
# failures, ranging problems) pushed to Loki as {job="modem"}.
# Password: Secret modem-admin (key: password) from home-cluster-secrets.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: modem-exporter
  namespace: monitoring
spec:
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: bjw-s
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    controllers:
      modem-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          exporter:
            image:
              repository: jacob.pub/docker.io/library/python
              tag: 3.13-alpine@sha256:9b7c4b429185ca4a4454b6b67888b91e9c0b4d3432bde91a4fd3b30b681565ba
            command: ["python3", "-u", "/app/exporter.py"]
            env:
              MODEM_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: modem-admin
                    key: password
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: 9100
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: 9100
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 96Mi

    service:
      modem-exporter:
        controller: modem-exporter
        ports:
          metrics:
            port: 9100

    serviceMonitor:
      modem-exporter:
        serviceName: modem-exporter
        endpoints:
          - port: metrics
            interval: 1m

    persistence:
      script:
        type: configMap
        name: modem-exporter-script
        globalMounts:
          - path: /app
