apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - helm.yaml
  - prom.yaml
configMapGenerator:
  - name: modem-exporter-script
    files:
      - exporter.py
generatorOptions:
  # Fixed name so the HelmRelease can mount it; reloader restarts the pod on change.
  disableNameSuffixHash: true
