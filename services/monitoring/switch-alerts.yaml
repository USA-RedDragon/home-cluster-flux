apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: switches
  namespace: monitoring
spec:
  staticConfigs:
    - targets: ["192.168.1.3"]
      labels:
        instance: downstairs-10g
        job: switches
    - targets: ["192.168.1.4"]
      labels:
        instance: rack-10g
        job: switches
    - targets: ["192.168.1.6"]
      labels:
        instance: closet-1g
        job: switches
    - targets: ["192.168.1.8"]
      labels:
        instance: closet-2.5g
        job: switches
  metricsPath: /snmp
  params:
    module: ["if_mib", "mikrotik"]
    auth: ["public_v2"]
  scrapeInterval: 30s
  scrapeTimeout: 10s
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - targetLabel: __address__
      replacement: snmp-exporter.monitoring.svc.cluster.local:9116
  metricRelabelings:
    - regex: ifAlias|ifDescr
      action: labeldrop
    - sourceLabels: [__name__]
      regex: if(In|Out)(Octets|UcastPkts|NUcastPkts|MulticastPkts|BroadcastPkts)|ifSpeed|ifSpecific|ifOutQLen|ifInUnknownProtos
      action: drop
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: switches
  namespace: monitoring
spec:
  groups:
    - name: switches
      rules:
        - alert: SwitchUnreachable
          expr: up{job="switches"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Switch {{ $labels.instance }} not answering SNMP"
            description: "No SNMP data from {{ $labels.instance }} for 5m. Either the switch is down or SNMP was turned off in SwOS (SNMP tab, community public)."
        - alert: SwitchPortErrors
          expr: |
            increase(ifInErrors{job="switches"}[1h])
              + increase(ifOutErrors{job="switches"}[1h])
              > 20
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} port {{ $labels.ifName }}: {{ $value | humanize }} errors in the last hour"
            description: "Errors (FCS, runts, collisions) are growing on {{ $labels.instance }} {{ $labels.ifName }}. Usually a bad DAC/fiber/transceiver or a dirty connector. Check the per-type counters: curl -s --digest -u 'admin:' http://<switch>/stats.b (rfcs, rte, rae)."
        - alert: SwitchPortFlapping
          expr: changes(ifOperStatus{job="switches"}[30m]) >= 4
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} port {{ $labels.ifName }} is flapping"
            description: "The link on {{ $labels.instance }} {{ $labels.ifName }} went up/down {{ $value }} times in 30m."
        - alert: SwitchPortSpeedDegraded
          expr: |
            ifHighSpeed{job="switches", ifName!~".*-pc"} > 0
              and ifHighSpeed{job="switches", ifName!~".*-pc"}
                < max_over_time(ifHighSpeed{job="switches", ifName!~".*-pc"}[1d])
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} port {{ $labels.ifName }} linked at {{ $value }} Mbit/s, below its usual speed"
            description: "{{ $labels.instance }} {{ $labels.ifName }} renegotiated down from {{ with printf \"max_over_time(ifHighSpeed{job='switches', instance='%s', ifName='%s'}[1d])\" $labels.instance $labels.ifName | query }}{{ . | first | value }}{{ end }} Mbit/s. Usually a failing cable/DAC or a module that fell back to 1G."
        - alert: SwitchHot
          expr: mtxrHlProcessorTemperature{job="switches"} / 10 > 85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Switch {{ $labels.instance }} at {{ $value }}C"
            description: "{{ $labels.instance }}'s CPU has been over 85C for 15m. Check its airflow and, on the CRS326s, the fans."
        - alert: SwitchFanStopped
          expr: mtxrHlFanSpeed1{job="switches"} == 0 or mtxrHlFanSpeed2{job="switches"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Switch {{ $labels.instance }} has a stopped fan"
            description: "A fan on {{ $labels.instance }} reads 0 RPM."
        - alert: SwitchSFPHot
          expr: mtxrOpticalTemperature{job="switches"} > 70 < 200
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} {{ $labels.mtxrOpticalName }} transceiver at {{ $value }}C"
            description: "The SFP/QSFP module in {{ $labels.instance }} {{ $labels.mtxrOpticalName }} has run over 70C for 15m. Most modules are rated to 70C."
