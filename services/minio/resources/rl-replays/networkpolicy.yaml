apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: rl-replays-iam
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: rl-replays-iam
  ingress:
    - {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: minio
            app.kubernetes.io/name: minio
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
