apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: models-iam
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: models-iam
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: minio
            app.kubernetes.io/name: minio
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
