apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: minio
resources:
  - networkpolicy.yaml
  - iam-job.yaml
  - copy-job.yaml
configMapGenerator:
  - name: sky-survey-iam
    files:
      - iam.sh
      - sky-survey-rw.json=../../policies/sky-survey-rw.json
      - sky-survey-read.json=../../policies/sky-survey-read.json
  - name: sky-survey-copy
    files:
      - copy.sh
