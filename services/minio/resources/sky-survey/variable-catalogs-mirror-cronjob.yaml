apiVersion: batch/v1
kind: CronJob
metadata:
  name: gaia-vari-mirror
spec:
  schedule: "27 6 4 * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        metadata:
          labels:
            app.kubernetes.io/name: catalog-mirror-cds
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mirror
              image: jacob.pub/ghcr.io/usa-reddragon/astro-stacker:beta@sha256:793304bad12822bb48d2921f6f198b78943fc51c7109c9e7dc009de15f5e094c
              command:
                - /astro-stacker
                - catalog-mirror
                - gaia-vari
                - --rate-mb=50
              env:
                - name: GOMEMLIMIT
                  value: 5GiB
                - name: CATALOG_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sky-survey-writer
                      key: accesskey
                - name: CATALOG_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sky-survey-writer
                      key: secretkey
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 6Gi
---
