apiVersion: batch/v1
kind: CronJob
metadata:
  name: gaia-vari-mirror
spec:
  schedule: "27 6 4 * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 6
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: catalog-mirror-cds
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: [alpha, beta, gamma, delta]
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: catalog-mirror-cds
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mirror
              image: jacob.pub/ghcr.io/usa-reddragon/astro-stacker:beta@sha256:01929b151903d6c52d4fd778118bb92132bd2d44f9d5db9d9829e718433f5d9d
              command:
                - /astro-stacker
                - catalog-mirror
                - gaia-vari
                - --rate-mb=50
              env:
                - name: GOMEMLIMIT
                  value: 5GiB
                - name: CATALOG_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sky-survey-writer
                      key: accesskey
                - name: CATALOG_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sky-survey-writer
                      key: secretkey
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 500m
                  memory: 6Gi
                limits:
                  cpu: "2"
                  memory: 6Gi
---
