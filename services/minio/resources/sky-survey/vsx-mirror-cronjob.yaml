apiVersion: batch/v1
kind: CronJob
metadata:
  name: vsx-mirror
spec:
  schedule: "17 6 3 * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 6
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: catalog-mirror-vsx
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: [alpha, beta, gamma, delta]
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: catalog-mirror-vsx
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mirror
              image: jacob.pub/ghcr.io/usa-reddragon/astro-stacker:beta@sha256:f70377a08ac6975fadfb535bc2670812e3301bf52a3590088671e7fb338d5d51
              command:
                - /astro-stacker
                - catalog-mirror
                - vsx
                - --rate-mb=50
              env:
                - name: GOMEMLIMIT
                  value: 5GiB
                - name: CATALOG_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sky-survey-writer
                      key: accesskey
                - name: CATALOG_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sky-survey-writer
                      key: secretkey
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 500m
                  memory: 6Gi
                limits:
                  cpu: "2"
                  memory: 6Gi
