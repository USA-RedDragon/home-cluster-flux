apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: astro-stacker-jobs
rules:
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: astro-stacker-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: astro-stacker-jobs
subjects:
  - kind: ServiceAccount
    name: astro-stacker
    namespace: astro-processing
