apiVersion: batch/v1
kind: Job
metadata:
  name: sky-survey-copy
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sky-survey-copy
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy
          image: jacob.pub/ghcr.io/rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
          command:
            - /bin/sh
            - /scripts/copy.sh
          env:
            - name: ORDERS
              value: "0 1 2 3 4 5 6 7 8"
            - name: RCLONE_CONFIG
              value: /work/rclone.conf
            - name: RCLONE_CONFIG_SRC_TYPE
              value: s3
            - name: RCLONE_CONFIG_SRC_PROVIDER
              value: AWS
            - name: RCLONE_CONFIG_SRC_REGION
              value: us-east-1
            - name: RCLONE_CONFIG_DST_TYPE
              value: s3
            - name: RCLONE_CONFIG_DST_PROVIDER
              value: Minio
            - name: RCLONE_CONFIG_DST_ENDPOINT
              value: http://minio.minio.svc:9000
            - name: RCLONE_CONFIG_DST_REGION
              value: us-east-1
            - name: RCLONE_CONFIG_DST_NO_CHECK_BUCKET
              value: "true"
            - name: RCLONE_CONFIG_DST_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: sky-survey-writer
                  key: accesskey
            - name: RCLONE_CONFIG_DST_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: sky-survey-writer
                  key: secretkey
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: work
              mountPath: /work
      volumes:
        - name: scripts
          configMap:
            name: sky-survey-copy
        - name: work
          emptyDir: {}
