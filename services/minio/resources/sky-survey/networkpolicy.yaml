apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sky-survey-iam
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: sky-survey-iam
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: minio
            app.kubernetes.io/name: minio
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sky-survey-copy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: sky-survey-copy
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: stpubdata.s3.amazonaws.com
        - matchName: stpubdata.s3.us-east-1.amazonaws.com
        - matchName: s3.amazonaws.com
        - matchName: s3.us-east-1.amazonaws.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: minio
            app.kubernetes.io/name: minio
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
