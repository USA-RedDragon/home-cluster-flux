apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: minio
spec:
  install:
    remediation:
      retries: -1
  interval: 60m0s
  releaseName: minio
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: chart-values
