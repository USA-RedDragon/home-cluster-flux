apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: anubis
  namespace: zot
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: zot
  extAuth:
    failOpen: true
    headersToExtAuth: [cookie, user-agent, accept, accept-language, accept-encoding, authorization, x-envoy-external-address]
    http:
      backendRefs:
        - name: anubis-jacob-pub
          namespace: anubis
          port: 8080
      path: /check
