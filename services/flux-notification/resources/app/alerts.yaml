---
# GitHub commit statuses. Each Alert may only list Kustomizations whose
# sourceRef is that repo's GitRepository: the event revision is a commit SHA
# of that source, and posting it to any other repo fails with
# "422 No commit found for SHA". Add new Kustomizations here by name.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: github-status-home-cluster-flux
  namespace: flux-system
spec:
  providerRef:
    name: github-home-cluster-flux
  # GitRepository flux-system/flux-system
  eventSources:
    - kind: Kustomization
      name: apps
    - kind: Kustomization
      name: cilium
    - kind: Kustomization
      name: helm-repos
    - kind: Kustomization
      name: infrastructure
    - kind: Kustomization
      name: metallb
    - kind: Kustomization
      name: network-policies
    - kind: Kustomization
      name: services
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: github-status-home-cluster-secrets
  namespace: flux-system
spec:
  providerRef:
    name: github-home-cluster-secrets
  # GitRepository flux-system/secrets
  eventSources:
    - kind: Kustomization
      name: secrets
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: github-status-home-cluster-sensitive
  namespace: flux-system
spec:
  providerRef:
    name: github-home-cluster-sensitive
  # GitRepository flux-system/sensitive
  eventSources:
    - kind: Kustomization
      name: sensitive
    - kind: Kustomization
      name: camo
      namespace: camo
