apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: static-services
  namespace: static-services
spec:
  interval: 1h
  targetNamespace: static-services
  path: ./services/static-services/resources
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
