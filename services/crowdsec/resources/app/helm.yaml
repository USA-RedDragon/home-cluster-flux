apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: crowdsec
spec:
  install:
    remediation:
      retries: -1
  interval: 60m0s
  maxHistory: 2
  driftDetection:
    mode: enabled
  releaseName: crowdsec
  chart:
    spec:
      chart: crowdsec
      sourceRef:
        kind: HelmRepository
        name: crowdsec
        namespace: flux-system
      version: '0.24.2'
      interval: 60m0s
  valuesFrom:
    - kind: ConfigMap
      name: chart-values
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: crowdsec-appsec-service
            patch: |
              - op: add
                path: /spec/ports/-
                value:
                  name: appsec-vpatch
                  port: 7423
                  targetPort: 7423
                  protocol: TCP
