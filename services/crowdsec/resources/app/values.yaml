# CrowdSec: detection from Loki (no node log tailing), decisions enforced at the edges
# (OpenWrt firewall bouncer for every WAN port-forward; the VPS runs its own bouncer).
#
# Sources:
#   - public Envoy access logs: HTTP routes go through the hub HTTP scenarios, TCP/UDP routes
#     through mcswain/envoy-l4-flood
#   - router kernel log: "cs-dnat:" new connections to port-forwards that bypass Envoy
#     (router-dnat-flood) and fw4 WAN rejects (hub iptables port-scan scenarios)
#
# LIVE since 2026-10-09: bans are enforced by the router and VPS firewall bouncers. Our own public
# IPs (VPS, home WAN) are in the LAPI allowlist 'own-infra' (cscli allowlists; not in git).

container_runtime: containerd

image:
  repository: jacob.pub/docker.io/crowdsecurity/crowdsec
  tag: v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
  kubectl:
    repository: jacob.pub/docker.io/alpine/kubectl
    tag: 1.37.1@sha256:b57b3bd3cd9f4f02dd444281857126aa78efa4b7b7e6ec57579dd927bf146fc3

config:
  simulation.yaml: |
    simulation: false

  # Repeat offenders: 4h for a first ban, +4h per earlier decision on the same IP, capped at 7 days.
  profiles.yaml: |
    name: default_ip_remediation
    filters:
      - Alert.Remediation == true && Alert.GetScope() == "Ip"
    decisions:
      - type: ban
        duration: 4h
    duration_expr: Sprintf('%dh', min((GetDecisionsCount(Alert.GetValue()) + 1) * 4, 168))
    notifications:
      - telegram
    on_success: break
    ---
    name: default_range_remediation
    filters:
      - Alert.Remediation == true && Alert.GetScope() == "Range"
    decisions:
      - type: ban
        duration: 4h
    on_success: break

  # Telegram ban alerts (http plugin, runs in LAPI). The bot token comes from the crowdsec-telegram
  # secret via lapi.envFrom and is env-expanded in the URL. The chat id is literal: ${VARS} inside
  # format went out unexpanded, and a group id is useless without the token.
  notifications:
    telegram.yaml: |
      type: http
      name: telegram
      log_level: info
      group_wait: 30s
      group_threshold: 10
      max_retry: 5
      timeout: 15s
      # No bare $vars that could match an env var: CrowdSec env-expands plugin configs ($_ is set by shells).
      # Every dynamic value goes through html: one stray '<' (e.g. a nil field's "<no value>") and Telegram 400s the message.
      format: |
        {
          "chat_id": "-5455010891",
          "parse_mode": "HTML",
          "disable_web_page_preview": true,
          "text": "{{range . -}}{{$tgHosts := dict -}}{{range .Events}}{{range .Meta}}{{if eq .Key "target_fqdn"}}{{if set $tgHosts .Value ""}}{{end}}{{end}}{{end}}{{end -}}&#128683; <b>{{html .Source.IP}}</b>{{range .Decisions}} banned {{html .Duration}}{{end}}\n{{html .Source.Cn}} &#183; {{html .Source.AsName}} (AS{{html .Source.AsNumber}})\nRule: <code>{{html .Scenario}}</code> ({{len .Events}} events){{if $tgHosts}}\nHosts: {{html (keys $tgHosts | sortAlpha | join ", ")}}{{end}}\n<a href=\"https://app.crowdsec.net/cti/{{html .Source.IP}}\">CTI</a> &#183; unban: <code>cscli decisions delete --ip {{html .Source.IP}}</code>\n\n{{end}}"
        }
      url: https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage
      method: POST
      headers:
        Content-Type: application/json

  parsers:
    s01-parse:
      mcswain-envoy-gateway.yaml: |
        name: mcswain/envoy-gateway-logs
        description: "Envoy Gateway JSON access logs from the public gateway (HTTP, TCP and UDP routes)"
        filter: |
          evt.Parsed.program == 'envoy-gateway' &&
          UnmarshalJSON(evt.Parsed.message, evt.Unmarshaled, 'envoy') in ['', nil] &&
          evt.Unmarshaled.envoy.downstream_remote_address != nil
        onsuccess: next_stage
        nodes:
          - grok:
              # "1.2.3.4:5678" or "[2001:db8::1]:5678"
              pattern: '^\[?%{IP:remote_addr}\]?:%{INT:remote_port}$'
              expression: evt.Unmarshaled.envoy.downstream_remote_address
            nodes:
              - filter: "evt.Unmarshaled.envoy.method != nil"
                statics:
                  - meta: log_type
                    value: http_access-log
                  - meta: service
                    value: http
                  - parsed: verb
                    expression: evt.Unmarshaled.envoy.method
                  - meta: http_verb
                    expression: evt.Unmarshaled.envoy.method
                  - parsed: request
                    expression: evt.Unmarshaled.envoy["x-envoy-origin-path"] ?? "/"
                  - meta: http_path
                    expression: evt.Parsed.request
                  - parsed: status
                    expression: Sprintf("%v", evt.Unmarshaled.envoy.response_code)
                  - meta: http_status
                    expression: evt.Parsed.status
                  - parsed: http_user_agent
                    expression: evt.Unmarshaled.envoy["user-agent"] ?? ""
                  - meta: http_user_agent
                    expression: evt.Parsed.http_user_agent
                  - meta: target_fqdn
                    expression: evt.Unmarshaled.envoy[":authority"] ?? ""
              - filter: "evt.Unmarshaled.envoy.method == nil"
                statics:
                  - meta: log_type
                    value: envoy_l4
                  # e.g. tcproute/gitea/gitea-git-public/rule/-1
                  - meta: service
                    expression: evt.Unmarshaled.envoy.upstream_cluster ?? "no-route"
        statics:
          - meta: source_ip
            expression: evt.Parsed.remote_addr
          - target: evt.StrTime
            expression: evt.Unmarshaled.envoy.start_time

    s02-enrich:
      mcswain-whitelists.yaml: |
        name: mcswain/whitelists
        description: "Trusted sources: tailnet, home WAN, GitHub webhooks (private ranges are covered by crowdsecurity/whitelists)"
        whitelist:
          reason: "trusted source"
          cidr:
            - 100.64.0.0/10
            - fd7a:115c:a1e0::/48
            - 68.12.95.206/32
            # GitHub webhook deliveries (api.github.com/meta "hooks")
            - 192.30.252.0/22
            - 185.199.108.0/22
            - 140.82.112.0/20
            - 143.55.64.0/20
            - 9.234.98.160/27
            - 9.234.106.48/28
            - 2a0a:a440::/29
            - 2606:50c0::/32

  scenarios:
    mcswain-envoy-l4-flood.yaml: |
      type: leaky
      name: mcswain/envoy-l4-flood
      description: "Many TCP/UDP sessions from one IP to one non-HTTP public route (SSH, DMR, Reticulum, ...)"
      # Reticulum is a mesh transport: peers reconnect constantly by design (some every few
      # seconds), so session counts say nothing about abuse there.
      filter: "evt.Meta.log_type == 'envoy_l4' && !(evt.Meta.service startsWith 'tcproute/reticulum/')"
      groupby: "evt.Meta.source_ip + '/' + evt.Meta.service"
      capacity: 40
      leakspeed: 15s
      blackhole: 5m
      labels:
        remediation: true
        service: envoy
        confidence: 2
        spoofable: 0
        behavior: "tcp:bruteforce"
        label: "Connection flood on a TCP/UDP route"
        classification:
          - attack.T1110
    mcswain-router-dnat-flood.yaml: |
      type: leaky
      name: mcswain/router-dnat-flood
      description: "Many new connections from one IP to one router port-forward that bypasses Envoy"
      filter: "evt.Parsed.program == 'kernel' && evt.Parsed.message contains 'cs-dnat:' && evt.Meta.source_ip != ''"
      groupby: "evt.Meta.source_ip + '/' + evt.Parsed.dst_port"
      capacity: 40
      leakspeed: 15s
      blackhole: 5m
      labels:
        remediation: true
        service: router
        confidence: 2
        spoofable: 0
        behavior: "tcp:bruteforce"
        label: "Connection flood on a port-forward"
        classification:
          - attack.T1110

agent:
  # Reads from Loki, so one replica instead of a DaemonSet tailing node logs.
  isDeployment: true
  replicas: 1
  # Logs come from Loki; no node log mounts.
  hostVarLog: false
  additionalAcquisition:
    - source: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      query: '{namespace="envoy-gateway-system", container="envoy", pod=~"envoy-envoy-gateway-system-public-.*"}'
      wait_for_ready: 10s
      labels:
        type: envoy-gateway
    - source: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      query: '{job="syslog", host="OpenWrt", app="kernel"} |~ "cs-dnat: |reject wan|drop wan"'
      wait_for_ready: 10s
      labels:
        type: kernel
  env:
    - name: COLLECTIONS
      value: "crowdsecurity/base-http-scenarios crowdsecurity/http-cve crowdsecurity/iptables crowdsecurity/whitelist-good-actors"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

lapi:
  replicas: 1
  envFrom:
    - secretRef:
        name: crowdsec-telegram
  env:
    # Pre-registered bouncers (key = what the bouncer is configured with).
    - name: BOUNCER_KEY_router
      valueFrom:
        secretKeyRef:
          name: crowdsec-bouncers
          key: router
    - name: BOUNCER_KEY_vps
      valueFrom:
        secretKeyRef:
          name: crowdsec-bouncers
          key: vps
    - name: BOUNCER_KEY_envoy
      valueFrom:
        secretKeyRef:
          name: crowdsec-bouncers
          key: envoy
  persistentVolume:
    data:
      enabled: true
      storageClassName: longhorn-nvme
      size: 1Gi
    config:
      enabled: true
      storageClassName: longhorn-nvme
      size: 100Mi
  service:
    # Bouncers on the router (and anything else on the LAN) reach LAPI here.
    type: LoadBalancer
    loadBalancerClass: metallb
    annotations:
      metallb.universe.tf/loadBalancerIPs: 192.168.254.14
    externalTrafficPolicy: Local
  dashboard:
    enabled: false
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 512Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# WAF: request inspection for Envoy via envoy-proxy-bouncer (resources/bouncer).
#   :7422 mcswain/waf-full    -> minio.mcswain.dev (console): CVE virtual patching + generic rules
#                                in-band, OWASP CRS out-of-band (detect only)
#   :7423 mcswain/waf-vpatch  -> s3.mcswain.dev (S3 API): CVE virtual patching only (generic/CRS
#                                rules false-positive on S3 XML/signed requests; bodies aren't sent)
# Enforcing (in-band rules block; CRS stays out-of-band = alert only).
appsec:
  enabled: true
  acquisitions:
    - source: appsec
      listen_addr: "0.0.0.0:7422"
      path: /
      appsec_config: mcswain/waf-full
      labels:
        type: appsec
    - source: appsec
      listen_addr: "0.0.0.0:7423"
      path: /
      appsec_config: mcswain/waf-vpatch
      labels:
        type: appsec
  configs:
    mcswain-waf-full.yaml: |
      name: mcswain/waf-full
      default_remediation: ban
      inband_rules:
        - crowdsecurity/base-config
        - crowdsecurity/vpatch-*
        - crowdsecurity/generic-*
      outofband_rules:
        - crowdsecurity/crs
    mcswain-waf-vpatch.yaml: |
      name: mcswain/waf-vpatch
      default_remediation: ban
      inband_rules:
        - crowdsecurity/base-config
        - crowdsecurity/vpatch-*
  env:
    - name: COLLECTIONS
      value: "crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/appsec-crs"
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
