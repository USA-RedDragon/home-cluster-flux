apiVersion: v1
kind: Service
metadata:
  name: crowdsec-lapi-tailnet
  namespace: crowdsec
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: crowdsec-lapi
spec:
  type: ClusterIP
  selector:
    k8s-app: crowdsec
    type: lapi
  ports:
    - name: lapi
      port: 8080
      targetPort: 8080
      protocol: TCP
