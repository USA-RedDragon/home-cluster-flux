apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-bouncer
  namespace: crowdsec
spec:
  interval: 1h
  maxHistory: 2
  install:
    remediation:
      retries: -1
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: envoy-proxy-bouncer
      version: 0.8.2
      sourceRef:
        kind: HelmRepository
        name: kdwils
        namespace: crowdsec
      interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: envoy-bouncer-values-ipv6
  values:
    fullnameOverride: envoy-bouncer
    image:
      repository: jacob.pub/ghcr.io/kdwils/envoy-proxy-bouncer
      tag: v0.8.3@sha256:f5a68a85481641a3bcb17d0b1e90b661b2e6ce2424c17585bf236ffe46a178cc
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    config:
      server:
        logLevel: info
      trustedIPHeader: X-Envoy-External-Address
      bouncer:
        enabled: false
        lapiURL: http://crowdsec-service:8080
        apiKeySecretRef:
          name: crowdsec-bouncers
          key: envoy
      waf:
        enabled: true
        appSecURL: http://crowdsec-appsec-service:7422
        apiKeySecretRef:
          name: crowdsec-bouncers
          key: envoy
        failOpen: true
        routes:
          - hosts: [s3.mcswain.dev]
            port: 7423
          - hosts: [minio.mcswain.dev]
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
