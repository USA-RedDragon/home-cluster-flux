apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crowdsec
  namespace: crowdsec
spec:
  interval: 1h
  targetNamespace: crowdsec
  path: ./services/crowdsec/resources
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crowdsec-ipv6
  namespace: crowdsec
spec:
  interval: 1h
  targetNamespace: crowdsec
  path: ./services/crowdsec/ipv6
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: home-ipv6
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
