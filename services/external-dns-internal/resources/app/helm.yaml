---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-dns
  namespace: external-dns-internal
spec:
  interval: 1h0m0s
  url: https://kubernetes-sigs.github.io/external-dns/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-internal
  namespace: external-dns-internal
spec:
  interval: 1h
  maxHistory: 2
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        namespace: external-dns-internal
        name: external-dns
      interval: 1h
  install:
    remediation:
      retries: -1
  values:
    image:
      repository: jacob.pub/registry.k8s.io/external-dns/external-dns
    sources: [service, gateway-grpcroute, gateway-httproute, gateway-tcproute, gateway-tlsroute, gateway-udproute]
    provider:
      name: webhook
      webhook:
        image:
          repository: jacob.pub/ghcr.io/muhlba91/external-dns-provider-adguard
          tag: v11.2.0@sha256:a119f729b16d435769aefcd9d4be149d4be7142848439bafd45e4045aa0b2e4e
          pullPolicy: IfNotPresent
        env:
          - name: ADGUARD_URL
            value: http://192.168.1.1:3000
          - name: ADGUARD_USER
            valueFrom:
              secretKeyRef:
                name: adguard-home
                key: username
          - name: ADGUARD_PASSWORD
            valueFrom:
              secretKeyRef:
                name: adguard-home
                key: password
          - name: SERVER_HOST
            value: 127.0.0.1
        securityContext:
          runAsNonRoot: true
          runAsUser: 20000
          runAsGroup: 20000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
    podLabels:
      policy.mcswain.dev/egress-kubeapi: "true"
      policy.mcswain.dev/egress-coredns: "true"
    interval: 1h
    triggerLoopOnEvent: true
    policy: sync
    annotationFilter: external-dns.mcswain.dev/internal notin (skip)
    registry: noop

    extraArgs:
      - --webhook-provider-url=http://localhost:8888
      - --source=gateway-grpcroute
      - --source=gateway-httproute
      - --source=gateway-tlsroute
      - --source=gateway-udproute
      - --source=gateway-tcproute
