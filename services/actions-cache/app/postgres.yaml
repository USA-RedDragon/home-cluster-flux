apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  namespace: actions-cache
spec:
  instances: 2
  imageName: jacob.pub/ghcr.io/cloudnative-pg/postgresql:17.5-22
  enableSuperuserAccess: true
  bootstrap:
    initdb:
      database: cache
      owner: cache
  storage:
    size: 8Gi
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      memory: 200Mi
      cpu: 100m
  smartShutdownTimeout: 30
  stopDelay: 300
