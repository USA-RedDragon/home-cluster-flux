apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actions-cache
  namespace: actions-cache
spec:
  install:
    remediation:
      retries: -1
  interval: 60m0s
  driftDetection:
    mode: enabled
  releaseName: actions-cache
  chart:
    spec:
      chart: github-actions-cache-server
      sourceRef:
        kind: HelmRepository
        name: falcondev-oss
        namespace: actions-cache
      version: '1.4.1'
      interval: 60m0s
  valuesFrom:
    - kind: ConfigMap
      name: chart-values
