apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: actions-cache
  namespace: actions-cache
spec:
  interval: 1h
  targetNamespace: actions-cache
  path: ./services/actions-cache/app
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
