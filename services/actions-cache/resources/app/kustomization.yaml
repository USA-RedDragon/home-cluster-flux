apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: actions-cache
resources:
  - helm.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: actions-cache-chart-values
    files:
      - values.yaml=values.yaml
  - name: actions-cache-exchange
    options:
      disableNameSuffixHash: true
    files:
      - exchange.mjs=exchange.mjs
configurations:
  - kustomizeconfig.yaml
