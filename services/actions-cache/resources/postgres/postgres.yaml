apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  namespace: actions-cache
spec:
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job.longhorn.io/trim: enabled
  instances: 2
  imageName: jacob.pub/ghcr.io/cloudnative-pg/postgresql:18.6-system-bookworm@sha256:605c6e45e733ce0e908505e9ac3c441637d6794d330ec0e9d8d6f631b6918b1e
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: cache
      owner: cache
  storage:
    storageClass: longhorn-nvme-r1
    size: 8Gi
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      memory: 200Mi
      cpu: 100m
  smartShutdownTimeout: 30
  stopDelay: 300
