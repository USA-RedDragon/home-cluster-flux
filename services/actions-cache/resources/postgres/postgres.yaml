apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  namespace: actions-cache
spec:
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job.longhorn.io/trim: enabled
  instances: 2
  imageName: jacob.pub/ghcr.io/cloudnative-pg/postgresql:18.6-system-bookworm@sha256:b4bec141fa5ca2bab490b197c814fb1342147c8405be1fb0673951fa6db7f699
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: cache
      owner: cache
  storage:
    storageClass: longhorn-nvme-r1
    size: 8Gi
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      memory: 200Mi
      cpu: 100m
  smartShutdownTimeout: 30
  stopDelay: 300
