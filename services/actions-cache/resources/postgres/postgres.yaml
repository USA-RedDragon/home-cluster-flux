apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  namespace: actions-cache
spec:
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job.longhorn.io/trim: enabled
  instances: 2
  imageName: jacob.pub/ghcr.io/cloudnative-pg/postgresql:18.6-system-bookworm@sha256:0dadb410826a95fff57f2a5bf1c88d4e813eb2c0b0ccf91827190a21debdb435
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: cache
      owner: cache
  storage:
    storageClass: longhorn-nvme-r1
    size: 8Gi
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      memory: 200Mi
      cpu: 100m
  smartShutdownTimeout: 30
  stopDelay: 300
