apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  namespace: actions-cache
spec:
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job.longhorn.io/trim: enabled
  instances: 2
  imageName: jacob.pub/ghcr.io/cloudnative-pg/postgresql:17.11-system-bookworm@sha256:9cf9466e674a794aee83693b9c28d8b3103d612a943bf144117a718b97b9d1db
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: cache
      owner: cache
  storage:
    storageClass: longhorn-nvme-r1
    size: 8Gi
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      memory: 200Mi
      cpu: 100m
  smartShutdownTimeout: 30
  stopDelay: 300
