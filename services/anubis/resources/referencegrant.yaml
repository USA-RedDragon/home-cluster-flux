# Lets SecurityPolicies in app namespaces point extAuth at the central Anubis services.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: anubis-extauth
  namespace: anubis
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: gitea
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: zot
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: dmrhub
  to:
    - group: ""
      kind: Service
