name: Flux Diff

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  flux-diff:
    name: Flux Diff
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: pull

      - name: Checkout Default Branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: default

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.27.2'
          cache: false

      - name: Setup flate
        run: go install github.com/home-operations/flate/cmd/flate@ff32c0becff81024e2f2ba6b81a6c53889936fd5

      - name: Cache flate
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/flate
          key: ${{ runner.os }}-flate-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys:
            ${{ runner.os }}-flate-

      - name: Diff Resources
        env:
          FLATE_CACHE_DIR: ${{ runner.temp }}/flate
          FLATE_NO_PROGRESS: "true"
        run: >-
          flate diff all
          --path=pull
          --path-orig=default
          --allow-missing-secrets
          --output=diff
          > diff.patch

      - name: Generate Diff
        id: diff
        if: ${{ !cancelled() }}
        run: |
          cat diff.patch
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          head -c 60000 diff.patch >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "added=$(grep -c '^+[^+]' diff.patch)" >> $GITHUB_OUTPUT
          echo "removed=$(grep -c '^-[^-]' diff.patch)" >> $GITHUB_OUTPUT

      - if: ${{ steps.diff.outputs.diff != '' || failure() }}
        name: Add comment
        uses: mshick/add-pr-comment@v2
        with:
          message-id: ${{ github.event.pull_request.number }}/flate
          message-failure: |
            ## Flux Diff

            > [!CAUTION]
            > Failed to create diff. [View log.](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ```diff
            ${{ steps.diff.outputs.diff }}
            ```
          message: |
            ## Flux Diff

            <table>
              <tr>
                <td><b>Changes</b></td>
                <td>${\tt\large\color{green}+${{ steps.diff.outputs.added }}\enspace\color{red}-\negthinspace${{ steps.diff.outputs.removed }}}$</td>
              </tr>
            </table>

            <details>
              <summary>Click to expand</summary>

            ```diff
            ${{ steps.diff.outputs.diff }}
            ```
            </details>

  flux-diff-success:
    name: Flux Diff Successful
    runs-on: ubuntu-24.04
    needs: [flux-diff]
    if: ${{ always() }}
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        name: Check status
        run: exit 1
