apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nginx-rtmp
  namespace: nginx-rtmp
spec:
  interval: 1h
  targetNamespace: nginx-rtmp
  path: ./apps/nginx-rtmp/resources
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
