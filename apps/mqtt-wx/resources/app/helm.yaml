apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mqtt-wx
  namespace: mqtt-wx
spec:
  install:
    remediation:
      retries: -1
  interval: 60m0s
  maxHistory: 2
  releaseName: mqtt-wx
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: chart-values
