apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: atuin
commonAnnotations:
  kustomize.toolkit.fluxcd.io/prune: disabled
resources:
  - helm.yaml
  - prom.yaml
  - postgres.yaml
configMapGenerator:
  - name: chart-values
    files:
      - values.yaml=values.yaml
configurations:
  - kustomizeconfig.yaml
