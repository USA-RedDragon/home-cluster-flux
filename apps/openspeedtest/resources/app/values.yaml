# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json

defaultPodOptions:
  automountServiceAccountToken: false

controllers:
  openspeedtest:
    replicas: 1

    containers:
      openspeedtest:
        resources:
          limits:
            memory: 64Mi
        image:
          repository: jacob.pub/docker.io/openspeedtest/latest
          tag: "v2.0.8@sha256:1127de0693c36bcf8c297c73d09891df8ec243680d027a6b6fab13fa0954ff46"
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true

service:
  openspeedtest:
    controller: openspeedtest
    ports:
      http:
        port: 3000

route:
  openspeedtest:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: public
        namespace: envoy-gateway-system
        sectionName: https
    hostnames:
      - speedtest.mcswain.dev
    rules:
      - backendRefs:
          - name: openspeedtest
            port: 3000
        matches:
          - path:
              type: PathPrefix
              value: /
