apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dmrhub
  namespace: dmrhub
spec:
  interval: 1h
  targetNamespace: dmrhub
  path: ./apps/dmrhub/resources/app
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: valkey
  namespace: dmrhub
spec:
  interval: 1h
  targetNamespace: dmrhub
  path: ./apps/dmrhub/resources/valkey
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: restic
  namespace: dmrhub
spec:
  interval: 1h
  targetNamespace: dmrhub
  path: ./apps/dmrhub/resources/restic
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
