apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: radio-ingress
  namespace: dmrhub
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/controller: radio
      app.kubernetes.io/instance: radio
      app.kubernetes.io/name: radio
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: envoy-gateway-system
            gateway.envoyproxy.io/owning-gateway-name: public
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
