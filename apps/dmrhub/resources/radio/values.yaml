# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json

defaultPodOptions:
  automountServiceAccountToken: false

controllers:
  radio:
    replicas: 2
    strategy: RollingUpdate
    rollingUpdate:
      unavailable: 1
    pod:
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
    containers:
      radio:
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/dmr-web
          tag: main@sha256:e2a79c56bb62d8332f1a484785a94799cfb73b227305ac6c682da1b51fc4185e
          pullPolicy: IfNotPresent
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
              periodSeconds: 10
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
              periodSeconds: 10
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
              periodSeconds: 2
              failureThreshold: 30

persistence:
  tmp:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 16Mi

service:
  radio:
    controller: radio
    ports:
      http:
        port: 8080

route:
  radio:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: public
        namespace: envoy-gateway-system
        sectionName: https
    hostnames:
      - radio.dmrhub.net
    rules:
      - backendRefs:
          - name: radio
            port: 8080
        matches:
          - path:
              type: PathPrefix
              value: /
