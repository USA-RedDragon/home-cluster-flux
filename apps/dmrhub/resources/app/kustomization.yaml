apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dmrhub
resources:
  - helm.yaml
  - postgres.yaml
  - securitypolicy.yaml
  - networkpolicy.yaml
  - webtransport.cert.yaml
configMapGenerator:
  - name: chart-values
    files:
      - values.yaml=values.yaml
  - name: dmrhub-config
    files:
      - config.yaml=dmrhub-config.yaml
    options:
      disableNameSuffixHash: true
configurations:
  - kustomizeconfig.yaml
