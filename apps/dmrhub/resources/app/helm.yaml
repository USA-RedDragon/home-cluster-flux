apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dmrhub
  namespace: dmrhub
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  maxHistory: 2
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: -1
  valuesFrom:
    - kind: ConfigMap
      name: chart-values
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: dmrhub
            patch: |
              - op: add
                path: /spec/minReadySeconds
                value: 5
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: dmrhub-docs
            patch: |
              - op: add
                path: /spec/minReadySeconds
                value: 5
