apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  namespace: dmrhub
spec:
  instances: 3
  imageName: jacob.pub/ghcr.io/cloudnative-pg/postgresql:17.5-22
  enableSuperuserAccess: true
  backup:
    barmanObjectStore:
      destinationPath: "s3://cnpg/dmrhub-2"
      endpointURL: "https://s3.mcswain.dev"
      s3Credentials:
        accessKeyId:
          name: cnpg-minio
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-minio
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: gzip
    retentionPolicy: "4w"
  bootstrap:
    initdb:
      database: dmrhub
      owner: dmrhub
  storage:
    storageClass: longhorn-nvme-r1
    # Filled up (35Gi PVC, hand-expanded past the 30Gi here), which halted
    # every instance and left the cluster without a primary.
    size: 50Gi
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      memory: 200Mi
      cpu: 100m
  smartShutdownTimeout: 30
  stopDelay: 300
---
apiVersion: v1
kind: Secret
metadata:
 name: cnpg-minio
 annotations:
   reflector.v1.k8s.emberstack.com/reflects: reflector/cnpg-minio
type: Opaque
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: backup
spec:
  immediate: true
  schedule: "0 2 * * * *"
  backupOwnerReference: self
  cluster:
    name: postgresql
