apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: restic
  namespace: wx
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  maxHistory: 2
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: -1
  values:
    defaultPodOptions:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: wx
                  app.kubernetes.io/instance: wx
                  app.kubernetes.io/controller: wx

    controllers:
      restic:
        type: cronjob
        cronjob:
          schedule: 40 0 * * *
          timeZone: America/Chicago
          concurrencyPolicy: Forbid
          ttlSecondsAfterFinished: 3600
        containers:
          restic:
            image: &image
              repository: jacob.pub/ghcr.io/gabe565/restic
              tag: 0.19.1@sha256:3c42c281443525045d82dd46f8e020569b13b46bc60fefb25e1428a6cff53d25
            workingDir: /backup
            envFrom: &envFrom
              - secretRef:
                  name: restic-b2
              - secretRef:
                  name: restic-envs
            env: &env
              TZ: America/Chicago
              RESTIC_HOST:
                fieldRef:
                  fieldPath: metadata.namespace
            command:
              - sh
              - -c
              - |
                exec > >(ts '%H:%M:%S') 2>&1
                set -eu
                sqlite3 -readonly -bail /data/wx.db ".backup /backup/wx.db"
                test "$(sqlite3 -bail /backup/wx.db 'PRAGMA integrity_check')" = ok
                restic backup --tag=sqlite /backup/wx.db
                restic forget --prune --keep-daily=90 --keep-weekly=24 --keep-monthly=24 --keep-yearly=20
                restic cache --cleanup
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
      init:
        type: job
        annotations:
          helm.sh/hook: post-install
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
        containers:
          init:
            image: *image
            envFrom: *envFrom
            env: *env
            command: [sh, -c, "restic init || true"]

    persistence:
      data:
        existingClaim: wx
        globalMounts:
          - path: /data
            readOnly: true
      backup:
        type: emptyDir
        globalMounts:
          - path: /backup
