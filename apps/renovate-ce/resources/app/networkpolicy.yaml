apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: renovate-ce
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mend-renovate-server
  namespace: renovate-ce
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: renovate-ce
      app.kubernetes.io/name: mend-renovate
      app: mend-renovate-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: envoy-gateway-system
            gateway.envoyproxy.io/owning-gateway-name: public
        - matchLabels:
            io.kubernetes.pod.namespace: renovate-ce
            app.kubernetes.io/instance: renovate-ce
            app.kubernetes.io/name: mend-renovate
            app: mend-renovate-worker
        - matchLabels:
            io.kubernetes.pod.namespace: renovate-ce
            app.kubernetes.io/instance: renovate-ce
            app.kubernetes.io/name: mend-renovate
            app: mend-renovate-web
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "**.cluster.local"
              - matchName: "github.com"
              - matchName: "api.github.com"
    - toFQDNs:
        - matchName: "github.com"
        - matchName: "api.github.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
