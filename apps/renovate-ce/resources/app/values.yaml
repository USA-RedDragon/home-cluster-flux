license:
  mendRnvLicenseKey: '${LICENSE_KEY}'
  mendRnvAcceptTos: 'y'

renovateWorker:
  image:
    repository: jacob.pub/ghcr.io/usa-reddragon/renovate-ee-worker
    version: v15.10.0

  existingSecret: renovate-secrets
  replicas: 2

  # Daily, not "always". Go toolchains that `go` downloads itself
  # (golang.org/toolchain@...) are unpacked read-only regardless of
  # -modcacherw, and the cleanup's `find -delete` then fails on every file
  # after every job (~158k log lines/h). Once a day keeps the rest of the
  # cache in check; the read-only toolchains are a bounded ~250 MB each and
  # go away when the worker restarts.
  mendRnvWorkerCleanup: "0 4 * * *"

  mendRnvPrometheusMetricsEnabled: 'true'

  disableCacheVolume: true

  extraEnvVars:
  # Go writes its module cache read-only. Renovate's gomod manager already
  # sets GOFLAGS=-modcacherw for its own go runs; this covers anything else.
  - name: GOFLAGS
    value: '-modcacherw'
  - name: RENOVATE_REPOSITORY_CACHE
    value: 'enabled'
  - name: LOG_LEVEL
    value: debug
  - name: RENOVATE_PAGINATE_ALL
    value: 'true'
  - name: RENOVATE_PERSIST_REPO_DATA
    value: 'false'
  - name: RENOVATE_PLATFORM_COMMIT
    value: 'true'
  - name: RENOVATE_REPOSITORY_CACHE_TYPE
    value: 's3://renovate/repository-cache/'
  - name: RENOVATE_S3_ENDPOINT
    value: 'https://s3.mcswain.dev'
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: renovate-secrets
        key: aws-access-key-id
  - name: AWS_REGION
    value: 'us-east-1'
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: renovate-secrets
        key: aws-secret-access-key
  - name: RENOVATE_S3_PATH_STYLE
    value: 'true'
  - name: AWS_ENDPOINT_URL_S3
    value: 'http://minio.minio.svc.cluster.local:9000'
  - name: MEND_RNV_LOG_HISTORY_S3
    value: 's3://renovate/job-logs'
  - name: MEND_RNV_S3_FORCE_PATH_STYLE
    value: 'true'
  - name: RENOVATE_ONBOARDING_CONFIG
    value: "{\n  \"$schema\": \"https://docs.renovatebot.com/renovate-schema.json\",\n  \"extends\": [\n    \"local>USA-RedDragon/renovate-configs\"\n  ]\n}"
  - name: GHCR_USERNAME
    valueFrom:
      secretKeyRef:
        name: renovate-secrets
        key: ghcr-username
  - name: GHCR_PASSWORD
    valueFrom:
      secretKeyRef:
        name: renovate-secrets
        key: ghcr-password
  - name: DOCKER_HUB_USERNAME
    valueFrom:
      secretKeyRef:
        name: renovate-secrets
        key: docker-hub-username
  - name: DOCKER_HUB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: renovate-secrets
        key: docker-hub-password

  # Optional: Sets the maximum execution duration of a Renovate CLI scan in minutes. Defaults to 60.
  mendRnvWorkerExecutionTimeout:


  # Self-hosted renovate configuration file, will be mounted as a config map
  config: |
    module.exports = {
      // Enter self-hosted configuration options here.
      // https://docs.renovatebot.com/self-hosted-configuration/
      cacheHardTtlMinutes: 5,
      onboardingConfigFileName: ".github/renovate.json",
      onboardingRebaseCheckbox: true,
      allowedUnsafeExecutions: ['gradleWrapper'],
      force: {
        prBodyColumns: ['Package', 'Type', 'Update', 'Change', 'Pending'],
      },
      hostRules: [
        {
          hostType: 'docker',
          matchHost: 'ghcr.io',
          username: process.env.GHCR_USERNAME,
          password: process.env.GHCR_PASSWORD,
        },
        {
          hostType: 'docker',
          matchHost: 'docker.io',
          username: process.env.DOCKER_HUB_USERNAME,
          password: process.env.DOCKER_HUB_PASSWORD,
        },
      ],
    }

  # Npmrc file. Will be mounted as a secret
  # npmrc: |
    # //registry.npmjs.org/:_authToken=xxxxxx

  # Existing secret with npmrc configuration with key:
  #   .npmrc:
  npmrcExistingSecret:

  # Disable NodeJS SSL verify (do not use for production)
  noNodeTlsVerify: false

  # Disable GIT SSL verify (do not use for production)
  noGitTlsVerify: false

  # Set User Agent Mend Renovate will use to query the registries
  # defaults to https://github.com/renovatebot/renovate
  renovateUserAgent:

  logLevel: info

  resources:
    requests:
      cpu: 1200m
      memory: 3Gi
    limits:
      memory: 12Gi

  readinessProbe:
    failureThreshold: 6

  livenessProbe:
    failureThreshold: 6

  automountServiceAccountToken: false

  podSecurityContext:
    fsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    privileged: false
    runAsNonRoot: true
    runAsUser: 1000
    readOnlyRootFilesystem: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

renovateServer:
  image:
    repository: jacob.pub/ghcr.io/usa-reddragon/renovate-ee
    version: v15.10.0

  replicas: 1

  mendRnvReportingApiEnabled: 'true'
  mendRnvMergeConfidenceToken: 'off'

  mendRnvPlatform: github
  mendRnvEndpoint: https://api.github.com/
  mendRnvAdminApiEnabled: 'true'
  mendRnvPrometheusMetricsEnabled: 'true'
  mendRnvServerRbacEnabled: 'true'

  # Existing secret with secret values with the following keys:
  #   mendRnvGitlabPat:
  #   mendRnvGithubAppId:
  #   mendRnvGithubAppKey:
  #   mendRnvWebhookSecret:
  #   mendRnvServerApiSecret:
  existingSecret: renovate-secrets

  # Optional. valid values: 'disabled', 'enabled', 'managed' and default to unset (see documentation)
  mendRnvForksProcessing: enabled

  # Optional, defaults to '0 0,4,8,12,16,20 * * *' (every 4 hours)
  mendRnvCronAppSync: '*/15 * * * *'

  # Optional, a string of a comma separated values. (e.g. `org1/*, org2/test*, org2/test*`). Same behavior as Renovate cli 'autodiscoverFilter' feature
  # Warning: The Renovate CLI 'autodiscover' configuration option is disabled.
  # Repository filtering should solely rely on server-side filtering using 'mendRnvAutoDiscoverFilter'.
  mendRnvAutoDiscoverFilter: 'kubewg-net/*,AstroGardenLLC/*,USA-RedDragon/*,SRS-Hosting/*,Squallar/*'

  # Optional. Accepted values: 'enabled', 'discovered', and 'disabled'. Defaults to 'discovered'.
  mendRnvEnqueueJobsOnStartup: discovered

  # Optional. Specify a directory path to save Renovate job log files.
  # It is recommended to use an external volume to preserve history.
  mendRnvLogHistoryDir:

  mendRnvLogHistoryS3: 's3://renovate/job-logs'

  # Optional: The number of days to save log files. Defaults to 30.
  mendRnvLogHistoryTTLDays:

  # Optional: Specifies a 5-part cron schedule. Defaults to `0 0 * * *` (every midnight).
  # This cron job cleans up log history in the directory defined by `mendRnvLogHistoryDir`.
  # It deletes any log file that exceeds the `mendRnvLogHistoryTTLDays` value.
  mendRnvLogHistoryCleanupCron:

  mendRnvDatabaseHistoryTTLDays: 30

  # Set log level, defaults to 'info'. Allowed values: fatal, error, warn, info, debug, trace
  logLevel: info

  # The 15.x server needs about 15 s of CPU to start. At 10m on a busy
  # node it took over 2 minutes and the liveness probe killed it.
  resources:
    requests:
      cpu: 500m
      memory: 384Mi
    limits:
      memory: 500Mi

  livenessProbe:
    failureThreshold: 18

  automountServiceAccountToken: false

  podSecurityContext:
    fsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    privileged: false
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

  extraEnvVars:
  - name: MEND_RNV_S3_FORCE_PATH_STYLE
    value: 'true'
  - name: AWS_ENDPOINT_URL_S3
    value: 'http://minio.minio.svc.cluster.local:9000'
  - name: AWS_REGION
    value: 'us-east-1'
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: renovate-secrets
        key: aws-access-key-id
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: renovate-secrets
        key: aws-secret-access-key

  extraVolumes:
    - name: tmp
      emptyDir:
        sizeLimit: 1Gi

  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp

renovateWeb:
  enabled: true

  image:
    repository: jacob.pub/ghcr.io/usa-reddragon/renovate-web-server
    version: v15.10.0@sha256:6f658bdb609cf5bb6f2d56c12142b25bf67313a73b8f98e5f40d9cedfb9b51cd

  existingSecret: renovate-secrets
  mendRnvBackendAddr: http://mend-renovate
  mendRnvGithubClientId: Iv1.d3993afeb648120b
  mendRnvGithubRedirectURI: https://renovate.jackal-stargazer.ts.net/oauth/github/callback
  mendRnvCSPConnectSrc: "'self'"
  mendRnvCSPFormAction: "'self'"
  mendRnvCSPImgSrc: "'self' data: https://avatars.githubusercontent.com"

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

  automountServiceAccountToken: false

  podSecurityContext:
    fsGroup: 12021
    runAsNonRoot: true
    runAsUser: 12021
    runAsGroup: 12021
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    privileged: false
    runAsNonRoot: true
    runAsUser: 12021
    runAsGroup: 12021
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

  extraVolumes:
    - name: tmp
      emptyDir:
        sizeLimit: 256Mi

  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp

## data Persistence Parameters
## ref: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
##
dataPersistence:
  ## Enable persistence using Persistent Volume Claims
  enabled: true
  ## Persistent Volume storage class
  ## If defined, storageClassName: <storageClass>
  ## If set to "-", storageClassName: "", which disables dynamic provisioning
  ## If undefined (the default) or set to null, no storageClassName spec is set, choosing the default provisioner
  storageClass: longhorn-nvme
  ## @param Persistent Volume access modes
  accessModes:
    - ReadWriteOnce
  ## Persistent Volume size
  size: 6Gi

## Cache in Memory
## ref: https://kubernetes.io/docs/concepts/storage/volumes/#emptydir
## cachePersistence.enabled takes precedence, make sure its disabled
##
dataInMemory:
  ## Place the cache/data in memory (tmpfs)
  enabled: false

service:
  type: ClusterIP
  annotations: {}

ingress:
  enabled: false
