apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: renovate
  namespace: renovate-ce
spec:
  hostnames:
  - renovate.mcswain.dev
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: public
    namespace: envoy-gateway-system
    sectionName: https
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: mend-renovate
      namespace: renovate-ce
      port: 80
      weight: 1
    matches:
    - method: POST
      path:
        type: Exact
        value: /webhook
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ExtensionRef
      extensionRef:
        group: gateway.envoyproxy.io
        kind: HTTPRouteFilter
        name: not-found
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: renovate-web
  namespace: renovate-ce
spec:
  ingressClassName: tailscale
  rules:
  - host: renovate
    http:
      paths:
      - backend:
          service:
            name: mend-renovate-svc-web
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - renovate
