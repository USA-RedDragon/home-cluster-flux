apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renovate-ce
  namespace: renovate-ce
spec:
  interval: 1h
  targetNamespace: renovate-ce
  path: ./apps/renovate-ce/resources
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
