# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/values.schema.json
defaultPodOptions:
  automountServiceAccountToken: false

controllers:
  redis:
    forceRename: redis-app
    strategy: Recreate
    pod:
      enableServiceLinks: true
    containers:
      app:
        image:
          repository: jacob.pub/docker.io/redis
          tag: 8.10.3-alpine@sha256:896f241f438ab6a210cfb24f573b84bea721a4cbe67f1b4fd07eb638b3b02a7b
          pullPolicy: IfNotPresent
        resources:
          limits:
            memory: 50Mi
          requests:
            cpu: 100m
            memory: 30Mi
        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 6379
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 6379
service:
  app:
    forceRename: redis-app
    controller: redis
    ports:
      redis:
        port: 6379
