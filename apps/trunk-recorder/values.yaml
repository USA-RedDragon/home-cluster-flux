# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/values.schema.json
controllers:
  trunk-recorder:
    forceRename: trunk-recorder-app
    strategy: Recreate
    pod:
      enableServiceLinks: true
      labels:
        policy.mcswain.dev/egress-coredns: 'true'
        policy.mcswain.dev/ingress-prometheus: 'true'
    containers:
      app:
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/trunk-recorder-soapysdrplay3-prometheus
          tag: main@sha256:ded68e497e630865408eec41f1469faf73ddf7ffc86351f44b5a99e312c54b46
          pullPolicy: IfNotPresent
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec: &probe
                command:
                - sh
                - -c
                - c=$(curl -sf -m 5 http://127.0.0.1:9842/metrics | awk '/^trunk_recorder_message_decodes/ {s+=$2} END {printf "%d", s}'); p=$(cat /tmp/decodes 2>/dev/null); echo "$c" > /tmp/decodes; [ "$c" -ge $(( ${p:-0} + 60 )) ]
              periodSeconds: 60
              timeoutSeconds: 10
              failureThreshold: 3
          startup:
            enabled: true
            custom: true
            spec:
              exec: *probe
              periodSeconds: 10
              timeoutSeconds: 10
              failureThreshold: 30
        env:
        - name: TZ
          value: America/Chicago
        resources:
          limits:
            memory: 1Gi
            squat.ai/sdrplay: 1
          requests:
            cpu: 2300m
            memory: 500Mi
        ports:
        - name: metrics
          containerPort: 9842
          protocol: TCP
service:
  app:
    forceRename: trunk-recorder-app
    controller: trunk-recorder
    ports:
      metrics:
        port: 9842
persistence:
  config:
    type: secret
    name: config
    items:
    - key: config.json
      path: config.json
    - key: talkgroups.csv
      path: talkgroups.csv
    advancedMounts:
      trunk-recorder:
        app:
        - path: /app
