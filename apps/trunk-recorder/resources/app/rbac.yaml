apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metrics-actioner
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["trunk-recorder-app"]
  verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metrics-actioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: metrics-actioner
subjects:
- kind: ServiceAccount
  name: metrics-actioner
  namespace: monitoring
