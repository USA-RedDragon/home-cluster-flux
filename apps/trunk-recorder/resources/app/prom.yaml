apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: trunk-recorder
  labels:
    app.kubernetes.io/instance: trunk-recorder
    app.kubernetes.io/name: trunk-recorder
spec:
  endpoints:
    - port: metrics
      scrapeTimeout: 3s
      interval: 10s
  selector:
    matchLabels:
      app.kubernetes.io/instance: trunk-recorder
      app.kubernetes.io/service: trunk-recorder-app
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trunk-recorder
spec:
  groups:
  - name: trunk-recorder
    rules:
    # Both restart trunk-recorder via metrics-actioner, matched on the
    # remediation label (alerts are grouped per namespace, so an alertname
    # match would miss when both fire together). The old rule,
    # rate(active_calls) == 0, fired whenever the call count held steady for
    # a minute and restarted a healthy recorder mid-call.
    - alert: TrunkRecorderControlChannelLost
      # ~40 msg/s when locked on; a fresh pod is back above 10 within a minute.
      expr: sum by (system) (rate(trunk_recorder_message_decodes[2m])) < 10 or absent(trunk_recorder_message_decodes)
      for: 3m
      labels:
        severity: warning
        remediation: restart-trunk-recorder
      annotations:
        summary: "trunk-recorder lost the {{ $labels.system }} control channel"
        description: "Decoding {{ $value | humanize }} control channel messages/s (normally ~40) for 3m. Restarting it."
    - alert: TrunkRecorderNoCalls
      # The quietest hour still has thousands of calls.
      expr: sum by (system) (increase(trunk_recorder_calls[30m])) == 0
      for: 5m
      labels:
        severity: warning
        remediation: restart-trunk-recorder
      annotations:
        summary: "trunk-recorder recorded no {{ $labels.system }} calls in 30m"
        description: "The control channel may be decoding, but no calls have been recorded for 30m. Restarting it."
