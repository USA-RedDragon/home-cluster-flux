apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trunk-recorder
  namespace: trunk-recorder
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  maxHistory: 2
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: -1
  valuesFrom:
    - kind: ConfigMap
      name: chart-values
