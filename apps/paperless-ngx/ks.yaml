apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
spec:
  interval: 1h
  targetNamespace: paperless-ngx
  path: ./apps/paperless-ngx/resources
  prune: true
  commonMetadata:
    annotations:
      kustomize.toolkit.fluxcd.io/prune: disabled
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
