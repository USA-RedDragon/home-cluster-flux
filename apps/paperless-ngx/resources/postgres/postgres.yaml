apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  namespace: paperless-ngx
spec:
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job.longhorn.io/trim: enabled
  instances: 3
  imageName: jacob.pub/ghcr.io/cloudnative-pg/postgresql:17.11-system-bookworm@sha256:e3956ffc1fe5cfe6618f8d1195e74e9fde4c91fef0e80ceaecb3688ebfed889a
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: paperless
      owner: paperless
  backup:
    barmanObjectStore:
      destinationPath: "s3://cnpg/paperless-2"
      endpointURL: "https://s3.mcswain.dev"
      s3Credentials:
        accessKeyId:
          name: cnpg-minio
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-minio
          key: AWS_SECRET_ACCESS_KEY
      data:
        compression: lz4
      wal:
        compression: zstd
    retentionPolicy: "4w"
  storage:
    storageClass: longhorn-nvme-r1
    size: 4Gi
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      memory: 200Mi
      cpu: 100m
  smartShutdownTimeout: 30
  stopDelay: 300
---
apiVersion: v1
kind: Secret
metadata:
 name: cnpg-minio
 annotations:
   reflector.v1.k8s.emberstack.com/reflects: reflector/cnpg-minio
type: Opaque
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: backup
spec:
  immediate: true
  schedule: "0 8 * * * *"
  backupOwnerReference: self
  cluster:
    name: postgresql
