defaultPodOptions:
  automountServiceAccountToken: false

controllers:
  paperless:
    strategy: Recreate
    replicas: 1
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    initContainers:
      redis:
        restartPolicy: Always
        image:
          repository: jacob.pub/ghcr.io/valkey-io/valkey
          tag: 9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
          pullPolicy: IfNotPresent
        args:
          - --save
          - ""
          - --appendonly
          - "no"
        resources:
          requests:
            cpu: 10m
            memory: 30Mi
          limits:
            memory: 128Mi
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 6379
              periodSeconds: 1
              failureThreshold: 60
    containers:
      app:
        image:
          repository: jacob.pub/ghcr.io/paperless-ngx/paperless-ngx
          tag: 3.3.4@sha256:9bc6e8248891bcfa6f52fffe8b81e4ea8cae75790c3ec1b9906961a7ba55c969
          pullPolicy: IfNotPresent
        envFrom:
          - secretRef:
              name: paperless-ngx
        env:
          USERMAP_UID: "1000"
          USERMAP_GID: "1000"
          PAPERLESS_URL: https://paperless.jackal-stargazer.ts.net
          PAPERLESS_PROXY_SSL_HEADER: '["HTTP_X_FORWARDED_PROTO", "https"]'
          PAPERLESS_ALLAUTH_TRUSTED_PROXY_COUNT: "1"
          PAPERLESS_TIME_ZONE: America/Chicago
          PAPERLESS_OCR_LANGUAGE: eng
          PAPERLESS_REDIS: redis://localhost:6379
          PAPERLESS_TIKA_ENABLED: "true"
          PAPERLESS_TIKA_ENDPOINT: http://localhost:9998
          PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://localhost:3000
          PAPERLESS_CONSUMER_POLLING_INTERVAL: "10"
          PAPERLESS_CONSUMER_RECURSIVE: "true"
          PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
          PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"
          PAPERLESS_FILENAME_FORMAT: "{{ `{{ created_year }}/{{ correspondent }}/{{ title }}` }}"
          PAPERLESS_FILENAME_FORMAT_REMOVE_NONE: "true"
          PAPERLESS_DBENGINE: postgresql
          PAPERLESS_DBHOST:
            secretKeyRef:
              name: postgresql-app
              key: host
          PAPERLESS_DBPORT:
            secretKeyRef:
              name: postgresql-app
              key: port
          PAPERLESS_DBNAME:
            secretKeyRef:
              name: postgresql-app
              key: dbname
          PAPERLESS_DBUSER:
            secretKeyRef:
              name: postgresql-app
              key: username
          PAPERLESS_DBPASS:
            secretKeyRef:
              name: postgresql-app
              key: password
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8000
                httpHeaders:
                  - name: Host
                    value: localhost
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 90
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8000
                httpHeaders:
                  - name: Host
                    value: localhost
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8000
                httpHeaders:
                  - name: Host
                    value: localhost
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 2Gi
      tika:
        image:
          repository: jacob.pub/docker.io/apache/tika
          tag: 3.3.3.0@sha256:326b238b37904c94ff61fed87afe0af72e6a29fa715933b10af97b7d56f1d4cb
          pullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 20m
            memory: 256Mi
          limits:
            memory: 1Gi
      gotenberg:
        image:
          repository: jacob.pub/docker.io/gotenberg/gotenberg
          tag: 8.39.0@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
          pullPolicy: IfNotPresent
        command:
          - gotenberg
          - --chromium-disable-javascript=true
          - --chromium-allow-list=file:///tmp/.*
        resources:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            memory: 1Gi

service:
  app:
    controller: paperless
    ports:
      http:
        port: 8000

ingress:
  tailscale:
    enabled: true
    className: tailscale
    hosts:
      - host: paperless
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: http
    tls:
      - hosts:
          - paperless

persistence:
  data:
    type: persistentVolumeClaim
    forceRename: paperless-ngx-data
    storageClass: longhorn-nvme
    accessMode: ReadWriteOnce
    size: 5Gi
    retain: true
    advancedMounts:
      paperless:
        app:
          - path: /usr/src/paperless/data
  media:
    type: persistentVolumeClaim
    existingClaim: paperless-media
    advancedMounts:
      paperless:
        app:
          - path: /usr/src/paperless/media
  consume:
    type: persistentVolumeClaim
    existingClaim: paperless-consume
    advancedMounts:
      paperless:
        app:
          - path: /usr/src/paperless/consume
  export:
    type: persistentVolumeClaim
    existingClaim: paperless-export
    advancedMounts:
      paperless:
        app:
          - path: /usr/src/paperless/export
