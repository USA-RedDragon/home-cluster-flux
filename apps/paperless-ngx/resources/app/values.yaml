controllers:
  paperless:
    strategy: Recreate
    replicas: 1
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    initContainers:
      redis:
        restartPolicy: Always
        image:
          repository: jacob.pub/ghcr.io/valkey-io/valkey
          tag: 9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
          pullPolicy: IfNotPresent
        args:
          - --save
          - ""
          - --appendonly
          - "no"
        resources:
          requests:
            cpu: 10m
            memory: 30Mi
          limits:
            memory: 128Mi
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 6379
              periodSeconds: 1
              failureThreshold: 60
    containers:
      app:
        image:
          repository: jacob.pub/ghcr.io/paperless-ngx/paperless-ngx
          tag: 3.3.0@sha256:6b94799bc769a063b3340cc5847402e626d4d91d29a295a8e747f8e9bead4207
          pullPolicy: IfNotPresent
        envFrom:
          - secretRef:
              name: paperless-ngx
        env:
          USERMAP_UID: "1000"
          USERMAP_GID: "1000"
          PAPERLESS_URL: https://paperless.jackal-stargazer.ts.net
          PAPERLESS_PROXY_SSL_HEADER: '["HTTP_X_FORWARDED_PROTO", "https"]'
          PAPERLESS_ALLAUTH_TRUSTED_PROXY_COUNT: "1"
          PAPERLESS_TIME_ZONE: America/Chicago
          PAPERLESS_OCR_LANGUAGE: eng
          PAPERLESS_REDIS: redis://localhost:6379
          PAPERLESS_TIKA_ENABLED: "true"
          PAPERLESS_TIKA_ENDPOINT: http://localhost:9998
          PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://localhost:3000
          PAPERLESS_CONSUMER_POLLING_INTERVAL: "10"
          PAPERLESS_CONSUMER_RECURSIVE: "true"
          PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
          PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"
          PAPERLESS_FILENAME_FORMAT: "{{ `{{ created_year }}/{{ correspondent }}/{{ title }}` }}"
          PAPERLESS_FILENAME_FORMAT_REMOVE_NONE: "true"
          PAPERLESS_DBENGINE: postgresql
          PAPERLESS_DBHOST:
            secretKeyRef:
              name: postgresql-app
              key: host
          PAPERLESS_DBPORT:
            secretKeyRef:
              name: postgresql-app
              key: port
          PAPERLESS_DBNAME:
            secretKeyRef:
              name: postgresql-app
              key: dbname
          PAPERLESS_DBUSER:
            secretKeyRef:
              name: postgresql-app
              key: username
          PAPERLESS_DBPASS:
            secretKeyRef:
              name: postgresql-app
              key: password
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8000
                httpHeaders:
                  - name: Host
                    value: localhost
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 90
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8000
                httpHeaders:
                  - name: Host
                    value: localhost
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8000
                httpHeaders:
                  - name: Host
                    value: localhost
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 2Gi
      tika:
        image:
          repository: jacob.pub/docker.io/apache/tika
          tag: 3.3.1.0@sha256:90b7fa1dc018434075fce9e1d9b88b1e3d0ea6979d0cf86e116c79a8073ae973
          pullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 20m
            memory: 256Mi
          limits:
            memory: 1Gi
      gotenberg:
        image:
          repository: jacob.pub/docker.io/gotenberg/gotenberg
          tag: 8.37.0@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
          pullPolicy: IfNotPresent
        command:
          - gotenberg
          - --chromium-disable-javascript=true
          - --chromium-allow-list=file:///tmp/.*
        resources:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            memory: 1Gi

service:
  app:
    controller: paperless
    ports:
      http:
        port: 8000

ingress:
  tailscale:
    enabled: true
    className: tailscale
    hosts:
      - host: paperless
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: http
    tls:
      - hosts:
          - paperless

persistence:
  data:
    type: persistentVolumeClaim
    forceRename: paperless-ngx-data
    storageClass: longhorn-nvme
    accessMode: ReadWriteOnce
    size: 5Gi
    retain: true
    advancedMounts:
      paperless:
        app:
          - path: /usr/src/paperless/data
  media:
    type: persistentVolumeClaim
    existingClaim: paperless-media
    advancedMounts:
      paperless:
        app:
          - path: /usr/src/paperless/media
  consume:
    type: persistentVolumeClaim
    existingClaim: paperless-consume
    advancedMounts:
      paperless:
        app:
          - path: /usr/src/paperless/consume
  export:
    type: persistentVolumeClaim
    existingClaim: paperless-export
    advancedMounts:
      paperless:
        app:
          - path: /usr/src/paperless/export
