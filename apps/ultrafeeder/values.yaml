# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json

controllers:
  ultrafeeder:
    replicas: 1
    containers:
      ultrafeeder:
        image:
          repository: jacob.pub/ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder
          tag: telegraf-build-757
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - sh
                  - -c
                  - for n in /dev/bus/usb/*/*; do set -- $(stat -c '%t %T' "$n") && grep -qsx "$(printf '%d:%d' "0x$1" "0x$2")" /sys/bus/usb/devices/*/dev && ls -l /proc/[0-9]*/fd 2>/dev/null | grep -q " $n\$" || exit 1; done && jq -e '(now - .now) < 150 and .last1min.local.samples_processed > 0' /run/readsb/stats.json >/dev/null
              initialDelaySeconds: 60
              periodSeconds: 60
              timeoutSeconds: 10
              failureThreshold: 3
          readiness:
            enabled: true
          startup:
            enabled: true
        env:
          TZ: America/Chicago
          PROMETHEUS_ENABLE: "true"
          READSB_DEVICE_TYPE: rtlsdr
          READSB_GAIN: auto
          READSB_RTLSDR_DEVICE: 00001090
          ENABLE_978: "true"
          URL_978: http://dump978.dump978.svc.cluster.local/skyaware978
          ULTRAFEEDER_CONFIG: |
            adsb,dump978.dump978,30978,uat_in;
            mlathub,piaware.piaware,30105,beast_in;
        envFrom:
          - secretRef:
              name: location
        resources:
          requests:
            cpu: 30m
            memory: 384Mi
          limits:
            squat.ai/rtl-sdr-ads-b: 1

service:
  ultrafeeder:
    controller: ultrafeeder
    ports:
      http:
        port: 80
        primary: true
      metrics:
        port: 9273
      beast:
        port: 30005

ingress:
  tailscale:
    enabled: true
    className: tailscale
    hosts:
      - host: ultrafeeder
        paths:
        - path: /
          pathType: Prefix
          service:
              identifier: ultrafeeder
              port: http
    tls:
      - hosts:
          - ultrafeeder

serviceMonitor:
  ultrafeeder:
    enabled: true
    serviceName: ultrafeeder
    endpoints:
      - port: metrics
        scheme: http
        path: /metrics
        interval: 10s
        scrapeTimeout: 10s

persistence:
  # Upstream (docker-tar1090) marks every receiver.json field required, but
  # readsb only writes dbServer with an aircraft DB, so telegraf dropped the
  # whole readsb_receiver measurement and logged an error every gather.
  telegraf-receiver:
    type: configMap
    name: telegraf-receiver
    globalMounts:
      - path: /etc/telegraf/telegraf.d/readsb_receiver_json.conf
        subPath: readsb_receiver_json.conf
        readOnly: true
