# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
controllers:
  a2s-exporter:
    replicas: 1
    containers:
      a2s-exporter:
        image:
          repository: jacob.pub/docker.io/armsnyder/a2s-exporter
          tag: v0.4.0@sha256:76c98734c8e56f056d8f5f090601b3b8320a297c4e6f4acadbb153ffe219aaef
          pullPolicy: IfNotPresent
        env:
          - name: A2S_EXPORTER_QUERY_ADDRESS
            value: path-of-titans.path-of-titans.svc.cluster.local:7781
          - name: A2S_EXPORTER_PORT
            value: "8080"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch

service:
  a2s-exporter:
    controller: a2s-exporter
    ports:
      metrics:
        port: 8080
        primary: true
        protocol: TCP

serviceMonitor:
  a2s-exporter:
    enabled: true
    serviceName: a2s-exporter
    endpoints:
      - port: metrics
        scheme: http
        path: /metrics
        interval: 10s
        scrapeTimeout: 5s
