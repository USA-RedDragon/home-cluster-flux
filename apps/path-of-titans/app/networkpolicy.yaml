apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: path-of-titans
  namespace: path-of-titans
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: path-of-titans
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: path-of-titans
            app.kubernetes.io/instance: obsidibot
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: alderongames.com
        - matchPattern: "*.alderongames.com"
        - matchPattern: "*.pathoftitans.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toFQDNs:
        - matchName: discord.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # BattlEye master. Without this, ban checks time out and bans stop being
    # enforced while the server otherwise looks completely healthy.
    #
    # Observed via cilium drops: the game reaches for 57.129.90.115:7917 on BOTH
    # tcp and udp. That address is pot1.battleye.com -> master1.battleye.com as
    # of 2026-07-26.
    - toFQDNs:
        - matchPattern: "*.battleye.com"
      toPorts:
        - ports:
            - port: "7917"
              protocol: TCP
            - port: "7917"
              protocol: UDP
