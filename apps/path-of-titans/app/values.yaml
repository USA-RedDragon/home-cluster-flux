# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
controllers:
  path-of-titans:
    replicas: 1
    podDisruptionBudget:
      minAvailable: 1
    pod:
      priorityClassName: game-server
      terminationGracePeriodSeconds: 420
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    initContainers:
      # BattlEye rewrites BEServer_x64.cfg on every boot, but its directory is on
      # the read-only rootfs. Seed an emptyDir with the shipped BattlEye files so
      # the directory can be mounted writable over the image's copy.
      battleye-seed:
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/path-of-titans
          tag: 50012h5@sha256:7f7d5b28a6736317ec0b526871d94519024a4eafb5010b6983d833b2022303d0
          pullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - cp -r /opt/path-of-titans/PathOfTitans/Binaries/Linux/BattlEye/* /battleye/
        securityContext: &security-context
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
      rcon-seed:
        image:
          repository: jacob.pub/docker.io/outdead/rcon
          tag: 0.10.2@sha256:7aca76877d05eb37f84c72533bdb7b806ef53d6269716a0abee4aeac3c52fcaf
          pullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            cp /rcon /opt/bin/rcon
            cp /lib/ld-musl-x86_64.so.1 /opt/bin/
        securityContext: *security-context
      wireguard:
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/wireguard
          tag: main@sha256:1fca4f1fc917a46e1443dffc1201ed9f516e12fb29dba9471e74762834901cc6
          pullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            set -ex
            ip link del wg0 2>/dev/null || true
            wg-quick up /etc/wireguard/wg0.conf
            ip -4 rule del not fwmark 51820 table 51820 2>/dev/null || true
            ip -4 rule del table main suppress_prefixlength 0 2>/dev/null || true
            ip route replace default dev wg0 table 51820
            ip -4 rule add to 172.16.0.0/12 lookup main pref 100
            ip -4 rule add to 192.168.0.0/16 lookup main pref 100
            ip -4 rule add ipproto udp sport 7777 lookup 51820 pref 200
            ip -4 rule add ipproto udp sport 7781 lookup 51820 pref 200
        securityContext:
          privileged: true
          runAsNonRoot: false
          runAsUser: 0
          capabilities:
            add: ["NET_ADMIN"]
    containers:
      path-of-titans:
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/path-of-titans
          tag: 50012h5@sha256:7f7d5b28a6736317ec0b526871d94519024a4eafb5010b6983d833b2022303d0
          pullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  if /opt/bin/ld-musl-x86_64.so.1 /opt/bin/rcon \
                       -a 127.0.0.1:7779 -p "$RCON_PASSWORD" "Restart 300"; then
                    sleep 300
                  else
                    echo "preStop: RCON restart failed, shutting down now" >&2
                    exit 1
                  fi
        resources:
          requests:
            cpu: 2000m
            memory: 5500Mi
          limits:
            cpu: 2000m
            memory: 10000Mi
        securityContext: *security-context
        probes:
          liveness:
            enabled: true
            custom: true
            spec: &probe
              exec:
                command:
                  - /bin/sh
                  - -c
                  # /proc/net/udp lists ports in hex, so render 7777 as 1E61
                  - 'grep -qE ":$(printf %04X 7777)[[:space:]]" /proc/net/udp'
              periodSeconds: 10
              failureThreshold: 10
          readiness:
            enabled: true
            custom: true
            spec: *probe
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  # /proc/net/udp lists ports in hex, so render 7777 as 1E61
                  - 'grep -qE ":$(printf %04X 7777)[[:space:]]" /proc/net/udp'
              periodSeconds: 10
              failureThreshold: 30
        env:
        - name: TZ
          value: America/Chicago
        - name: SERVER_GUID
          valueFrom:
            secretKeyRef:
              name: path-of-titans
              key: server-guid
        - name: RCON_PASSWORD
          valueFrom:
            secretKeyRef:
              name: path-of-titans
              key: rcon-password
        - name: SERVER_LIST_IP
          valueFrom:
            secretKeyRef:
              name: path-of-titans
              key: server-list-ip
        - name: AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: path-of-titans
              key: auth-token

service:
  path-of-titans:
    controller: path-of-titans
    ports:
      game:
        port: 7777
        protocol: UDP
        primary: true
      query:
        port: 7781
        protocol: UDP
  rcon:
    controller: path-of-titans
    ports:
      rcon:
        port: 7779
        protocol: TCP

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 8Gi
    storageClass: longhorn-nvme
    advancedMounts:
      path-of-titans:
        path-of-titans:
        - path: /opt/path-of-titans/PathOfTitans/Saved
        - path: /opt/path-of-titans/PathOfTitans/Saved/Config/LinuxServer/Game.ini
          subPath: Config/LinuxServer/Game.ini
          readOnly: true
  battleye:
    enabled: true
    type: emptyDir
    sizeLimit: 256Mi
    advancedMounts:
      path-of-titans:
        battleye-seed:
          - path: /battleye
        path-of-titans:
          - path: /opt/path-of-titans/PathOfTitans/Binaries/Linux/BattlEye
  bin:
    enabled: true
    type: emptyDir
    sizeLimit: 32Mi
    advancedMounts:
      path-of-titans:
        rcon-seed:
          - path: /opt/bin
        path-of-titans:
          - path: /opt/bin
  wireguard-config:
    enabled: true
    type: secret
    name: path-of-titans-tunnel
    advancedMounts:
      path-of-titans:
        wireguard:
          - path: /etc/wireguard
