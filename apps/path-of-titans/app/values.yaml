# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
controllers:
  path-of-titans:
    replicas: 1
    podDisruptionBudget:
      minAvailable: 1
    pod:
      priorityClassName: game-server
      terminationGracePeriodSeconds: 700
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    initContainers:
      wireguard:
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/wireguard
          tag: main@sha256:2aabe029c9539882ab77e4ff2967e6509f6bf4dce1b196e2cf383c735ce7ae91
          pullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            set -ex
            ip link del wg0 2>/dev/null || true
            wg-quick up /etc/wireguard/wg0.conf
            ip -4 rule del not fwmark 51820 table 51820 2>/dev/null || true
            ip -4 rule del table main suppress_prefixlength 0 2>/dev/null || true
            ip route replace default dev wg0 table 51820
            ip -4 rule add to 172.16.0.0/12 lookup main pref 100
            ip -4 rule add to 192.168.0.0/16 lookup main pref 100
            ip -4 rule add ipproto udp sport 7777 lookup 51820 pref 200
            ip -4 rule add ipproto udp sport 7781 lookup 51820 pref 200
        securityContext:
          privileged: true
          runAsNonRoot: false
          runAsUser: 0
          capabilities:
            add: ["NET_ADMIN"]
    containers:
      # Keeps Cilium's DNS cache warm for the BattlEye master, so the
      # `toFQDNs: "*.battleye.com"` rule in networkpolicy.yaml authorises
      # whatever address BattlEye currently uses rather than depending on a
      # hardcoded CIDR that goes stale silently.
      #
      # This has to live in THIS pod. Cilium authorises toFQDNs per endpoint,
      # using DNS that endpoint itself performed — a resolver in a separate pod
      # is a separate endpoint and its lookups would not count. Verified by
      # resolving from inside this pod and watching pot1.battleye.com appear in
      # `cilium-dbg fqdn cache list`.
      #
      # 120s against the record's 261s TTL leaves ~2x headroom without relying
      # on Cilium's min-TTL floor being generous.
      battleye-dns-refresh:
        image:
          repository: jacob.pub/ghcr.io/srs-hosting/rcon
          tag: v0.0.4@sha256:d2c2a62ea0d83aad7ebbd8ba39c066568f5f7dc6be9e0fbdf74ec5ca99aafab3
          pullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            trap 'exit 0' TERM INT
            while true; do
              getent hosts pot1.battleye.com >/dev/null 2>&1 || true
              getent hosts discord.com >/dev/null 2>&1 || true
              sleep 120 &
              wait $!
            done
        resources:
          requests:
            cpu: 1m
            memory: 8Mi
          limits:
            memory: 16Mi
        securityContext: &security-context
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
      path-of-titans:
        image:
          repository: jacob.pub/ghcr.io/srs-hosting/path-of-titans
          tag: 50012h22@sha256:8ae0d1b1c0e0ddef430f09e31cd097047c2b6252d80207789b051b331fd05b03
          pullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 2000m
            memory: 5500Mi
          limits:
            cpu: 2000m
            memory: 10000Mi
        securityContext: *security-context
        lifecycle:
          preStop:
            exec:
              command: [/pre-stop]
        probes:
          liveness:
            enabled: true
            custom: true
            spec: &probe
              exec:
                command: [/health]
              periodSeconds: 10
              failureThreshold: 10
          readiness:
            enabled: true
            custom: true
            spec: *probe
          startup:
            enabled: true
            custom: true
            spec: *probe
        env:
        - name: TZ
          value: America/Chicago
        - name: SERVER_GUID
          valueFrom:
            secretKeyRef:
              name: path-of-titans
              key: server-guid
        - name: RCON_PASSWORD
          valueFrom:
            secretKeyRef:
              name: path-of-titans
              key: rcon-password
        - name: SERVER_LIST_IP
          valueFrom:
            secretKeyRef:
              name: path-of-titans
              key: server-list-ip
        - name: AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: path-of-titans
              key: auth-token

service:
  path-of-titans:
    controller: path-of-titans
    ports:
      game:
        port: 7777
        protocol: UDP
        primary: true
      query:
        port: 7781
        protocol: UDP
  rcon:
    controller: path-of-titans
    ports:
      rcon:
        port: 7779
        protocol: TCP

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 8Gi
    storageClass: longhorn-nvme
    advancedMounts:
      path-of-titans:
        path-of-titans:
        - path: /data
  battleye:
    enabled: true
    type: emptyDir
    sizeLimit: 256Mi
    advancedMounts:
      path-of-titans:
        path-of-titans:
          - path: /battleye
  wireguard-config:
    enabled: true
    type: secret
    name: path-of-titans-tunnel
    advancedMounts:
      path-of-titans:
        wireguard:
          - path: /etc/wireguard
