apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: path-of-titans
  namespace: path-of-titans
spec:
  interval: 1h
  targetNamespace: path-of-titans
  path: ./apps/path-of-titans/resources
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
