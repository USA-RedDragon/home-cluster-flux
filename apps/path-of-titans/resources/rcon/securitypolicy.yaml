apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: rcon
  namespace: path-of-titans
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: rcon
  oidc:
    provider:
      issuer: https://auth.srshost.ing/application/o/path-of-titans-rcon/
    clientIDRef:
      name: rcon-oidc
    clientSecret:
      name: rcon-oidc
    scopes: [openid, profile, email, offline_access]
    refreshToken: true
    defaultTokenTTL: 8h
    defaultRefreshTokenTTL: 8h
