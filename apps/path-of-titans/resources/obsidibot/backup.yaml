apiVersion: b2backup.mcswain.dev/v1
kind: ScheduledBackup
metadata:
  name: obsidibot-restic
  namespace: path-of-titans
spec:
  cache:
    enabled: false
  concurrencyPolicy: Forbid
  database:
    cnpgCluster: obsidibot
    engine: cnpg
    secretName: obsidibot-app
  repositoryRef:
    name: restic
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 10m
      memory: 256Mi
  retention:
    daily: 90
    monthly: 24
    weekly: 24
    yearly: 20
  schedule: '@daily'
  sources:
  - tag: db
    type: cnpg
  timeZone: America/Chicago
