apiVersion: b2backup.mcswain.dev/v1
kind: ScheduledBackup
metadata:
  name: restic
  namespace: path-of-titans
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: path-of-titans
        topologyKey: kubernetes.io/hostname
  cache:
    enabled: false
  concurrencyPolicy: Forbid
  repositoryRef:
    name: restic
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 10m
      memory: 256Mi
  retention:
    daily: 90
    monthly: 24
    weekly: 24
    yearly: 20
  schedule: '@daily'
  sources:
  - paths:
    - /data
    tag: server
    type: files
  - paths:
    - /filebrowser
    tag: filebrowser
    type: files
  timeZone: America/Chicago
  volumes:
  - existingClaim: path-of-titans
    mountPath: /data
  - existingClaim: filebrowser
