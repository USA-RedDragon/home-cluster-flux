apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: path-map
  namespace: path-of-titans
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: path-map
  oidc:
    provider:
      issuer: https://auth.srshost.ing/application/o/path-of-titans-map/
    clientIDRef:
      name: path-map-oidc
    clientSecret:
      name: path-map-oidc
    scopes: [openid, profile, email, offline_access]
    refreshToken: true
