# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
controllers:
  path-map:
    replicas: 1
    strategy: RollingUpdate
    containers:
      path-map:
        image:
          repository: jacob.pub/ghcr.io/srs-hosting/path-map
          tag: v1.0.2@sha256:abb68639848e6a6362a568f8050fa4553dd37c23390224ade68c047153bd5c90
          pullPolicy: IfNotPresent
        env:
          - name: RCON_HOST
            value: path-of-titans-rcon.path-of-titans.svc.cluster.local
          - name: RCON_PORT
            value: "7779"
          - name: RCON_PASSWORD
            valueFrom:
              secretKeyRef:
                name: path-of-titans
                key: rcon-password
          - name: HTTP_PORT
            value: "8080"
          - name: MAP_IMAGEPATH
            value: /maps
          - name: POLLER_INTERVALSECONDS
            value: "1"
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: false
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
    pod:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: path-map
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch

service:
  path-map:
    controller: path-map
    ports:
      http:
        port: 8080
        primary: true
        protocol: TCP

ingress:
  tailscale:
    enabled: true
    className: tailscale
    hosts:
      - host: path-map
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: path-map
              port: http
    tls:
      - hosts:
          - path-map

persistence:
  maps:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: longhorn-nvme
    globalMounts:
      - path: /maps

route:
  public:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: public
        namespace: envoy-gateway-system
        sectionName: https
    hostnames:
      - map.srshost.ing
    rules:
      - backendRefs:
          - name: path-map
            port: 8080
        matches:
          - path:
              type: PathPrefix
              value: /
