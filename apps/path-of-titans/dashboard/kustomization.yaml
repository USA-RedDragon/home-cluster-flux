apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: path-of-titans
configMapGenerator:
  - name: path-of-titans-dashboard
    files:
      - path-of-titans.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Path of Titans
