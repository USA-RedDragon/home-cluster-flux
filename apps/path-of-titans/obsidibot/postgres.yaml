apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: obsidibot
  namespace: path-of-titans
spec:
  instances: 3
  imageName: jacob.pub/ghcr.io/cloudnative-pg/postgresql:17.5-22
  enableSuperuserAccess: true
  backup:
    barmanObjectStore:
      destinationPath: "s3://cnpg/obsidibot"
      endpointURL: "https://s3.mcswain.dev"
      s3Credentials:
        accessKeyId:
          name: cnpg-minio
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-minio
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: gzip
    retentionPolicy: "4w"
  bootstrap:
    initdb:
      database: obsidibot
      owner: obsidibot
  storage:
    size: 3Gi
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      memory: 200Mi
      cpu: 100m
  smartShutdownTimeout: 30
  stopDelay: 300
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: obsidibot-backup
spec:
  immediate: true
  schedule: "0 2 * * * *"
  backupOwnerReference: self
  cluster:
    name: obsidibot
