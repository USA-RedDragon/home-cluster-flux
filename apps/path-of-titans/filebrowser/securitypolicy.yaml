apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: filebrowser
  namespace: path-of-titans
spec:
  targetSelectors:
    - kind: HTTPRoute
      matchLabels:
        app.kubernetes.io/instance: filebrowser
  extAuth:
    http:
      backendRefs:
        - name: ak-outpost-authentik-embedded-outpost
          namespace: authentik
          port: 9000
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - X-authentik-username
        - X-authentik-groups
        - X-authentik-email
        - X-authentik-uid
    headersToExtAuth:
      - cookie
      - x-forwarded-proto
      - x-forwarded-host
