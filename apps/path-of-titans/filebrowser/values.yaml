# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
controllers:
  filebrowser:
    replicas: 1
    initContainers:
      rcon-seed:
        image:
          repository: jacob.pub/docker.io/outdead/rcon
          tag: 0.10.2@sha256:7aca76877d05eb37f84c72533bdb7b806ef53d6269716a0abee4aeac3c52fcaf
          pullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            cp /rcon /opt/bin/rcon
            cp /lib/ld-musl-x86_64.so.1 /opt/bin/
            cat > /opt/bin/pot-restart <<'SCRIPT'
            #!/bin/sh
            exec /opt/bin/ld-musl-x86_64.so.1 /opt/bin/rcon \
              -a path-of-titans-rcon:7779 -p "$RCON_PASSWORD" "Restart 600"
            SCRIPT
            chmod +x /opt/bin/pot-restart
        securityContext: &security-context
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
    containers:
      filebrowser:
        image:
          repository: jacob.pub/docker.io/filebrowser/filebrowser
          tag: v2.63.21@sha256:b1d9980d79d6d0ad334e327eea3501324a07fe2bce94a4cd84187bccbcfbe3f8
        args:
          - --database
          - /database/filebrowser.db
          - --address
          - 0.0.0.0
          - --noauth
          - --root
          - /srv
        env:
          - name: RCON_PASSWORD
            valueFrom:
              secretKeyRef:
                name: path-of-titans
                key: rcon-password
        resources:
          limits: {}
          requests: {}
        securityContext: *security-context
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: path-of-titans

service:
  filebrowser:
    controller: filebrowser
    ports:
      http:
        port: 8080
        protocol: TCP

persistence:
  data:
    existingClaim: path-of-titans
    globalMounts:
    - path: /srv
  config:
    enabled: true
    type: configMap
    name: filebrowser
    globalMounts:
    - path: /config/settings.json
      subPath: settings.json
  database:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: longhorn-ssd
  bin:
    enabled: true
    type: emptyDir
    sizeLimit: 32Mi
    advancedMounts:
      filebrowser:
        rcon-seed:
          - path: /opt/bin
        filebrowser:
          - path: /opt/bin

ingress:
  tailscale:
    enabled: true
    className: tailscale
    hosts:
      - host: path-files
        paths:
        - path: /
          pathType: Prefix
          service:
              identifier: filebrowser
              port: http
    tls:
      - hosts:
          - path-files

configMaps:
  config:
    data:
      settings.json: |
        {
          "disableExec": false
        }
