# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json

defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

controllers:
  vaultwarden:
    replicas: 1
    containers:
      vaultwarden:
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        image:
          repository: jacob.pub/ghcr.io/dani-garcia/vaultwarden
          tag: 1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
          pullPolicy: IfNotPresent
        resources:
          limits:
            memory: 128Mi
          requests:
            memory: 70Mi
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
        envFrom:
        - secretRef:
            name: vaultwarden-creds
        env:
        - name: ROCKET_PORT
          value: '8080'
        - name: SIGNUPS_ALLOWED
          value: 'false'
        - name: DOMAIN
          value: https://bitwarden.mcswain.dev
        - name: PUSH_ENABLED
          value: 'true'
        - name: SMTP_SECURITY
          value: force_tls
        - name: SMTP_HOST
          value: email.mcswain.dev
        - name: SMTP_PORT
          value: '465'
        - name: SMTP_USERNAME
          value: vaultwarden
        - name: SIGNUPS_VERIFY
          value: 'true'
        - name: PASSWORD_ITERATIONS
          value: '600001'
        - name: SMTP_FROM
          value: bitwarden@mcswain.dev
        - name: SMTP_FROM_NAME
          value: Bitwarden
        - name: REQUIRE_DEVICE_EMAIL
          value: 'false'
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgresql-app
              key: uri

service:
  vaultwarden:
    controller: vaultwarden
    ports:
      http:
        port: 80
        targetPort: 8080
        primary: true

route:
  vaultwarden:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: public
        namespace: envoy-gateway-system
        sectionName: https
    hostnames:
      - bitwarden.mcswain.dev
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /admin
        filters:
          - type: ExtensionRef
            extensionRef:
              group: gateway.envoyproxy.io
              kind: HTTPRouteFilter
              name: not-found
      - backendRefs:
          - name: vaultwarden
            port: 80
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 8Gi
    storageClass: longhorn-nvme
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
