apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea-mirror
  namespace: gitea
spec:
  install:
    remediation:
      retries: -1
  interval: 60m0s
  maxHistory: 2
  releaseName: gitea-mirror
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: gitea-mirror-values
