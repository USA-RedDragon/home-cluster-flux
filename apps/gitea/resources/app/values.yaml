# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json

controllers:
  gitea:
    replicas: 1
    containers:
      gitea:
        image:
          repository: jacob.pub/docker.gitea.com/gitea
          tag: 1.26.2@sha256:7d13848af12645600a5f9d93ee2560daa9c6fa6b5b859b7bff3a5e1c0b661031
          pullPolicy: IfNotPresent
        resources:
          limits:
            memory: 4Gi
          requests:
            memory: 3Gi
            cpu: 500m
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
        env:
          - name: GITEA__GIT_0x2E_TIMEOUT__MIGRATE
            value: "1200"
          - name: GITEA__GIT_0x2E_TIMEOUT__MIRROR
            value: "1200"
          - name: GITEA__GIT_0x2E_TIMEOUT__PULL
            value: "1200"
          - name: GITEA__GIT_0x2E_TIMEOUT__CLONE
            value: "1200"
          - name: GITEA__GIT_0x2E_TIMEOUT__DEFAULT
            value: "1200"
          - name: GITEA__GIT_0x2E_TIMEOUT__GC
            value: "1200"
          - name: GITEA__METRICS__ENABLED
            value: "true"
          - name: GITEA__METRICS__ENABLED_ISSUE_BY_LABEL
            value: "true"
          - name: GITEA__METRICS__ENABLED_ISSUE_BY_REPOSITORY
            value: "true"
          # Anonymous browsing is fine; blame, history, diffs and archives need a login.
          - name: GITEA__SERVICE__REQUIRE_SIGNIN_VIEW
            value: expensive
          - name: GITEA__SERVICE__DISABLE_REGISTRATION
            value: "true"
          - name: GITEA__REPOSITORY__DEFAULT_PRIVATE
            value: private
          # Real client IPs from envoy / anubis (pod CIDR).
          - name: GITEA__SECURITY__REVERSE_PROXY_TRUSTED_PROXIES
            value: 172.17.0.0/16
          - name: GITEA__OTHER__SHOW_FOOTER_TEMPLATE_LOAD_TIME
            value: "false"
          - name: GITEA__INDEXER__REPO_INDEXER_ENABLED
            value: "true"
          - name: GITEA__SERVER__DOMAIN
            value: git.mcswain.dev
          - name: GITEA__SERVER__ROOT_URL
            value: https://git.mcswain.dev
          - name: GITEA__SERVER__SSH_DOMAIN
            value: git.mcswain.dev
          - name: GITEA__MIGRATIONS__ALLOWED_DOMAINS
            # githubusercontent.com serves LFS objects and release assets for GitHub migrations.
            value: "github.com,*.github.com,githubusercontent.com,*.githubusercontent.com,gitlab.com,*.gitlab.com,bitbucket.org,*.bitbucket.org"
          - name: GITEA__DATABASE__DB_TYPE
            value: postgres
          - name: GITEA__DATABASE__HOST
            valueFrom:
              secretKeyRef:
                name: postgresql-app
                key: host
          - name: GITEA__DATABASE__NAME
            valueFrom:
              secretKeyRef:
                name: postgresql-app
                key: dbname
          - name: GITEA__DATABASE__USER
            valueFrom:
              secretKeyRef:
                name: postgresql-app
                key: username
          - name: GITEA__DATABASE__PASSWD
            valueFrom:
              secretKeyRef:
                name: postgresql-app
                key: password
          - name: GITEA__OPENID__ENABLE_OPENID_SIGNIN
            value: "false"


service:
  gitea:
    controller: gitea
    ports:
      http:
        port: 3000
      ssh:
        port: 22


persistence:
  data:
    enabled: true
    type: nfs
    path: /mnt/data/git
    server: 192.168.1.135
    advancedMounts:
      gitea:
        gitea:
          - path: /data

route:
  # LAN: internal gateway straight to gitea. Also what AdGuard resolves git.mcswain.dev to.
  gitea:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: internal
        namespace: envoy-gateway-system
        sectionName: https
    hostnames:
      - git.mcswain.dev
    rules:
      - backendRefs:
          - name: gitea
            port: 3000
        matches:
          - path:
              type: PathPrefix
              value: /
        timeouts:
          request: 24h
          backendRequest: 23h
  git:
    enabled: true
    kind: TCPRoute
    parentRefs:
      - name: internal
        namespace: envoy-gateway-system
        sectionName: git-ssh
    rules:
      - backendRefs:
          - name: gitea
            port: 22
  # Public web, guarded by the central Anubis (securitypolicy.yaml).
  gitea-public:
    enabled: true
    kind: HTTPRoute
    annotations:
      # Keep it out of AdGuard so LAN resolves to the internal route only (no anubis).
      external-dns.mcswain.dev/internal: skip
    parentRefs:
      - name: public
        namespace: envoy-gateway-system
        sectionName: https
    hostnames:
      - git.mcswain.dev
    rules:
      - backendRefs:
          - name: gitea
            port: 3000
        matches:
          - path:
              type: PathPrefix
              value: /
        timeouts:
          request: 24h
          backendRequest: 23h
  # Public SSH. Key-only, so bots only add log noise; nothing is reachable anonymously over SSH.
  git-public:
    enabled: true
    kind: TCPRoute
    parentRefs:
      - name: public
        namespace: envoy-gateway-system
        sectionName: git-ssh
    rules:
      - backendRefs:
          - name: gitea
            port: 22

serviceMonitor:
  gitea:
    serviceName: gitea
    endpoints:
      - port: http
        scheme: http
        path: /metrics
        interval: 30s
        scrapeTimeout: 10s
