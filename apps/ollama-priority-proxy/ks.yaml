apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ollama-priority-proxy
  namespace: ollama-priority-proxy
spec:
  interval: 1h
  targetNamespace: ollama-priority-proxy
  path: ./apps/ollama-priority-proxy/resources
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
