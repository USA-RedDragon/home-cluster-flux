# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json

controllers:
  wheresmyscope:
    replicas: 3
    strategy: RollingUpdate
    rollingUpdate:
      unavailable: 1
      surge: 25%
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65535
        fsGroup: 65535
    containers:
      wheresmyscope:
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/wheresmyscope
          tag: v1.1.0@sha256:d36176bc8c45471002c86da85946744444ed008bd11f11cc49a93f567cd9a640
          pullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 5m
            memory: 15Mi
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
        env:
          - name: MQTT_PREFIX
            value: observatory/mercury/target
          - name: MQTT_BROKER
            value: mqtt://192.168.254.11:1883
          - name: MQTT_USERNAME
            value: wheresmyscope
          - name: IMAGE_HEIGHT
            value: "480"
          - name: IMAGE_WIDTH
            value: "800"
          # While the observatory images the target, show its newest accepted
          # sub (astro-stacker's watermarked public frame, polled and cached
          # here, served at /image.jpg) instead of the survey cutout. The
          # egress policy below already allows in-cluster pods, and
          # astro-stacker has no ingress policy.
          - name: PUBLICFRAME_STACKER_URL
            value: http://astro-stacker.astro-processing.svc.cluster.local:8080
        envFrom:
          - secretRef:
              name: wheresmyscope
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

service:
  wheresmyscope:
    controller: wheresmyscope
    ports:
      http:
        port: 8080

route:
  wheresmyscope:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: public
        namespace: envoy-gateway-system
        sectionName: https
    hostnames:
      - wheresmyscope.mcswain.dev
    rules:
      - backendRefs:
          - name: wheresmyscope
            port: 8080
        matches:
          - path:
              type: PathPrefix
              value: /

networkpolicies:
  wheresmyscope:
    enabled: true
    controller: wheresmyscope
    policyTypes: [Ingress, Egress]
    rules:
      ingress:
        - from:
          - namespaceSelector: {}
      egress:
        - to:
          - namespaceSelector: {}
        - to:
          - ipBlock:
              cidr: 192.168.254.11/32
            port: 1883
        - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
