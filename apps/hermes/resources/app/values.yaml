# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/values.schema.json

defaultPodOptions:
  automountServiceAccountToken: false

controllers:
  hermes:
    replicas: 1
    strategy: Recreate
    pod:
      # The image's s6 entrypoint needs root, so hermes runs as PID 1's child here; the pause container reaps zombies
      shareProcessNamespace: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    initContainers:
      init:
        image: &image
          repository: jacob.pub/docker.io/nousresearch/hermes-agent
          tag: v0.22.7@sha256:e6d81ae52ebf6a43efa529701405509f20054ba818f179ddd748bed4f8af584c
          pullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -ec
          - |
            # Hermes wants its home owned by its own uid, and the volume root is root's
            install -d -m 700 /opt/data/hermes /opt/data/hermes/.ssh
            install -m 600 /ssh/id_ed25519 /opt/data/hermes/.ssh/id_ed25519
            install -m 644 /ssh/known_hosts /opt/data/hermes/.ssh/known_hosts
            install -m 600 /config/ssh_config /opt/data/hermes/.ssh/config
            /opt/hermes/.venv/bin/python /opt/hermes/tools/skills_sync.py || echo "skills_sync failed; continuing"
        env: &env
          HOME: /opt/data/hermes
          USER: hermes
          HERMES_HOME: /opt/data/hermes
          HERMES_WRITE_SAFE_ROOT: /opt/data/hermes
          HERMES_MANAGED_DIR: /etc/hermes-managed
          HERMES_API_TIMEOUT: "1800"
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 1Gi
        securityContext: &securityContext
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
      # One gateway per home. As a native sidecar it takes the lock before the dashboard starts, so the dashboard
      #   attaches to it instead of spawning its own, and it serves the API that hermes-workspace talks to
      gateway:
        dependsOn: init
        restartPolicy: Always
        image: *image
        command:
          - /opt/hermes/.venv/bin/hermes
          - gateway
          - run
          - --no-supervise
          - --external-supervisor
        workingDir: /opt/data/hermes
        env:
          <<: *env
          API_SERVER_HOST: 0.0.0.0
          API_SERVER_PORT: "8642"
          API_SERVER_KEY:
            valueFrom:
              secretKeyRef:
                name: hermes-api
                key: API_SERVER_KEY
        resources:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            memory: 8Gi
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8642
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 120
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8642
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
        securityContext: *securityContext
    containers:
      hermes:
        image: *image
        command:
          - /opt/hermes/.venv/bin/hermes
          - dashboard
          - --host
          - 127.0.0.1
          - --port
          - "9119"
          - --no-open
        workingDir: /opt/data/hermes
        env: *env
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 8Gi
        probes:
          # The dashboard listens on loopback only, so the kubelet can't reach it; probe from inside the container
          liveness: &hermesProbe
            enabled: true
            custom: true
            spec:
              exec:
                command: ["curl", "-sf", "-o", "/dev/null", "http://127.0.0.1:9119/"]
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
          readiness: *hermesProbe
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["curl", "-sf", "-o", "/dev/null", "http://127.0.0.1:9119/"]
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 120
        securityContext: *securityContext
      # The dashboard demands a login on any non-loopback bind. It stays on loopback, and this proxy presents
      #   tailnet requests as loopback ones; the tailnet and the network policy are the only access control
      proxy:
        image:
          repository: jacob.pub/docker.io/nginxinc/nginx-unprivileged
          tag: 1.31-alpine@sha256:b9241c6e7b8e9a862f129d8d4199ab64b10390949a78bdd5603379b32c844083
          pullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 128Mi
        probes:
          liveness: &proxyProbe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
          readiness: *proxyProbe
        securityContext: *securityContext
  # A separate pod: everything it needs from Hermes goes over the gateway API and the dashboard API.
  #   Its memory and config editors read local files, so they don't work here; use the dashboard for those
  workspace:
    replicas: 1
    strategy: Recreate
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    containers:
      workspace:
        image:
          repository: jacob.pub/ghcr.io/outsourc-e/hermes-workspace
          tag: main-c631425@sha256:1ec05339750da7caaf1cd0183c8c3b188856918b377407b4ac1dafca67e42d88
          pullPolicy: IfNotPresent
        env:
          HOST: 0.0.0.0
          PORT: "3000"
          # No login on purpose: the tailnet and the network policy are the access control
          HERMES_ALLOW_INSECURE_REMOTE: "1"
          HERMES_API_URL: http://hermes.hermes.svc.cluster.local:8642
          HERMES_DASHBOARD_URL: http://hermes.hermes.svc.cluster.local:8080
          HERMES_API_TOKEN:
            valueFrom:
              secretKeyRef:
                name: hermes-api
                key: API_SERVER_KEY
          HOME: /app/.runtime/home
          HERMES_HOME: /app/.runtime/hermes
          HERMES_WORKSPACE_DIR: /app/.runtime/workspace
        resources:
          requests:
            cpu: 20m
            memory: 256Mi
          limits:
            memory: 3Gi
        probes:
          liveness: &workspaceProbe
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 3000
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 3
          readiness: *workspaceProbe
          startup:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 3000
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 60
        securityContext: *securityContext

service:
  hermes:
    controller: hermes
    ports:
      http:
        port: 8080
      api:
        port: 8642
  workspace:
    controller: workspace
    ports:
      http:
        port: 3000

# The web UIs are on the tailnet only
ingress:
  tailscale:
    enabled: true
    forceRename: hermes
    className: tailscale
    hosts:
      - host: hermes
        paths:
        - path: /
          pathType: Prefix
          service:
              identifier: hermes
              port: http
    tls:
      - hosts:
          - hermes
  workspace:
    enabled: true
    forceRename: hermes-workspace
    className: tailscale
    hosts:
      - host: hermes-workspace
        paths:
        - path: /
          pathType: Prefix
          service:
              identifier: workspace
              port: http
    tls:
      - hosts:
          - hermes-workspace

configMaps:
  managed:
    data:
      # Pinned on top of /opt/data/hermes/config.yaml; settings changed in the dashboard persist on the PVC
      config.yaml: |
        model:
          default: qwen3.8:27b
          provider: custom
          base_url: http://192.168.0.184:11434/v1
          context_length: 131072
        terminal:
          backend: ssh
          cwd: /home/hermes
          ssh_host: sim-linux
          ssh_user: hermes
          ssh_key: /opt/data/hermes/.ssh/id_ed25519
        browser:
          chromium_args:
            - --no-sandbox
            - --disable-dev-shm-usage
        mcp_servers:
          rea:
            command: ssh
            args:
              - sim-linux
              - env
              - HOPPER_LAUNCHER_PATH=/opt/hopper/bin/Hopper
              - npx
              - -y
              - rea-agents@6.8.0
              - mcp
            enabled: true
        auth:
          adopt_external_logins: false
        updates:
          check: false
  config:
    data:
      # OpenSSH needs a passwd entry for the running uid
      passwd: |
        root:x:0:0:root:/root:/bin/sh
        hermes:x:568:568:hermes:/opt/data/hermes:/bin/bash
        nobody:x:65534:65534:nobody:/nonexistent:/usr/sbin/nologin
      group: |
        root:x:0:
        hermes:x:568:
        nogroup:x:65534:
      ssh_config: |
        Host sim-linux
          HostName 192.168.0.184
          User hermes
          IdentityFile /opt/data/hermes/.ssh/id_ed25519
          IdentitiesOnly yes
          UserKnownHostsFile /opt/data/hermes/.ssh/known_hosts
          StrictHostKeyChecking yes
          BatchMode yes
          ServerAliveInterval 30
      nginx.conf: |
        pid /tmp/nginx.pid;
        events {}
        http {
          access_log off;
          client_body_temp_path /tmp/cb; proxy_temp_path /tmp/p; fastcgi_temp_path /tmp/f;
          uwsgi_temp_path /tmp/u; scgi_temp_path /tmp/s;
          map $http_upgrade $connection_upgrade {
            default upgrade;
            '' close;
          }
          server {
            listen 8080;
            client_max_body_size 512m;
            location = /healthz { return 200 "ok\n"; }
            location / {
              proxy_pass http://127.0.0.1:9119;
              proxy_http_version 1.1;
              proxy_set_header Host 127.0.0.1:9119;
              proxy_set_header Origin http://127.0.0.1:9119;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_set_header X-Forwarded-For "";
              proxy_buffering off;
              proxy_read_timeout 24h;
              proxy_send_timeout 24h;
            }
          }
        }

persistence:
  data:
    type: persistentVolumeClaim
    forceRename: hermes
    retain: true
    storageClass: longhorn-nvme
    accessMode: ReadWriteOnce
    size: 40Gi
    advancedMounts:
      hermes:
        init:
          - path: /opt/data
        gateway:
          - path: /opt/data
        hermes:
          - path: /opt/data
  workspace:
    type: persistentVolumeClaim
    retain: true
    storageClass: longhorn-nvme
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      workspace:
        workspace:
          - path: /app/.runtime
  ssh:
    type: secret
    name: hermes-ssh
    advancedMounts:
      hermes:
        init:
          - path: /ssh
            readOnly: true
  managed:
    type: configMap
    identifier: managed
    advancedMounts:
      hermes:
        hermes:
          - &managed
            path: /etc/hermes-managed
            readOnly: true
        init:
          - *managed
        gateway:
          - *managed
  config:
    type: configMap
    identifier: config
    advancedMounts:
      hermes:
        init:
          - path: /config
            readOnly: true
          - &passwd
            path: /etc/passwd
            subPath: passwd
            readOnly: true
          - &group
            path: /etc/group
            subPath: group
            readOnly: true
        gateway:
          - *passwd
          - *group
        hermes:
          - *passwd
          - *group
        proxy:
          - path: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
  tmp:
    type: emptyDir
    advancedMounts:
      hermes:
        init:
          - path: /tmp
        gateway:
          - path: /tmp
        hermes:
          - path: /tmp
        proxy:
          - path: /tmp
      workspace:
        workspace:
          - path: /tmp
