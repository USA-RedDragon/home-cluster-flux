# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/values.schema.json

defaultPodOptions:
  automountServiceAccountToken: false

controllers:
  hermes:
    replicas: 1
    strategy: Recreate
    pod:
      # Hermes' turn drain (agent.restart_drain_timeout) plus a minute for its own cleanup
      terminationGracePeriodSeconds: 660
      # The image's s6 entrypoint needs root, so hermes runs as PID 1's child here; the pause container reaps zombies
      shareProcessNamespace: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    initContainers:
      # The device plugin, from the hermes-device image, so client, plugin and protocol share one release
      device-plugin:
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/hermes-device
          tag: v0.19.4@sha256:ef59c3bf22cf3a0c6ef35db02ca57e276d17e04917746e2cda7635c9b8db0bc6
          pullPolicy: IfNotPresent
        command: ["/hermes-device", "plugin", "install", "--dest", "/opt/data/hermes/plugins/device"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
      # Claude Code's native binary for the Claude subscription providers, on the volume (the image stays as
      #   published). Downloads a version that is not installed yet; claude-verify checks it. A failure here
      #   or there leaves Hermes running without the Claude subscription providers
      claude-download:
        dependsOn: device-plugin
        image: &image
          # Hermes Agent with the patches in github.com/USA-RedDragon/hermes-patches; the tag before -p is the upstream release
          repository: &hermesRepository jacob.pub/ghcr.io/usa-reddragon/hermes-patches
          tag: &hermesTag v0.23.1-p2@sha256:5915c03b764d743683ecf73c9994bde18f296628c885c91b1c9ecf39be7eae6b
          pullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            D=/opt/data/hermes/claude-code
            V=$CLAUDE_CODE_VERSION
            install -d -m 700 /opt/data/hermes "$D" "$D/versions" || exit 1
            [ -x "$D/versions/$V/claude" ] && exit 0
            rm -rf "$D"/staging-*
            S="$D/staging-$V"
            R="https://downloads.claude.ai/claude-code-releases/$V"
            install -d -m 700 "$S" &&
              curl -fsSL --retry 3 --connect-timeout 20 -o "$S/manifest.json" "$R/manifest.json" &&
              curl -fsSL --retry 3 --connect-timeout 20 -o "$S/manifest.json.sig" "$R/manifest.json.sig" &&
              curl -fsSL --retry 3 --connect-timeout 20 -o "$S/claude" "$R/linux-x64/claude" ||
              { echo "Claude Code $V download failed"; rm -rf "$S"; }
            exit 0
        env:
          CLAUDE_CODE_VERSION: &claudeCodeVersion "2.1.322"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi
        securityContext: &securityContext
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
      # Installs the download only when Anthropic's release key signed its manifest (sqv, Sequoia's verifier, is
      #   in Debian's base image) and the binary matches the manifest's checksum. It checks the installed binary
      #   again on every start
      claude-verify:
        dependsOn: claude-download
        image:
          repository: jacob.pub/docker.io/library/debian
          tag: 13.7-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
          pullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            V=$CLAUDE_CODE_VERSION
            D=/opt/data/hermes/claude-code
            check() {
              sqv --keyring /config/claude-code.asc --signature-file "$1/manifest.json.sig" "$1/manifest.json" >/dev/null &&
                grep -q "\"version\": \"$V\"" "$1/manifest.json" &&
                sum=$(sed -n '/"linux-x64": {/,/}/s/.*"checksum": "\([0-9a-f]\{64\}\)".*/\1/p' "$1/manifest.json") &&
                [ -n "$sum" ] && echo "$sum  $1/claude" | sha256sum -c --quiet
            }
            if [ ! -x "$D/versions/$V/claude" ] && [ -d "$D/staging-$V" ]; then
              if check "$D/staging-$V"; then
                chmod 755 "$D/staging-$V/claude" && mv "$D/staging-$V" "$D/versions/$V"
              else
                echo "Claude Code $V failed verification; not installed"
                rm -rf "$D/staging-$V"
              fi
            fi
            rm -f /opt/data/hermes/bin/claude
            if [ -x "$D/versions/$V/claude" ]; then
              if check "$D/versions/$V"; then
                install -d -m 700 /opt/data/hermes/bin && ln -s "$D/versions/$V/claude" /opt/data/hermes/bin/claude &&
                  echo "Claude Code $V verified"
              else
                echo "Installed Claude Code $V failed verification; removed"
                rm -rf "$D/versions/$V"
              fi
            fi
            for old in "$D"/versions/*; do [ "$old" = "$D/versions/$V" ] || rm -rf "$old"; done
            exit 0
        env:
          CLAUDE_CODE_VERSION: *claudeCodeVersion
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        securityContext: *securityContext
      init:
        dependsOn: claude-verify
        image: *image
        command:
          - /bin/sh
          - -ec
          - |
            # Hermes wants its home owned by its own uid, and the volume root is root's
            install -d -m 700 /opt/data/hermes /opt/data/hermes/workspace
            rm -rf /opt/data/hermes/.ssh
            /opt/hermes/.venv/bin/python /opt/hermes/tools/skills_sync.py || echo "skills_sync failed; continuing"
            # Mirror the managed overlay into config.yaml, for anything that reads config.yaml directly
            /opt/hermes/.venv/bin/python /config/merge-managed.py
            # Shared memory: Honcho. The plugin and its honcho-ai dependency live on this volume (the image's
            #   venv is sealed); hermes re-execs into the environment that has it
            install -m 600 /config/honcho.json /opt/data/hermes/honcho.json
            [ -d /opt/data/hermes/plugins/honcho ] || /opt/hermes/.venv/bin/hermes plugins install honcho --yes-deps
            /opt/hermes/.venv/bin/hermes plugins enable honcho || true
            # Model routes for subagents (delegation.backend: model_map)
            [ -d /opt/data/hermes/plugins/advanced-delegation ] || /opt/hermes/.venv/bin/hermes plugins install advanced-delegation --yes-deps || echo "advanced-delegation install failed; continuing"
            /opt/hermes/.venv/bin/hermes plugins enable advanced-delegation || true
            # Device sessions run with this server cwd; their commands run in the device directory
            install -d -m 700 /opt/data/hermes/device-placeholder
            # The server cwd of sessions that run in the sandbox; Hermes reads AGENTS.md and git state from it, so keep it empty
            install -d -m 700 /opt/data/hermes/empty-cwd
            /opt/hermes/.venv/bin/hermes plugins enable device || true
            # Claude subscriptions: Nous' plugin drives the claude CLI; claude-accounts (ours, in /claude-accounts) adds
            #   one provider per account login in /opt/data/hermes/claude/<id> and the hub's sign-in and usage routes
            [ -d /opt/data/hermes/plugins/claude-subscription-directsdk-experimental ] || /opt/hermes/.venv/bin/hermes plugins install claude-subscription-directsdk --yes-deps || echo "claude-subscription-directsdk install failed; continuing"
            /opt/hermes/.venv/bin/hermes plugins enable claude-subscription-directsdk-experimental || true
            P=/opt/data/hermes/plugins/claude-accounts
            rm -rf "$P.new"
            install -d -m 755 "$P.new" "$P.new/dashboard"
            install -m 644 /claude-accounts/plugin.yaml /claude-accounts/__init__.py /claude-accounts/core.py "$P.new/"
            install -m 644 /claude-accounts/plugin_api.py "$P.new/dashboard/plugin_api.py"
            install -m 644 /claude-accounts/manifest.json "$P.new/dashboard/manifest.json"
            rm -rf "$P" && mv "$P.new" "$P"
            install -d -m 700 /opt/data/hermes/claude
            /opt/hermes/.venv/bin/hermes plugins enable claude-accounts || true
        env: &env
          HOME: /opt/data/hermes
          USER: hermes
          HERMES_HOME: /opt/data/hermes
          # The image the gateway runs, which the device plugin reports so that talaria chat runs the same build
          HERMES_IMAGE_REPOSITORY: *hermesRepository
          HERMES_IMAGE_TAG: *hermesTag
          # The upstream image hermes-patches builds on, which devices can pull when they cannot pull the patched one
          HERMES_BASE_IMAGE: docker.io/nousresearch/hermes-agent:v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08
          # Device paths too: file tools write through the device, and the device enforces its own roots. /home does
          #   not exist in the pod
          HERMES_WRITE_SAFE_ROOT: /opt/data/hermes:/home:/work
          HERMES_DEVICE_HUB_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAiuaEZ3j30C2FUMJrm1r10rJZyt1EwAYGKor/3LZqjSA=
            -----END PUBLIC KEY-----
          HERMES_MANAGED_DIR: /etc/hermes-managed
          HERMES_API_TIMEOUT: "1800"
          HONCHO_API_KEY:
            valueFrom:
              secretKeyRef:
                name: hermes-honcho
                key: HONCHO_API_KEY
          CLAUDE_SUBSCRIPTION_DIRECTSDK_COMMAND: /opt/data/hermes/bin/claude
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 1Gi
        securityContext: *securityContext
      # One gateway per home. As a native sidecar it takes the lock before the dashboard starts, so the dashboard
      #   attaches to it instead of spawning its own
      gateway:
        dependsOn: init
        restartPolicy: Always
        image: *image
        command:
          - /opt/hermes/.venv/bin/hermes
          - gateway
          - run
          - --no-supervise
          - --external-supervisor
        workingDir: /opt/data/hermes
        env:
          <<: *env
          API_SERVER_HOST: 0.0.0.0
          API_SERVER_PORT: "8642"
          API_SERVER_KEY:
            valueFrom:
              secretKeyRef:
                name: hermes-api
                key: API_SERVER_KEY
        # The gateway serves the Webapp listener (webapp: in the managed config) that hermes-hub signs in to; the
        #   dashboard container never gets this provider, so its loopback listener stays open behind the proxy
        envFrom:
          - secretRef:
              name: hermes-hub-auth
          - &anthropic
            # Claude API: ANTHROPIC_API_KEY for Hermes' own anthropic provider, from Jacob's Claude Console
            #   organization. Optional, so Hermes starts without it; claude-accounts never passes it to Claude Code
            secretRef:
              name: hermes-anthropic
              optional: true
        resources:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            memory: 8Gi
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8642
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 120
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8642
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
        securityContext: *securityContext
    containers:
      # Hosts one hermes acp per editor connection that the hub forwards. Its own container, so editor sessions
      #   outlive gateway restarts; the binary comes from the hermes-device image, mounted read-only
      acp-host:
        image: *image
        command: ["/opt/hermes-device/hermes-device", "acp-host"]
        workingDir: /opt/data/hermes
        envFrom:
          - *anthropic
        env:
          <<: *env
          TMPDIR: /tmp
          TALARIA_ACP_HOST_LISTEN: ":9130"
          TALARIA_ACP_HOST_BACKEND_ID: jacob
          TALARIA_ACP_HOST_PLACEHOLDER: /opt/data/hermes/device-placeholder
          TALARIA_ACP_HOST_HERMES: /opt/hermes/.venv/bin/hermes
          TALARIA_ACP_HOST_HUB_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAiuaEZ3j30C2FUMJrm1r10rJZyt1EwAYGKor/3LZqjSA=
            -----END PUBLIC KEY-----
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 4Gi
        probes:
          liveness: &acpProbe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 9130
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *acpProbe
        securityContext: *securityContext
      hermes:
        image: *image
        command:
          - /opt/hermes/.venv/bin/hermes
          - dashboard
          - --host
          - 127.0.0.1
          - --port
          - "9119"
          - --no-open
        workingDir: /opt/data/hermes
        envFrom:
          - *anthropic
        env: *env
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 8Gi
        probes:
          # The dashboard listens on loopback only, so the kubelet can't reach it; probe from inside the container
          liveness: &hermesProbe
            enabled: true
            custom: true
            spec:
              exec:
                command: ["curl", "-sf", "-o", "/dev/null", "http://127.0.0.1:9119/"]
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
          readiness: *hermesProbe
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["curl", "-sf", "-o", "/dev/null", "http://127.0.0.1:9119/"]
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 120
        securityContext: *securityContext
      # The dashboard demands a login on any non-loopback bind. It stays on loopback, and this proxy presents
      #   requests as loopback ones, which hands out operator access, so nothing routes to it: reach it with
      #   kubectl -n hermes port-forward deploy/hermes 8080
      proxy:
        image:
          repository: jacob.pub/docker.io/nginxinc/nginx-unprivileged
          tag: 1.31.6-alpine@sha256:b9241c6e7b8e9a862f129d8d4199ab64b10390949a78bdd5603379b32c844083
          pullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 128Mi
        probes:
          liveness: &proxyProbe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
          readiness: *proxyProbe
        securityContext: *securityContext

service:
  hermes:
    controller: hermes
    ports:
      http:
        port: 8080
      api:
        port: 8642
      webapp:
        port: 9120
      acp:
        port: 9130

configMaps:
  managed:
    data:
      # Pinned on top of /opt/data/hermes/config.yaml, and merged into it at start; other settings changed in the
      #   dashboard persist on the PVC
      config.yaml: |
        model:
          default: qwen3.8:27b
          provider: custom
          base_url: http://ollama-priority-proxy.ollama-priority-proxy.svc.cluster.local:11434/v1
          context_length: 131072
        # The Nous provider would use the pod's default Claude login; claude-accounts offers one provider per account
        model_catalog:
          excluded_providers:
            - claude-subscription-directsdk-experimental
        # Hermes detects Ollama and asks it for num_ctx, capped at this window for every model on this route
        #   (subagents too; another num_ctx reloads the model). Not model.ollama_num_ctx: that one also capped a
        #   chat switched to Claude at 131072
        custom_providers:
          - name: local-ollama
            base_url: http://ollama-priority-proxy.ollama-priority-proxy.svc.cluster.local:11434/v1
            context_length: 131072
        # Small model: qwen3.5:2b fits in VRAM next to the main model (qwen3.5:4b does not). The agent picks a route
        #   per subagent; a subagent with no route runs on the main model. To add Claude Haiku, add a route with
        #   provider: anthropic and the key; "default: <route>" sends every unrouted subagent to one route
        delegation:
          backend: model_map
          backends:
            model_map:
              options:
                - name: quick
                  description: "Small fast local model. Only for simple, single-step work: look up a fact, read or list a few files, summarize given text, a short mechanical edit. Not for debugging, planning, multi-step changes or anything that needs judgment."
                  base_url: http://ollama-priority-proxy.ollama-priority-proxy.svc.cluster.local:11434/v1
                  model: qwen3.5:2b
                  reasoning_effort: none
        # Title generation runs in the background, so it goes through /low; compression holds up the turn, so it does not
        auxiliary:
          title_generation:
            provider: custom
            base_url: http://ollama-priority-proxy.ollama-priority-proxy.svc.cluster.local:11434/low/v1
            model: qwen3.5:2b
            reasoning_effort: none
          compression:
            provider: custom
            base_url: http://ollama-priority-proxy.ollama-priority-proxy.svc.cluster.local:11434/v1
            model: qwen3.5:2b
            reasoning_effort: none
            context_length: 131072
            # Chats on Claude summarize on their own model at their 1M window's threshold (patch 0001 of
            #   hermes-patches); every other chat uses the small local model above
            main_model_providers: [claude-account1, claude-account2, anthropic]
        # Code work happens in each device's own Hermes; this one's shell is a sandbox in its pod
        # Sessions bound to a PC run commands there; every other session runs in the person's sandbox pod, never here
        terminal:
          backend: device
          cwd: /opt/data/hermes/empty-cwd
          # A foreground command still running after 2 minutes moves to the background and notifies on exit
          #   (hermes-patches 0002; Hermes does this on its local backend only, not yet on device)
          auto_background_seconds: 120
        # image.render (TUI inline previews) reads only images Hermes stored (hermes-patches 0003)
        security:
          image_render_paths: media
        sessions:
          # A background process that exits while nobody is viewing its chat runs as an agent turn, up to 10 in
          #   a row, so the agent picks the work back up (hermes-patches 0007)
          unviewed_completion_turns: 10
          # Editors (ACP session/list) also offer chats the hub, TUI and CLI started (hermes-patches 0008)
          acp_list_sources: [acp, gui, local, tui, cli]
        browser:
          chromium_args:
            - --no-sandbox
            - --disable-dev-shm-usage
        memory:
          provider: honcho
          # Hermes's defaults: its own notes (MEMORY.md, USER.md) next to Honcho, managed in the hub's Memory page
          memory_enabled: true
          user_profile_enabled: true
          nudge_interval: 10
          # Raised from 2,200 / 1,375 for the rules imported from Jacob's Claude setup
          memory_char_limit: 8000
          user_char_limit: 3000
        auth:
          adopt_external_logins: false
        updates:
          check: false
        # Cron schedules ("every monday 9am") and the agent's clock use US Central, not the pod's UTC
        timezone: America/Chicago
        # For hermes-hub. A wildcard bind is behind dashboard sign-in: the gateway's basic provider, user hub
        # On a pod stop, let running turns finish (up to 10 minutes) before Hermes exits
        agent:
          restart_drain_timeout: 600
          # No hosted connectors through Nous (manage_connections) and no installs from the online catalog (manage_catalog)
          disabled_toolsets:
            - connections
            - catalog
        plugins:
          entries:
            device:
              # Lets the plugin hide Hermes's browser_vault tool
              granted_capabilities: [tools.override]
              settings:
                backend_id: jacob
                placeholder: /opt/data/hermes/device-placeholder
                fallback: device
                fallback_device: sandbox-jacob
                fallback_root: /work
                # The one hub user of this backend: sandbox chats and scheduled jobs use this user's Firefox
                user: reddragon
            # One Claude subscription per slot, provider claude-<id> in the model picker; the login lives in
            #   /opt/data/hermes/claude/<id>. Rename a slot by its label only: the id names its login directory
            claude-accounts:
              settings:
                accounts:
                  - id: account1
                    label: Claude (account1)
                  - id: account2
                    label: Claude (account2)
        webapp:
          enabled: true
          host: 0.0.0.0
          port: 9120
  config:
    data:
      merge-managed.py: |
        import os
        from hermes_yaml import safe_dump, safe_load

        path = "/opt/data/hermes/config.yaml"
        with open("/etc/hermes-managed/config.yaml") as f:
            managed = safe_load(f) or {}
        config = {}
        if os.path.exists(path):
            with open(path) as f:
                config = safe_load(f) or {}

        def merge(base, top):
            for key, value in top.items():
                if isinstance(value, dict) and isinstance(base.get(key), dict):
                    merge(base[key], value)
                else:
                    base[key] = value

        # Settings an earlier version of this deployment managed; the merge alone would keep them
        config.get("mcp_servers", {}).pop("rea", None)
        config.get("model", {}).pop("ollama_num_ctx", None)
        for key in ("ssh_host", "ssh_user", "ssh_key", "ssh_port"):
            config.get("terminal", {}).pop(key, None)

        merge(config, managed)
        with open(path + ".tmp", "w") as f:
            safe_dump(config, f, sort_keys=False)
        os.replace(path + ".tmp", path)
      # Anthropic's Claude Code release key (fingerprint 31DD DE24 DDFA B679 F42D 7BD2 BAA9 29FF 1A7E CACE, from
      #   https://downloads.claude.ai/keys/claude-code.asc, as code.claude.com/docs/en/setup gives it)
      claude-code.asc: |
        -----BEGIN PGP PUBLIC KEY BLOCK-----

        mQINBGnK73ABEACnbytJXkjweYrwIr0aLEFRlH+C0nF44KxFc7gQmJ6PjSPMGZAD
        dxZcaixU7zZl8WxEpVO0wLmIH8cf2zGOdyuZg1Yaugk1vHb2b8WBhAGCQJdPgB8W
        XquedepEYtk56uP/gCoTjJDUZluEGBHnlnuujSJ4orxEdhSykEoAUfJZGEILPpMd
        bphFt/Sn+Eb/TxM5jpKPdwnv8AShNF/1mZU1fWTQq9tRKJUakZj04gdaDFElQXak
        CtTij+GT6yoYCARSHwGO+PC/Pr6q4tc+D7LRjxSBvUWDoFSmlqb/PJ1hj9D/7I2O
        e4XXniAPWMR56KvxHlzOzrNQdJujbJdSkCwh1ZijkSd3y8ayW5WYUTGdRab99NUw
        agzlabe/VVF6kzJ0Scn5q3PihB2Y9Bwo0CKnkYk7a7KT77EWv0Kkq+VHmOtqX3a2
        hhX+b6a6ve9rzJ1qZYGj+obv/C3Sx1LzUjAfqVy7RJDf2uAoP5t2g8u/TkSpUxhM
        VEjZBkSxYZhMyzQM6t8IgkUfnSrIPTHixbDWARZ4beMOBjxyPZK1nP7OOrNR3TkK
        JtwLMQAabURCDnL0PjS0iwBTU4jtumBD1XSULyWuoTvMljrpQr1nV1oDyOt0OLqa
        KA2McWtd9PdXhC8y2EIg7TmrTlJLfHYbdmkiCYj4J49Q8HWkN/6WE+RTUwARAQAB
        tD5BbnRocm9waWMgQ2xhdWRlIENvZGUgUmVsZWFzZSBTaWduaW5nIDxzZWN1cml0
        eUBhbnRocm9waWMuY29tPokCUQQTAQoAOxYhBDHd3iTd+rZ59C170rqpKf8afsrO
