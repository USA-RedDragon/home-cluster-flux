      # preStop of acp-host: keeps the container, and so the pod's readiness, up while the gateway
      #   sidecar is in its restart wait, so the hub still reaches it to answer approvals. With "signal" (acp-host has
      #   no liveness probe, so its preStop runs only on a pod stop) it first marks the pod
      #   stopping and sends the gateway SIGTERM, which opens that wait (gateway.sigterm_restart_wait)
      hermes-prestop.py: |
        import os
        import signal
        import sys
        import time
        import urllib.request

        marker = "/tmp/pod-stopping"
        if sys.argv[1:] == ["signal"]:
            open(marker, "w").close()
            # Serve on until the new pod's gateway has warmed up and waits for the lock (gateway.standby), so it
            #   takes over within a second; a stop with no successor goes on after 2 minutes
            start = time.time()
            standby = "/opt/data/hermes/gateway.standby"
            while time.time() - start < 120:
                try:
                    if os.path.getmtime(standby) >= start - 1:
                        break
                except OSError:
                    pass
                time.sleep(0.5)
            for pid in filter(str.isdigit, os.listdir("/proc")):
                try:
                    with open(f"/proc/{pid}/cmdline", "rb") as f:
                        argv = f.read().split(b"\0")
                except OSError:
                    continue
                if b"gateway" in argv and b"run" in argv and b"--external-supervisor" in argv:
                    os.kill(int(pid), signal.SIGTERM)
        # Without the marker this is a restart of this container alone (a failed liveness probe), not a pod stop
        start = time.monotonic()
        while not os.path.exists(marker):
            if time.monotonic() - start > 5:
                sys.exit(0)
            time.sleep(0.2)
        deadline = time.monotonic() + 760
        failures = 0
        while time.monotonic() < deadline and failures < 3:
            try:
                urllib.request.urlopen("http://127.0.0.1:9120/api/health", timeout=2).close()
                failures = 0
            except Exception:
                failures += 1
            time.sleep(1)
      # The image has no passwd entry for uid 568
      passwd: |
        root:x:0:0:root:/root:/bin/sh
        hermes:x:568:568:hermes:/opt/data/hermes:/bin/bash
        nobody:x:65534:65534:nobody:/nonexistent:/usr/sbin/nologin
      group: |
        root:x:0:
