      # Only Jacob uses this instance (his wife has hermes-kittykat), so every runtime identity pins to his peer
      honcho.json: |
        {
          "hosts": {
            "hermes": {
              "baseUrl": "http://honcho.honcho.svc.cluster.local:8000",
              "workspace": "jacob",
              "peerName": "jacob",
              "aiPeer": "hermes",
              "sessionStrategy": "per-session",
              "pinUserPeer": true
            }
          }
        }

persistence:
  data:
    type: persistentVolumeClaim
    forceRename: hermes
    retain: true
    storageClass: longhorn-nvme
    accessMode: ReadWriteOnce
    size: 40Gi
    advancedMounts:
      hermes:
        init:
          - path: /opt/data
        gateway:
          - path: /opt/data
        acp-host:
          - path: /opt/data
        device-plugin:
          - path: /opt/data
        claude-download:
          - path: /opt/data
        claude-verify:
          - path: /opt/data
        plugins:
          - path: /opt/data
  managed:
    type: configMap
    identifier: managed
    advancedMounts:
      hermes:
        init:
          - &managed
            path: /etc/hermes-managed
            readOnly: true
        gateway:
          - *managed
        acp-host:
          - *managed
  config:
    type: configMap
    identifier: config
    advancedMounts:
      hermes:
        init:
          - path: /config
            readOnly: true
          - &passwd
            path: /etc/passwd
            subPath: passwd
            readOnly: true
          - &group
            path: /etc/group
            subPath: group
            readOnly: true
        claude-verify:
          - path: /config
            readOnly: true
        gateway:
          - *passwd
          - *group
        acp-host:
          - *passwd
          - *group
          - path: /etc/hermes-prestop.py
            subPath: hermes-prestop.py
            readOnly: true
  tmp:
    type: emptyDir
    advancedMounts:
      hermes:
        init:
          - path: /tmp
        gateway:
          - path: /tmp
        acp-host:
          - path: /tmp
  # The hermes-device binary, for acp-host
  device-bin:
    type: custom
    volumeSpec:
      image:
        reference: jacob.pub/ghcr.io/usa-reddragon/hermes-device:v0.20.0@sha256:dafeed26fe1adcd4ef40abd9f8a49e63eabcb63c7f265045078eb9a5cf4a9dca
        pullPolicy: IfNotPresent
    advancedMounts:
      hermes:
        acp-host:
          - path: /opt/hermes-device
            readOnly: true
