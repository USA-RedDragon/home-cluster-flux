# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/values.schema.json

defaultPodOptions:
  automountServiceAccountToken: false

controllers:
  hermes-hub:
    # Two replicas share PostgreSQL; one of them, elected through an advisory lock, polls Telegram
    replicas: 2
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: 0
    podDisruptionBudget:
      minAvailable: 1
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    containers:
      hermes-hub:
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/hermes-hub
          tag: v0.14.0@sha256:808a72e00e166c69dfd75b5e89b66488f9f2b95c518d4c5ec25498631f13feb8
          pullPolicy: IfNotPresent
        # users and backends can only be set in the config file, so it comes from the hermes-hub Secret with the
        #   backend passwords; the other settings are here
        env:
          CONFIG: /config/config.yaml
          TMPDIR: /tmp
          HUB_LOG_LEVEL: info
          HUB_HTTP_PORT: "8080"
          HUB_HTTP_PUBLIC_URL: https://hub.mcswain.dev
          HUB_HTTP_METRICS_ENABLED: "true"
          HUB_HTTP_METRICS_IPV4_HOST: 0.0.0.0
          HUB_HTTP_METRICS_IPV6_HOST: "::"
          HUB_HTTP_METRICS_PORT: "8081"
          HUB_OIDC_ISSUER_URL: https://authentik.mcswain.dev/application/o/hermes-hub/
          HUB_OIDC_CLIENT_ID: tREPLBoC0qfZVyZUL0yRHgeIGFhf8JMy6xNncyhM
          HUB_UI_DEFAULT_BACKENDS: reddragon=jacob,kittykat=kittykat
          HUB_STORE_DRIVER: postgres
          HUB_STORE_DSN:
            valueFrom:
              secretKeyRef:
                name: postgresql-app
                key: uri
          HUB_TELEGRAM_ENABLED: "true"
          # Paired computers and sandboxes; the hub signs each device connection with this key
          HUB_DEVICE_ENABLED: "true"
          HUB_DEVICE_SIGNING_KEY:
            valueFrom:
              secretKeyRef:
                name: hermes-hub
                key: HUB_DEVICE_SIGNING_KEY
          HUB_TELEGRAM_DEFAULT_BACKENDS: reddragon=jacob,kittykat=kittykat
          HUB_OIDC_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: hermes-hub
                key: HUB_OIDC_CLIENT_SECRET
          HUB_SESSION_SECRET:
            valueFrom:
              secretKeyRef:
                name: hermes-hub
                key: HUB_SESSION_SECRET
          HUB_TELEGRAM_TOKEN:
            valueFrom:
              secretKeyRef:
                name: hermes-hub
                key: HUB_TELEGRAM_TOKEN
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 1Gi
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          # Fails as soon as a stopping replica starts to drain, so traffic moves before it exits
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: 8080
              periodSeconds: 2
              timeoutSeconds: 2
              failureThreshold: 1
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
              periodSeconds: 2
              timeoutSeconds: 5
              failureThreshold: 30
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]

service:
  hermes-hub:
    controller: hermes-hub
    ports:
      http:
        port: 8080
        primary: true
      metrics:
        port: 8081

# LAN only, on the internal gateway
route:
  hermes-hub:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: internal
        namespace: envoy-gateway-system
        sectionName: https
    hostnames:
      - hub.mcswain.dev
    rules:
      # Device connections are long-lived WebSockets with their own pings
      - backendRefs:
          - identifier: hermes-hub
            port: 8080
        matches:
          - path:
              type: PathPrefix
              value: /api/device/
        timeouts:
          request: 0s
      - backendRefs:
          - identifier: hermes-hub
            port: 8080
        matches:
          - path:
              type: PathPrefix
              value: /
        # Each session streams as server-sent events; the hub sends a comment every 15 s and the browser resumes from
        #   its last event id
        timeouts:
          request: 24h

serviceMonitor:
  hermes-hub:
    enabled: true
    serviceName: hermes-hub
    endpoints:
      - port: metrics
        scheme: http
        path: /metrics
        interval: 30s
        scrapeTimeout: 10s

persistence:
  config:
    type: secret
    name: hermes-hub
    items:
      - key: config.yaml
        path: config.yaml
    globalMounts:
      - path: /config
        readOnly: true
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
