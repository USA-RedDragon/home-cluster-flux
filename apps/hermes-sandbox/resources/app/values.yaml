# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/values.schema.json

defaultPodOptions:
  automountServiceAccountToken: false

controllers:
  hermes-sandbox:
    # One connection per sandbox device: a second pod would replace the first one's (close 4409)
    replicas: 1
    strategy: Recreate
    labels:
      policy.mcswain.dev/egress-coredns: "true"
      policy.mcswain.dev/egress-internet: "true"
    pod:
      labels:
        policy.mcswain.dev/egress-coredns: "true"
        policy.mcswain.dev/egress-internet: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    containers:
      sandbox:
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/talaria-sandbox
          tag: v0.26.4@sha256:1318b0133495af284b60e6b8d639c46e93eda64e1d1f16592f62496344d01dab
          pullPolicy: IfNotPresent
        env:
          # The hub's Service, not its public route: the sandbox reaches nothing on the LAN
          TALARIA_HUB_URL: http://talaria-hub.talaria-hub.svc.cluster.local:8080
          TALARIA_HUB_TOKEN_FILE: /secrets/token
        resources:
          requests:
            cpu: 50m
            memory: 384Mi
          limits:
            memory: 8Gi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]

persistence:
  work:
    type: persistentVolumeClaim
    forceRename: hermes-sandbox
    storageClass: longhorn-nvme
    accessMode: ReadWriteOnce
    size: 20Gi
    globalMounts:
      - path: /work
  token:
    type: secret
    name: hermes-sandbox
    defaultMode: 0440
    items:
      - key: token
        path: token
    globalMounts:
      - path: /secrets
        readOnly: true
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
  # The sandbox's headless Firefox (talaria browser.headless) keeps page memory here; the default 64 MiB crashes tabs
  shm:
    type: emptyDir
    medium: Memory
    sizeLimit: 1Gi
    globalMounts:
      - path: /dev/shm
