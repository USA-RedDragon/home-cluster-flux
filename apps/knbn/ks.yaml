apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: knbn
  namespace: knbn
spec:
  interval: 1h
  targetNamespace: knbn
  path: ./apps/knbn/app
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres
  namespace: knbn
spec:
  interval: 1h
  targetNamespace: knbn
  path: ./apps/knbn/postgres
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: restic
  namespace: knbn
spec:
  interval: 1h
  targetNamespace: knbn
  path: ./apps/knbn/restic
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
---
