apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: frigate
resources:
  - helm.yaml
  - backends.yaml
  - forward-auth.yaml
  - nvr.yaml
configMapGenerator:
  - name: frigate-chart-values
    files:
      - values.yaml=values.yaml
  # Mounted by name from the chart values, so no hash suffix.
  - name: frigate-patches
    files:
      - patches/timeline.py
      - patches/cleanup.py
    options:
      disableNameSuffixHash: true
configurations:
  - kustomizeconfig.yaml
