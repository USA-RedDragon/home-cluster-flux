apiVersion: batch/v1
kind: Job
metadata:
  name: backfill
  namespace: fah
spec:
  backoffLimit: 1
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/controller: fah
                  app.kubernetes.io/instance: fah
                  app.kubernetes.io/name: fah
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sqlite
          image: jacob.pub/docker.io/keinos/sqlite3:3.54.1@sha256:b577e65892c6468d94b390097eda4488e05253470c161bdea68a05abb961fa17
          imagePullPolicy: IfNotPresent
          command: ["sqlite3"]
          args:
            - -batch
            - -bail
            - -cmd
            - .timeout 60000
            - /data/fah.db
            - .read /sql/backfill.sql
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: sql
              mountPath: /sql
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fah
        - name: sql
          configMap:
            name: backfill-sql
        - name: tmp
          emptyDir: {}
