# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json

controllers:
  apprise:
    replicas: 1
    containers:
      apprise:
        image:
          repository: jacob.pub/lscr.io/linuxserver/apprise-api
          tag: 1.5.4@sha256:9a0d15b11aa1e9979ff05ba21abfd8b5d586d73d4b2d0c81fa406f8b1b39aaee
        env:
          # Configs are plain files (<key>.cfg) so one can be mounted from a Secret.
          APPRISE_STATEFUL_MODE: simple
          # No /get, /add, /del: stored configs (and the tokens in them) can't be read back or
          # rewritten over the API. /notify/<key> still works.
          APPRISE_CONFIG_LOCK: "yes"
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
        resources:
          limits:
            memory: 120Mi
          requests:
            cpu: 10m
            memory: 80Mi

service:
  apprise:
    controller: apprise
    ports:
      http:
        port: 8000

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: longhorn-ssd
  # /notify/torrents -> Telegram (qbit-manage + cross-seed). Token stays in the sops secret,
  # off the PVC (and its restic backups).
  torrents:
    enabled: true
    type: secret
    name: torrents-telegram
    globalMounts:
      - path: /config/torrents.cfg
        subPath: torrents.cfg
        readOnly: true

ingress:
  tailscale:
    enabled: true
    className: tailscale
    hosts:
      - host: apprise
        paths:
        - path: /
          pathType: Prefix
          service:
              identifier: apprise
              port: http
    tls:
      - hosts:
          - apprise
