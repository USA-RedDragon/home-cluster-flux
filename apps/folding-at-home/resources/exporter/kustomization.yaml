apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: folding-at-home
resources:
  - helm.yaml
  - prom.yaml
configMapGenerator:
  - name: folding-at-home-exporter-chart-values
    files:
      - values.yaml=values.yaml
  - name: folding-at-home-exporter-script
    files:
      - fah_exporter.py
    options:
      disableNameSuffixHash: true
configurations:
  - kustomizeconfig.yaml
