# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json

defaultPodOptions:
  automountServiceAccountToken: false
  priorityClassName: folding-at-home
  terminationGracePeriodSeconds: 60

controllers:
  cpu:
    type: statefulset
    replicas: 8
    statefulset:
      podManagementPolicy: Parallel
      volumeClaimTemplates:
        - name: config
          accessMode: ReadWriteOnce
          size: 5Gi
          storageClass: longhorn-r1
          labels: &vctLabels
            recurring-job.longhorn.io/source: enabled
            recurring-job.longhorn.io/trim: enabled
          globalMounts:
            - path: /config
    pod:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/controller: cpu
                  app.kubernetes.io/name: folding-at-home
    containers:
      fah:
        image: &image
          repository: jacob.pub/lscr.io/linuxserver/foldingathome
          tag: 8.5.6-ls219@sha256:6d16e2e1460e43e84d3e48ba956aee4aa826435233ad3e8c6c3526f3e6f20bd8
          pullPolicy: IfNotPresent
        command:
          - sh
          - -c
          - export MACHINE_NAME="k8s-${HOSTNAME#folding-at-home-}" CLI_ARGS="--cpus $(( $(nproc) * 3 / 4 ))"; exec chrt --idle 0 /init
        env:
          TZ: America/Chicago
          PUID: "911"
          PGID: "1001"
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 3Gi
  gpu:
    type: statefulset
    replicas: 2
    statefulset:
      podManagementPolicy: Parallel
      volumeClaimTemplates:
        - name: config
          accessMode: ReadWriteOnce
          size: 5Gi
          storageClass: longhorn-r1
          labels: *vctLabels
          globalMounts:
            - path: /config
    pod:
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
    containers:
      fah:
        image: *image
        command:
          - sh
          - -c
          - export MACHINE_NAME="k8s-${HOSTNAME#folding-at-home-}" CLI_ARGS="--cpus 0"; exec /init
        env:
          TZ: America/Chicago
          PUID: "911"
          PGID: "1001"
          NVIDIA_VISIBLE_DEVICES: all
          NVIDIA_DRIVER_CAPABILITIES: compute,utility
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            memory: 3Gi
            nvidia.com/gpu: 1

service:
  cpu:
    controller: cpu
    ports:
      http:
        port: 7396
  gpu:
    controller: gpu
    ports:
      http:
        port: 7396
