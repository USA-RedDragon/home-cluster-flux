# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/values.schema.json
controllers:
  redis:
    forceRename: redis-app
    strategy: Recreate
    pod:
      enableServiceLinks: true
    containers:
      app:
        image:
          repository: jacob.pub/docker.io/redis
          tag: '8@sha256:4764ce37931aac77c0d033680b339b19b4a4a81772204d268947cb851212d0ac'
          pullPolicy: IfNotPresent
        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 6379
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 6379
service:
  app:
    forceRename: redis-app
    controller: redis
    ports:
      redis:
        port: 6379
