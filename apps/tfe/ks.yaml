apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tfe
  namespace: tfe
spec:
  interval: 1h
  targetNamespace: tfe
  path: ./apps/tfe/resources/app
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: redis
  namespace: tfe
spec:
  interval: 1h
  targetNamespace: tfe
  path: ./apps/tfe/resources/redis
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
