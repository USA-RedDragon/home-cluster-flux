# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json

controllers:
  astro-stacker:
    replicas: 1
    strategy: RollingUpdate

    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch

    containers:
      app:
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/astro-stacker
          tag: "beta@sha256:ee3da74bb0777060e7f116ecfeb681df456dc4746ea25ea3cac55018eb0aacbd"
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
        env:
          DB_USER:
            secretKeyRef:
              name: postgresql-app
              key: user
          DB_PASS:
            secretKeyRef:
              name: postgresql-app
              key: password
          DB_HOST:
            secretKeyRef:
              name: postgresql-app
              key: host
          DB_PORT:
            secretKeyRef:
              name: postgresql-app
              key: port
          SCHEDULER_DB_NAME:
            value: "schedulerdb"
          APP_DB_NAME:
            secretKeyRef:
              name: postgresql-app
              key: dbname
          STORAGE_TYPE:
            value: "postgres"
          STORAGE_DSN_APP:
            value: host=$(DB_HOST) user=$(DB_USER) password=$(DB_PASS) dbname=$(APP_DB_NAME) port=$(DB_PORT) sslmode=disable
            dependsOn: [DB_USER, DB_PASS, DB_HOST, DB_PORT, APP_DB_NAME]
          STORAGE_DSN_SCHEDULERDB:
            value: host=$(DB_HOST) user=$(DB_USER) password=$(DB_PASS) dbname=$(SCHEDULER_DB_NAME) port=$(DB_PORT) sslmode=disable
            dependsOn: [DB_USER, DB_PASS, DB_HOST, DB_PORT, SCHEDULER_DB_NAME]
          METRICS_ENABLED:
            value: "true"
          METRICS_BIND:
            value: "[::]"
          METRICS_PORT:
            value: "9090"
          PPROF_ENABLED:
            value: "true"
          PPROF_BIND:
            value: "[::]"
          LOG_LEVEL:
            value: "debug"
          HTTP_TRUSTED_PROXIES:
            value: "172.17.0.0/16"
          # Index frame headers from the astro bucket (read-only MinIO user).
          INDEXER_ENABLED:
            value: "true"
          S3_ENDPOINT:
            value: "minio.minio.svc:9000"
          S3_USE_SSL:
            value: "false"
          # Auto-stretched JPEG previews of every light, in astro-processed.
          PREVIEWS_ENABLED:
            value: "true"
          PREVIEWS_CONCURRENCY:
            value: "2"
          # Calibrate, register and stack good subs into one master per
          # target and filter (Siril, in the image).
          STACKING_ENABLED:
            value: "true"
          STACKING_WORK_DIR:
            value: /tmp/stacking
          STACKING_SIRIL_THREADS:
            value: "4"
          # Share of the pod's memory limit Siril may use. Registration needs
          # about 320 MiB per thread; Siril runs while the accumulator is idle.
          STACKING_SIRIL_MEMORY:
            value: "0.5"
          # Targets stacked at once. Each worker's Siril gets a sixth of the
          # Siril share (2 GiB, enough for 4 threads) and its accumulator
          # up to about 1.5 GB. Three workers used under 3 cores.
          STACKING_WORKERS:
            value: "6"
          S3_ACCESS_KEY:
            secretKeyRef:
              name: astro-stacker-s3
              key: S3_ACCESS_KEY
          S3_SECRET_KEY:
            secretKeyRef:
              name: astro-stacker-s3
              key: S3_SECRET_KEY
        resources:
          requests:
            cpu: 3
            memory: 6Gi
          limits:
            # Previews hold about 200 MB each; each stacking worker's
            # accumulator is 416 MB and a rebuild pass about 730 MB, plus
            # Siril's share of the limit.
            memory: 24Gi

persistence:
  # Downloads, calibration masters and Siril output; the root filesystem is
  # read-only. A per-pod volume on the "fast" NVMes, not an emptyDir: rebuilds
  # write ~60 MB/s of 32-bit FITS, which saturated gamma's Talos system disk
  # (slowing containerd, kubelet and logs) and then its DRAM-less 980 (750 ms
  # writes).
  tmp:
    type: custom
    volumeSpec:
      ephemeral:
        volumeClaimTemplate:
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: longhorn-fast-r1
            resources:
              requests:
                storage: 30Gi
    globalMounts:
      - path: /tmp

service:
  astro-stacker:
    controller: astro-stacker
    ports:
      http:
        port: 8080
      metrics:
        port: 9090
      pprof:
        port: 9999

serviceMonitor:
  astro-stacker:
    enabled: true
    serviceName: astro-stacker
    endpoints:
      - port: metrics
        scheme: http
        path: /metrics
        interval: 10s
        scrapeTimeout: 10s

ingress:
  tailscale:
    enabled: true
    className: tailscale
    hosts:
      - host: astro-stacker
        paths:
        - path: /
          pathType: Prefix
          service:
              identifier: astro-stacker
              port: http
    tls:
      - hosts:
          - astro-stacker
