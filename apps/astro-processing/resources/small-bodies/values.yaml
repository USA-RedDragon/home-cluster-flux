# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json

defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

controllers:
  astro-small-bodies:
    replicas: 1
    strategy: Recreate
    containers:
      app:
        image: &image
          repository: jacob.pub/ghcr.io/usa-reddragon/astro-small-bodies
          tag: "beta@sha256:4b2de72012ae91f7fb3ccb12cd47fa3419e6c2f7e050d3e0e068f2a089e146df"
        args: ["serve"]
        env: &env
          S3_ENDPOINT: minio.minio.svc:9000
          S3_USE_SSL: "false"
          S3_BUCKET: small-bodies
          WORKDIR: /work
          S3_ACCESS_KEY:
            secretKeyRef:
              name: small-bodies-s3
              key: S3_ACCESS_KEY
          S3_SECRET_KEY:
            secretKeyRef:
              name: small-bodies-s3
              key: S3_SECRET_KEY
        securityContext: &securityContext
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
              periodSeconds: 30
              failureThreshold: 10
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
              periodSeconds: 10
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
              periodSeconds: 10
              failureThreshold: 90
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: 4
            memory: 6Gi

  update:
    type: cronjob
    cronjob:
      schedule: "0 15 * * *"
      timeZone: Etc/UTC
      concurrencyPolicy: Forbid
      startingDeadlineSeconds: 3600
      successfulJobsHistory: 1
      failedJobsHistory: 1
      ttlSecondsAfterFinished: 86400
      backoffLimit: 1
      activeDeadlineSeconds: 21600
    pod:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [alpha, beta, gamma, delta]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: astro-small-bodies
              app.kubernetes.io/controller: update
    containers:
      app:
        image: *image
        args: ["update"]
        env:
          <<: *env
          WORKERS: "4"
        securityContext: *securityContext
        resources:
          requests:
            cpu: 2
            memory: 8Gi
          limits:
            cpu: 4
            memory: 8Gi

service:
  astro-small-bodies:
    controller: astro-small-bodies
    ports:
      http:
        port: 8080

persistence:
  work:
    type: custom
    advancedMounts:
      astro-small-bodies:
        app:
          - path: /work
    volumeSpec:
      ephemeral:
        volumeClaimTemplate:
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: longhorn-fast-r1
            resources:
              requests:
                storage: 12Gi
  update-work:
    type: custom
    advancedMounts:
      update:
        app:
          - path: /work
    volumeSpec:
      ephemeral:
        volumeClaimTemplate:
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: longhorn-fast-r1
            resources:
              requests:
                storage: 20Gi
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
