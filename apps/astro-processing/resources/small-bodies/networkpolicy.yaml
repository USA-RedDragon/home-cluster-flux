apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: astro-small-bodies
  namespace: astro-processing
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: astro-small-bodies
      app.kubernetes.io/controller: astro-small-bodies
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: astro-processing
            app.kubernetes.io/name: astro-stacker
        - matchLabels:
            io.kubernetes.pod.namespace: astro-processing
            app.kubernetes.io/name: discoveries-backfill
        - matchLabels:
            io.kubernetes.pod.namespace: astro-processing
            app.kubernetes.io/instance: discoveries-vetting
            app.kubernetes.io/controller: vet
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: minio
            app.kubernetes.io/instance: minio
            app.kubernetes.io/name: minio
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: astro-small-bodies-update
  namespace: astro-processing
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: astro-small-bodies
      app.kubernetes.io/controller: update
  ingress:
    - {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: minorplanetcenter.net
        - matchName: www.minorplanetcenter.net
        - matchName: ssd.jpl.nasa.gov
        - matchName: ssd-api.jpl.nasa.gov
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: minio
            app.kubernetes.io/instance: minio
            app.kubernetes.io/name: minio
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
