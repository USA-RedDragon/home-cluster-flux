# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json

controllers:
  symmetricds:
    replicas: 1
    # Two engines must never run against schedulerdb at once, and both would
    # share the fixed instance ID below.
    strategy: Recreate

    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch

    containers:
      symmetricds:
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/symmetricds
          tag: "3.18.1@sha256:53e32d608e672a108abfd7b3ed0418b3e8d765404c811f37f8c9b5023ca6798d"
        # The web server stays up even when the engine fails to start, so a TCP
        # probe passes; /ping answers 660 until the engine is running.
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /sync/home/ping
                port: 31415
              periodSeconds: 30
              failureThreshold: 4
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /sync/home/ping
                port: 31415
              periodSeconds: 10
              failureThreshold: 3
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /sync/home/ping
                port: 31415
              periodSeconds: 10
              failureThreshold: 60
        resources:
          requests:
            cpu: 10m
            memory: 512Mi
          limits:
            memory: 1Gi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
          - name: POSTGRES_USERNAME
            valueFrom:
              secretKeyRef:
                name: postgresql-symmetricds
                key: username
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgresql-symmetricds
                key: password

service:
  symmetricds:
    controller: symmetricds
    ports:
      http:
        port: 31415

ingress:
  tailscale:
    enabled: true
    className: tailscale
    hosts:
      - host: symmetricds-home
        paths:
        - path: /
          pathType: Prefix
          service:
              identifier: symmetricds
              port: http
    tls:
      - hosts:
          - symmetricds-home

persistence:
  logs:
    enabled: true
    type: emptyDir
    sizeLimit: 3Gi
    globalMounts:
      - path: /opt/symmetric-ds/logs
  tmp:
    enabled: true
    type: emptyDir
    sizeLimit: 3Gi
    globalMounts:
      - path: /opt/symmetric-ds/tmp
  engines:
    enabled: true
    type: configMap
    identifier: engines
    globalMounts:
      - path: /opt/symmetric-ds/engines
  bootstrap:
    enabled: true
    type: configMap
    name: symmetricds-bootstrap
    globalMounts:
      - path: /opt/symmetric-ds/bootstrap
  # 3.18+ refuses to start if sym_node_host holds a different instance ID
  # with a recent heartbeat. The image has no conf/instance.uuid, so without
  # this every pod generates a new ID and a rollout's new pod fails.
  instance-id:
    enabled: true
    type: configMap
    identifier: engines
    globalMounts:
      - path: /opt/symmetric-ds/conf/instance.uuid
        subPath: instance.uuid
        readOnly: true

configMaps:
  engines:
    suffix: engines
    data:
      instance.uuid: symmetricds-home
      home.properties: |
        engine.name=home
        db.driver=org.postgresql.Driver
        db.url=jdbc:postgresql://postgresql-rw:5432/schedulerdb
        db.user=$(POSTGRES_USERNAME)
        db.password=$(POSTGRES_PASSWORD)
        group.id=home
        external.id=home
        sync.url=https://symmetricds-home.jackal-stargazer.ts.net/sync/home
        registration.url=
        auto.registration=true
        initial.load.create.first=true
        job.routing.period.time.ms=5000
        job.push.period.time.ms=10000
        job.pull.period.time.ms=10000
        job.purge.period.time.ms=7200000
        auto.config.registration.svr.sql.script=/opt/symmetric-ds/bootstrap/home-config.sql
