apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: symmetricds
  namespace: astro-processing
spec:
  install:
    remediation:
      retries: -1
  interval: 60m0s
  maxHistory: 2
  driftDetection:
    mode: enabled
  releaseName: symmetricds
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: symmetricds-chart-values
