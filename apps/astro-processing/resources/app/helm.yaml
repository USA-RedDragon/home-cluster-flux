apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: astro-processing
  namespace: astro-processing
spec:
  install:
    remediation:
      retries: -1
  interval: 60m0s
  driftDetection:
    mode: enabled
  releaseName: astro-processing
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: astro-processing-chart-values
