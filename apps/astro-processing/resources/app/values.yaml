# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json

defaultPodOptions:
  automountServiceAccountToken: false

controllers:
  frontend:
    replicas: 1
    strategy: RollingUpdate

    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch

    containers:
      frontend:
        resources:
          limits:
            memory: 48Mi
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/astro-processing-frontend
          tag: "beta@sha256:f3db8fe8152c6e7dcb89670346dd3528006e802c8e79695157ecdbfe0d1add78"
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true

  backend:
    replicas: 1
    strategy: RollingUpdate

    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch

    containers:
      backend:
        resources:
          limits:
            memory: 112Mi
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/astro-processing
          tag: "beta@sha256:d1901da580c42a14c6d3b19b1ab735f47e5f310cfafa3ec4d29fc66c382b21f6"
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
        env:
          DB_USER:
            secretKeyRef:
              name: postgresql-app
              key: user
          DB_PASS:
            secretKeyRef:
              name: postgresql-app
              key: password
          DB_HOST:
            secretKeyRef:
              name: postgresql-app
              key: host
          DB_PORT:
            secretKeyRef:
              name: postgresql-app
              key: port
          DB_NAME:
            value: "schedulerdb"
          STORAGE_TYPE:
            value: "postgres"
          STORAGE_DSN:
            value: host=$(DB_HOST) user=$(DB_USER) password=$(DB_PASS) dbname=$(DB_NAME) port=$(DB_PORT) sslmode=disable
            dependsOn: [DB_USER, DB_PASS, DB_HOST, DB_PORT, DB_NAME]
          METRICS_ENABLED:
            value: "true"
          METRICS_BIND:
            value: "[::]"
          METRICS_PORT:
            value: "9090"
          PPROF_ENABLED:
            value: "true"
          PPROF_BIND:
            value: "[::]"
          LOG_LEVEL:
            value: "debug"
          HTTP_TRUSTED_PROXIES:
            value: "172.17.0.0/16"
          # Calibration coverage comes from the worker's frame index.
          WORKER_URL:
            value: "http://astro-stacker:8080"

service:
  frontend:
    controller: frontend
    ports:
      http:
        port: 8080
  backend:
    controller: backend
    ports:
      http:
        port: 8080
      metrics:
        port: 9090
      pprof:
        port: 9999

persistence:
  nginx-tmp:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 1Gi
    advancedMounts:
      frontend:
        frontend:
          - path: /tmp

serviceMonitor:
  backend:
    enabled: true
    service:
      identifier: backend
    endpoints:
      - port: metrics
        scheme: http
        path: /metrics
        interval: 10s
        scrapeTimeout: 10s

ingress:
  tailscale:
    enabled: true
    className: tailscale
    hosts:
      - host: astro-processing
        paths:
        - path: /
          pathType: Prefix
          service:
              identifier: frontend
              port: http
        - path: /query
          pathType: Prefix
          service:
              identifier: backend
              port: http
        # Server-sent events: previews, masters and stacker progress.
        - path: /events
          pathType: Prefix
          service:
              identifier: backend
              port: http
        - path: /api/v1
          pathType: Prefix
          service:
              name: astro-stacker
              port: 8080
    tls:
      - hosts:
          - astro-processing
