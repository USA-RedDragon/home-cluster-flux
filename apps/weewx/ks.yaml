apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: weewx-mariadb
  namespace: weewx
spec:
  interval: 1h
  targetNamespace: weewx
  path: ./apps/weewx/resources/mariadb
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: weewx
  namespace: weewx
spec:
  interval: 1h
  targetNamespace: weewx
  path: ./apps/weewx/resources/app
  prune: true
  dependsOn:
    - name: weewx-mariadb
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: restic
  namespace: weewx
spec:
  interval: 1h
  targetNamespace: weewx
  path: ./apps/weewx/resources/restic
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
