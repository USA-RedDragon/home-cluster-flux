apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: weewx
  namespace: weewx
spec:
  install:
    remediation:
      retries: -1
  interval: 60m0s
  maxHistory: 2
  releaseName: weewx
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: chart-values
