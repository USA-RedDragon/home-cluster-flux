apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: golink
  namespace: golink
spec:
  install:
    remediation:
      retries: -1
  interval: 60m0s
  driftDetection:
    mode: enabled
  releaseName: golink
  chart:
    spec:
      chart: app
      sourceRef:
        kind: HelmRepository
        name: usa-reddragon
        namespace: flux-system
      version: '0.1.35'
      interval: 60m0s
  valuesFrom:
    - kind: ConfigMap
      name: chart-values
  postRenderers:
  - kustomize:
      patches:
      - target:
          version: v1
          kind: PersistentVolumeClaim
          name: data
        patch: |
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: data
            annotations:
              helm.sh/resource-policy: keep
