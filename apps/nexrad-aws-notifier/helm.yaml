apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nexrad-aws-notifier
  namespace: nexrad-aws-notifier
spec:
  install:
    remediation:
      retries: -1
  interval: 60m0s
  driftDetection:
    mode: enabled
  releaseName: nexrad-aws-notifier
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: '5.0.1'
      interval: 60m0s
  valuesFrom:
    - kind: ConfigMap
      name: chart-values
