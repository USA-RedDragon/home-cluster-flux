apiVersion: b2backup.mcswain.dev/v1
kind: Repository
metadata:
  name: restic
  namespace: hermes-kittykat
spec:
  bucket: mcswain-kubernetes-backups
  mode: Prefix
  passwordSecretRef:
    key: RESTIC_PASSWORD
    name: restic-envs
  path: k8s/hermes-kittykat
---
apiVersion: b2backup.mcswain.dev/v1
kind: ScheduledBackup
metadata:
  name: restic
  namespace: hermes-kittykat
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/controller: hermes
            app.kubernetes.io/instance: hermes-kittykat
            app.kubernetes.io/name: hermes-kittykat
        topologyKey: kubernetes.io/hostname
  cache:
    enabled: false
  concurrencyPolicy: Forbid
  podLabels:
    policy.mcswain.dev/egress-coredns: "true"
    policy.mcswain.dev/egress-internet: "true"
  repositoryRef:
    name: restic
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 10m
      memory: 256Mi
  retention:
    daily: 90
    monthly: 24
    weekly: 24
    yearly: 20
  schedule: '@daily'
  sources:
  - paths:
    - /opt/data
    tag: files
    type: files
  timeZone: America/Chicago
  volumes:
  - existingClaim: hermes-kittykat
    mountPath: /opt/data
