      # preStop of acp-host: keeps the container, and so the pod's readiness, up while the gateway
      #   sidecar is in its restart wait, so the hub still reaches it to answer approvals. acp-host has a liveness
      #   probe, so this hook also runs when only this container restarts; there it must not touch the gateway.
      #   It asks the API for its own pod: with metadata.deletionTimestamp unset it is a container restart and
      #   the hook exits at once. With the timestamp set, or when the API cannot be asked (fail toward the
      #   graceful stop), it marks the pod stopping and sends the gateway SIGTERM, which opens the restart wait
      #   (gateway.sigterm_restart_wait). Every step is bounded, so a hung acp-host cannot hold it
      hermes-prestop.py: |
        import json
        import os
        import signal
        import ssl
        import sys
        import time
        import urllib.request

        SA = "/var/run/secrets/kubernetes.io/serviceaccount"
        marker = "/tmp/pod-stopping"


        def pod_is_restarting_alone():
            """True only when the API answered and this pod has no deletionTimestamp."""
            try:
                host = os.environ["KUBERNETES_SERVICE_HOST"]
                if ":" in host:
                    host = f"[{host}]"
                url = (f"https://{host}:{os.environ.get('KUBERNETES_SERVICE_PORT', '443')}"
                       f"/api/v1/namespaces/{os.environ['POD_NAMESPACE']}/pods/{os.environ['POD_NAME']}")
                with open(f"{SA}/token") as f:
                    token = f.read().strip()
                ctx = ssl.create_default_context(cafile=f"{SA}/ca.crt")
            except Exception:
                return False
            for attempt in range(3):
                try:
                    req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
                    with urllib.request.urlopen(req, timeout=3, context=ctx) as r:
                        pod = json.load(r)
                    return not pod.get("metadata", {}).get("deletionTimestamp")
                except Exception:
                    time.sleep(1)
            return False


        # Whatever happens, end before the pod's grace period does
        signal.alarm(770)
        if sys.argv[1:] == ["signal"]:
            if pod_is_restarting_alone():
                sys.exit(0)
            open(marker, "w").close()
            # Serve on until the new pod's gateway has warmed up and waits for the lock (gateway.standby), so it
            #   takes over within a second; a stop with no successor goes on after 2 minutes
            start = time.time()
            standby = "/opt/data/hermes/gateway.standby"
            while time.time() - start < 120:
                try:
                    if os.path.getmtime(standby) >= start - 1:
                        break
                except OSError:
                    pass
                time.sleep(0.5)
            for pid in filter(str.isdigit, os.listdir("/proc")):
                try:
                    with open(f"/proc/{pid}/cmdline", "rb") as f:
                        argv = f.read().split(b"\0")
                except OSError:
                    continue
                if b"gateway" in argv and b"run" in argv and b"--external-supervisor" in argv:
                    os.kill(int(pid), signal.SIGTERM)
        deadline = time.monotonic() + 760
        failures = 0
        while time.monotonic() < deadline and failures < 3:
            try:
                urllib.request.urlopen("http://127.0.0.1:9120/api/health", timeout=2).close()
                failures = 0
            except Exception:
                failures += 1
            time.sleep(1)
