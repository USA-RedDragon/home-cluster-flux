  # The project-memory Hermes plugin; the init container installs it into /opt/data/hermes/plugins/project-memory
  project-memory:
    data:
      plugin.yaml: |
        name: project-memory
        kind: standalone
        version: 0.3.0
        description: One curated memory per project (the git repository of a chat's bound device folder), as the project_memory tool and a system prompt block next to the global memory, with routes for hermes-hub's Memory page
        author: Jacob McSwain
        requires_hermes: ">=0.22.5"
