        # Title generation runs in the background, so it goes through /low; compression holds up the turn, so it does not
        auxiliary:
          title_generation:
            provider: custom
            base_url: http://ollama-priority-proxy.ollama-priority-proxy.svc.cluster.local:11434/low/v1
            model: qwen3.5:2b
            reasoning_effort: none
            # /low waits behind people's turns on the GPU; a title can wait instead of falling back to another model
            timeout: 180
          compression:
            provider: custom
            base_url: http://ollama-priority-proxy.ollama-priority-proxy.svc.cluster.local:11434/v1
            model: qwen3.5:2b
            reasoning_effort: none
            context_length: 131072
            # Chats on Claude summarize on their own model at their 1M window's threshold (patch 0001 of
            #   hermes-patches), and so does any chat whose window is larger than this model's (DeepInfra, ChatGPT);
            #   other chats use the small local model above
            main_model_when_larger: true
            main_model_providers: [claude-pool, claude-jaam, claude-jamaag, claude-ja2000aag, claude-caam, claude-maam]
        # Sessions bound to one of her computers run commands there; every other session runs in her sandbox pod
        terminal:
          backend: device
          cwd: /opt/data/hermes/empty-cwd
          # A foreground command still running after 2 minutes moves to the background and notifies on exit
          #   (hermes-patches 0002; talaria 0.19.5 and later does the same for device commands)
          auto_background_seconds: 120
          # Background commands on her computers and in her sandbox keep running when the pod restarts; the new
          #   gateway reattaches them and still sends their notices (hermes-patches 0012). Nothing runs in this pod
          process_handoff_backends: [device]
        # Compaction keeps the newest loaded skill, up to 12,000 chars (about 3K tokens), instead of a reload marker
        #   (hermes-patches 0015). A larger skill still gets the marker
        compression:
          keep_last_skill_chars: 12000
        # The device browser and agent-messaging tools stay in the tool list instead of behind tool_search, so the
        #   model calls them directly (hermes-patches 0013). Hermes sends them only while a computer offers them
        tools:
          tool_search:
            eager: [device-browser, device-agents, project-memory]
        # image.render (TUI inline previews) reads only images Hermes stored (hermes-patches 0003)
        security:
          image_render_paths: media
        # The hermes-agent skill's index entry was the last mention of the product in the system prompt
        skills:
          disabled: [hermes-agent]
        sessions:
          # A background process that exits, or a background subagent that finishes, while nobody is viewing its
          #   chat runs as an agent turn, up to 10 in a row for both together, so the agent picks the work back
          #   up (hermes-patches 0007)
          unviewed_completion_turns: 10
          # A background subagent's result that arrives while its chat's turn is running rides that turn's next tool
          #   result instead of waiting for the turn to end (hermes-patches 0022)
          mid_turn_subagent_results: true
          # Editors (ACP session/list) also offer chats the hub, TUI and CLI started (hermes-patches 0008)
          acp_list_sources: [acp, gui, local, tui, cli]
        browser:
          chromium_args:
            - --no-sandbox
            - --disable-dev-shm-usage
        memory:
          provider: honcho
          # Hermes's defaults: its own notes (MEMORY.md, USER.md) next to Honcho, managed in the hub's Memory page
          memory_enabled: true
          user_profile_enabled: true
          nudge_interval: 10
        auth:
          adopt_external_logins: false
        updates:
          check: false
        # Cron schedules ("every monday 9am") and the agent's clock use US Central, not the pod's UTC
        timezone: America/Chicago
        # For hermes-hub. A wildcard bind is behind dashboard sign-in: the gateway's basic provider, user hub
        # Hub chats run as platform "desktop", and chats imported from Claude Code as "cli"; upstream's hint describes the Hermes desktop app (widgets, math), which the
        #   hub does not render
        platform_hints:
          desktop:
            replace: "You are chatting through Talaria: the hub web app (hub.mcswain.dev) or its Telegram bot, which show the same chats. The web app renders GitHub-flavored Markdown: headings, lists, task lists, tables, links and fenced code with syntax highlighting. It does not render math, HTML widgets or ::directives, so do not use them. Show an image with standard Markdown: ![description](/absolute/path.png). Link any other file the same way: [name](/absolute/path). The hub serves files your reply names this way. Save such files in the chat's working folder or below it, never in /tmp: the hub can only fetch files from there. Telegram shows the same reply in a narrow view, so keep tables to a few short columns."
          cli:
            replace: "You are chatting through Talaria: the hub web app (hub.mcswain.dev) or its Telegram bot, which show the same chats. The web app renders GitHub-flavored Markdown: headings, lists, task lists, tables, links and fenced code with syntax highlighting. It does not render math, HTML widgets or ::directives, so do not use them. Show an image with standard Markdown: ![description](/absolute/path.png). Link any other file the same way: [name](/absolute/path). The hub serves files your reply names this way. Save such files in the chat's working folder or below it, never in /tmp: the hub can only fetch files from there. Telegram shows the same reply in a narrow view, so keep tables to a few short columns."
        # A pod stop is a graceful restart: running turns finish (up to 9 minutes, under the hub's 10-minute prompt
        #   hold) while approvals stay answerable and new prompts wait for the new pod; then a short drain
        agent:
          restart_after_turn_timeout: 540
          restart_drain_timeout: 30
          # No paragraph pointing at the Hermes docs (hermes-patches 0017)
          product_help_guidance: false
          # No hosted connectors through Nous (manage_connections) and no installs from the online catalog (manage_catalog)
          disabled_toolsets:
            - connections
            - catalog
        plugins:
          entries:
            # Subagents (each turn) and chats (once) are told to wait with terminal(background=true) and
            #   process_manage wait, and a foreground terminal command that waits by sleeping is refused with that
            #   advice (subagent-routes waiting.py)
            subagent-routes:
              settings:
                wait_guidance: true
                sleep_guard: true
            device:
              # Lets the plugin hide Hermes's browser_vault tool
              granted_capabilities: [tools.override]
              settings:
                backend_id: kittykat
                placeholder: /opt/data/hermes/device-placeholder
                fallback: device
                fallback_device: sandbox-kittykat
                fallback_root: /work
                # How long a device keeps a command for the next gateway after a leg drops: the device's own cap
                #   (device.max-grace, 10 minutes)
                grace_seconds: 600
                # A tool call for a device that is away (a gateway handoff, a hub restart) waits up to this long for it to
                #   reconnect before it fails with "not connected" (talaria 0.25.0)
                reconnect_wait_seconds: 60
                # The one hub user of this backend: sandbox chats and scheduled jobs use this user's Firefox
                user: kittykat
            # One Claude subscription per slot; the login lives in /opt/data/hermes/claude/<id>. The pickers offer
            #   claude-pool, which runs each chat on a signed-in slot with room (the soonest weekly reset; a chat
            #   keeps its slot until that slot is at a limit). claude-<id> still serves chats that picked a slot
            #   before. Rename a slot by its label only: the id names its login directory. api_billing_day (1-28,
            #   default 1) is the day the slot's plan bills, when its API credits refresh; the hub's API credit
            #   estimate counts from it
            claude-accounts:
              settings:
                accounts:
                  - id: jaam
                    label: Claude (jaam)
                  - id: jamaag
                    label: Claude (jamaag)
                  - id: ja2000aag
                    label: Claude (ja2000aag)
                  - id: caam
                    label: Claude (caam)
                  - id: maam
                    label: Claude (maam)
        # Rolling updates (hermes-patches 0010, 0011): SIGTERM opens the restart wait, and the new pod's gateway waits
        #   for this one's lock instead of exiting
        gateway:
          sigterm_restart_wait: true
          runtime_lock_wait_seconds: 840
          # Her devices' connections (talaria) may come back during that wait, so turns still running there finish
          restart_wait_plugin_sockets: [device]
          # Idle agents release together within 5 s on the way out, instead of up to 30 s each while Honcho
          #   waits out its read-ahead for a next turn (hermes-patches 0011)
          restart_agent_cleanup_seconds: 5
          # Subagents are handed to the new pod instead (delegation.restart_handoff); set explicitly, because a key
          #   dropped from this overlay stays in config.yaml
          restart_wait_delegations: false
        webapp:
          enabled: true
          host: 0.0.0.0
          port: 9120
  config:
    data:
      # The Honcho plugin from the catalog drops a background-subagent result turn whole; this keeps the agent's reply
      #   and drops only the notice. Pinned to the installed file: any other version fails init, so refresh it then
      honcho-delegation-reply.py: |
        import hashlib
        import os
        import sys

        # The Honcho memory plugin (catalog version 1.1.0) drops every turn whose user side is a gateway
        # notice. For a background-subagent result that loses the agent's reply too: keep the reply and drop
        # only the notice. Applied to exactly the pinned file; any other file fails this step, so a plugin
        # update cannot silently lose or clobber the change.
        PATH = "/opt/data/hermes/plugins/honcho/__init__.py"
        ORIGINAL = "ccfd3bbbe3631d2418e84d13cca0fcd4fecc7f6aca988feded633e155a996614"
        PATCHED = "e94585e875785d305e0287968542d57227c232b2a4df96396d09973a37678972"
        EDITS = (
            ('_INTERNAL_GATEWAY_TURN_RE = re.compile(\n',
             '_DELEGATION_RESULT_NOTICE_RE = re.compile(\n'
             '    r"^\\s*(?:\\[ASYNC (?:DELEGATION )?(?:BATCH )?COMPLETE[^\\]]*\\]|"\n'
             '    r"A background fan-out of \\d+ subagent\\(s\\) you dispatched earlier has finished\\.|"\n'
             '    r"A background subagent you dispatched earlier has finished\\.)",\n'
             '    re.IGNORECASE,\n'
             ')\n'
             '_INTERNAL_GATEWAY_TURN_RE = re.compile(\n'),
            ('        if _is_internal_gateway_turn(user_content):\n'
             '            logger.debug("Honcho sync skipped machine-generated gateway turn")\n'
             '            return\n',
             '        if _is_internal_gateway_turn(user_content):\n'
             '            if not _DELEGATION_RESULT_NOTICE_RE.match(user_content or ""):\n'
             '                logger.debug("Honcho sync skipped machine-generated gateway turn")\n'
             '                return\n'
             '            user_content = ""\n'),
        )


        def patched(text):
            for old, new in EDITS:
                if text.count(old) != 1:
                    sys.exit(f"honcho plugin: expected one copy of {old.splitlines()[0]!r}")
                text = text.replace(old, new)
            return text


        if __name__ == "__main__":
            data = open(PATH, "rb").read()
            digest = hashlib.sha256(data).hexdigest()
            if digest == PATCHED:
                print("honcho plugin: delegation replies already kept")
            elif digest == ORIGINAL:
                new = patched(data.decode()).encode()
                if hashlib.sha256(new).hexdigest() != PATCHED:
                    sys.exit("honcho plugin: patched file does not match the pinned result")
                with open(PATH + ".new", "wb") as f:
                    f.write(new)
                os.replace(PATH + ".new", PATH)
                print("honcho plugin: now keeps the reply to a background-subagent result")
            else:
                sys.exit(f"honcho plugin: {PATH} is not the pinned 1.1.0 file ({digest}); refresh "
                         "honcho-delegation-reply.py for the new version")
      merge-managed.py: |
        import os
        from hermes_yaml import safe_dump, safe_load

        path = "/opt/data/hermes/config.yaml"
        with open("/etc/hermes-managed/config.yaml") as f:
            managed = safe_load(f) or {}
        config = {}
        if os.path.exists(path):
            with open(path) as f:
                config = safe_load(f) or {}

        def merge(base, top):
            for key, value in top.items():
                if isinstance(value, dict) and isinstance(base.get(key), dict):
                    merge(base[key], value)
                else:
                    base[key] = value

        merge(config, managed)
        if managed.get("model", {}).get("provider") == "claude-pool":
            for key in ("base_url", "context_length", "ollama_num_ctx"):
                config.get("model", {}).pop(key, None)
        with open(path + ".tmp", "w") as f:
            safe_dump(config, f, sort_keys=False)
        os.replace(path + ".tmp", path)
      # preStop of the main containers: keep the container, and so the pod's readiness, up while the gateway
      #   sidecar is in its restart wait, so the hub still reaches it to answer approvals. With "signal" (the
      #   dashboard, which has no liveness probe, so its preStop runs only on a pod stop) it first marks the pod
      #   stopping and sends the gateway SIGTERM, which opens that wait (gateway.sigterm_restart_wait)
      hermes-prestop.py: |
        import os
        import signal
        import sys
        import time
        import urllib.request

        marker = "/tmp/pod-stopping"
        if sys.argv[1:] == ["signal"]:
            open(marker, "w").close()
            # Serve on until the new pod's gateway has warmed up and waits for the lock (gateway.standby), so it
            #   takes over within a second; a stop with no successor goes on after 2 minutes
            start = time.time()
            standby = "/opt/data/hermes/gateway.standby"
            while time.time() - start < 120:
                try:
                    if os.path.getmtime(standby) >= start - 1:
                        break
                except OSError:
                    pass
                time.sleep(0.5)
            for pid in filter(str.isdigit, os.listdir("/proc")):
                try:
                    with open(f"/proc/{pid}/cmdline", "rb") as f:
                        argv = f.read().split(b"\0")
                except OSError:
                    continue
                if b"gateway" in argv and b"run" in argv and b"--external-supervisor" in argv:
                    os.kill(int(pid), signal.SIGTERM)
        # Without the marker this is a restart of this container alone (a failed liveness probe), not a pod stop
        start = time.monotonic()
        while not os.path.exists(marker):
            if time.monotonic() - start > 5:
                sys.exit(0)
            time.sleep(0.2)
        deadline = time.monotonic() + 760
        failures = 0
        while time.monotonic() < deadline and failures < 3:
            try:
                urllib.request.urlopen("http://127.0.0.1:9120/api/health", timeout=2).close()
                failures = 0
            except Exception:
                failures += 1
            time.sleep(1)
