        def sha(text):
            return hashlib.sha256(text.encode()).hexdigest()


        def apply(text, edits, name):
            for old, new in edits:
                if text.count(old) != 1:
                    sys.exit(f"honcho plugin: {name}: expected one copy of {old.splitlines()[0]!r}")
                text = text.replace(old, new)
            return text


        if __name__ == "__main__":
            for name, (start, done, edits) in FILES.items():
                path = os.path.join(DIR, name)
                text = open(path, encoding="utf-8").read()
                if sha(text) == done:
                    print(f"honcho plugin: {name} already edited")
                    continue
                if name == "__init__.py" and sha(text) == INIT_ORIGINAL:
                    text = apply(text, DELEGATION_EDITS, name)
                if sha(text) != start:
                    sys.exit(f"honcho plugin: {path} is not the pinned 1.1.0 file ({sha(text)}); refresh honcho-recall.py")
                new = apply(text, edits, name)
                if sha(new) != done:
                    sys.exit(f"honcho plugin: {name}: edited file does not match the pinned result")
                with open(path + ".new", "w", encoding="utf-8") as f:
                    f.write(new)
                os.replace(path + ".new", path)
                print(f"honcho plugin: {name} edited")
