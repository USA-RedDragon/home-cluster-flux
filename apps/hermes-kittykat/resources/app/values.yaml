                - name: kimi
                  title: Kimi K3
                  description: "Kimi K3 on DeepInfra, pay per token. Strong open model for real coding and analysis, close to Sonnet; uses no Claude account limits. Slower to start because it always thinks first."
                  provider: deepinfra
                  via: DeepInfra, pay per token
                  model: moonshotai/Kimi-K3
                  # Pinned use only: Auto never picks a pay-per-token route
