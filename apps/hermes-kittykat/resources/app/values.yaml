    size: 40Gi
    advancedMounts:
      hermes:
        init:
          - path: /opt/data
        gateway:
          - path: /opt/data
        acp-host:
          - path: /opt/data
        device-plugin:
          - path: /opt/data
        claude-download:
          - path: /opt/data
        claude-verify:
          - path: /opt/data
        plugins:
          - path: /opt/data
  managed:
    type: configMap
    identifier: managed
    advancedMounts:
      hermes:
        init:
          - &managed
            path: /etc/hermes-managed
            readOnly: true
        gateway:
          - *managed
        acp-host:
          - *managed
  config:
    type: configMap
    identifier: config
    advancedMounts:
      hermes:
        init:
          - path: /config
            readOnly: true
          - &passwd
            path: /etc/passwd
            subPath: passwd
            readOnly: true
          - &group
            path: /etc/group
            subPath: group
            readOnly: true
        claude-verify:
          - path: /config
            readOnly: true
        gateway:
          - *passwd
          - *group
        acp-host:
          - *passwd
          - *group
          - path: /etc/hermes-prestop.py
            subPath: hermes-prestop.py
            readOnly: true
  tmp:
    type: emptyDir
    advancedMounts:
      hermes:
        init:
          - path: /tmp
        gateway:
          - path: /tmp
        acp-host:
          - path: /tmp
  # The API token and CA, for acp-host only (the gateway and the init containers get none)
  kube-api:
    type: custom
    volumeSpec:
      projected:
        defaultMode: 0444
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3607
          - configMap:
              name: kube-root-ca.crt
              items:
