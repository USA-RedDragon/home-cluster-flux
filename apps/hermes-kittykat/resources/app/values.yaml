# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/values.schema.json

defaultPodOptions:
  automountServiceAccountToken: false

controllers:
  hermes:
    replicas: 1
    serviceAccount:
      identifier: hermes
    # The new pod boots next to the old one as a standby: its gateway waits for the old gateway's lock
    #   (gateway.runtime_lock_wait_seconds) and takes over within a second of its exit. Both pods mount the RWO
    #   volume on one node. maxUnavailable 0 would deadlock: the old pod only stops once the new one is ready
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: 1
    pod:
      # Waiting for the new pod's standby (up to 120 s), the restart wait for running turns
      #   (agent.restart_after_turn_timeout, 540 s), the drain (30 s), Hermes' shutdown watchdog (60 s) and a margin
      terminationGracePeriodSeconds: 780
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/controller: hermes
                  app.kubernetes.io/instance: hermes-kittykat
                  app.kubernetes.io/name: hermes-kittykat
              topologyKey: kubernetes.io/hostname
      # The image's s6 entrypoint needs root, so hermes runs as PID 1's child here; the pause container reaps zombies
      shareProcessNamespace: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    initContainers:
      # The device plugin, from the talaria image, so client, plugin and protocol share one release
      device-plugin:
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/talaria
          tag: v0.26.7@sha256:d54f0b07796a231642e7c7e41c7d7d89409571d74a785658cd76ed1a2856f693
          pullPolicy: IfNotPresent
        command: ["/talaria", "plugin", "install", "--dest", "/opt/data/hermes/plugins/device"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
      init:
        dependsOn: plugins
        image: &image
          # Hermes Agent with the patches in github.com/USA-RedDragon/talaria (hermes/); the tag before -p is the upstream release
          repository: &hermesRepository jacob.pub/ghcr.io/usa-reddragon/talaria-hermes
          tag: &hermesTag v0.23.1-p60@sha256:5e00b6431e0eff279d87836e57b867e5cb869e9a9f4733a74adc421e17a787b5
          pullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -ec
          - |
            # Hermes wants its home owned by its own uid, and the volume root is root's
            install -d -m 700 /opt/data/hermes /opt/data/hermes/workspace
            /opt/hermes/.venv/bin/python /opt/hermes/tools/skills_sync.py || echo "skills_sync failed; continuing"
            # Keep config.yaml in step with the managed overlay for clients that read it directly. Every write here
            #   replaces the file whole: on a rollout the old pod's gateway still runs on this volume
            /opt/hermes/.venv/bin/python /config/merge-managed.py
            # Memory: Honcho. The plugin and its honcho-ai dependency live on this volume (the image's venv is
            #   sealed); hermes re-execs into the environment that has it
            install -m 600 /config/honcho.json /opt/data/hermes/.honcho.json.new && mv -f /opt/data/hermes/.honcho.json.new /opt/data/hermes/honcho.json
            [ -d /opt/data/hermes/plugins/honcho ] || /opt/hermes/.venv/bin/hermes plugins install honcho --yes-deps
            /opt/hermes/.venv/bin/hermes plugins enable honcho || true
            /opt/hermes/.venv/bin/python /config/honcho-recall.py
            # Model routes for subagents (delegation.backend: model_map): subagent-routes (plugins/ in the talaria repo, installed by the plugins container)
            #   provides that backend with a per-chat choice, in place of advanced-delegation's
            /opt/hermes/.venv/bin/hermes plugins disable advanced-delegation || true
            /opt/hermes/.venv/bin/hermes plugins enable subagent-routes || true
            # Device sessions run with this server cwd; their commands run in the device directory
            install -d -m 700 /opt/data/hermes/device-placeholder
            # The server cwd of sessions that run in the sandbox; Hermes reads AGENTS.md and git state from it, so keep it empty
            install -d -m 700 /opt/data/hermes/empty-cwd
            /opt/hermes/.venv/bin/hermes plugins enable device || true
            # Claude subscriptions: Nous' plugin drives the claude CLI; claude-accounts (talaria-claude-pool, installed by the plugins container) adds
            #   one provider per account login in /opt/data/hermes/claude/<id> and the hub's sign-in and usage routes
            [ -d /opt/data/hermes/plugins/claude-subscription-directsdk-experimental ] || /opt/hermes/.venv/bin/hermes plugins install claude-subscription-directsdk --yes-deps || echo "claude-subscription-directsdk install failed; continuing"
            /opt/hermes/.venv/bin/hermes plugins enable claude-subscription-directsdk-experimental || true
            install -d -m 700 /opt/data/hermes/claude
            /opt/hermes/.venv/bin/hermes plugins enable claude-accounts || true
            # Project memory: project-memory (plugins/ in the talaria repo, installed by the plugins container) keeps one MEMORY.md per git repository of a chat's
            #   bound device folder, as the project_memory tool and a prompt block next to the global memory
            /opt/hermes/.venv/bin/hermes plugins enable project-memory || true
        env: &env
          HOME: /opt/data/hermes
          USER: hermes
          HERMES_HOME: /opt/data/hermes
          # The image the gateway runs, which the device plugin reports so that talaria chat runs the same build
          HERMES_IMAGE_REPOSITORY: *hermesRepository
          HERMES_IMAGE_TAG: *hermesTag
          # The upstream image talaria-hermes builds on, which devices can pull when they cannot pull the patched one
          HERMES_BASE_IMAGE: docker.io/nousresearch/hermes-agent:v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08
          # Commands run on her paired computers or in her sandbox pod; the devices enforce their own roots
          HERMES_WRITE_SAFE_ROOT: /opt/data/hermes:/home:/work
          HERMES_DEVICE_HUB_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAiuaEZ3j30C2FUMJrm1r10rJZyt1EwAYGKor/3LZqjSA=
            -----END PUBLIC KEY-----
          HERMES_MANAGED_DIR: /etc/hermes-managed
          # Web search goes to the in-cluster SearXNG (web.search_backend in the managed config)
          SEARXNG_URL: http://searxng.searxng.svc.cluster.local:8080
          HERMES_API_TIMEOUT: "1800"
          HONCHO_API_KEY:
            valueFrom:
              secretKeyRef:
                name: hermes-kittykat-honcho
                key: HONCHO_API_KEY
          CLAUDE_SUBSCRIPTION_DIRECTSDK_COMMAND: /opt/data/hermes/bin/claude
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 1Gi
        securityContext: &securityContext
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
      # Claude Code's native binary for the Claude subscription providers, on the volume (the image stays as
      #   published). Downloads a version that is not installed yet; claude-verify checks it. A failure here
      #   or there leaves Hermes running without the Claude subscription providers
      claude-download:
        dependsOn: device-plugin
        image: *image
        command:
          - /bin/sh
          - -c
          - |
            D=/opt/data/hermes/claude-code
            V=$CLAUDE_CODE_VERSION
            install -d -m 700 /opt/data/hermes "$D" "$D/versions" || exit 1
            [ -x "$D/versions/$V/claude" ] && exit 0
            rm -rf "$D"/staging-*
            S="$D/staging-$V"
            R="https://downloads.claude.ai/claude-code-releases/$V"
            install -d -m 700 "$S" &&
              curl -fsSL --retry 3 --connect-timeout 20 -o "$S/manifest.json" "$R/manifest.json" &&
              curl -fsSL --retry 3 --connect-timeout 20 -o "$S/manifest.json.sig" "$R/manifest.json.sig" &&
              curl -fsSL --retry 3 --connect-timeout 20 -o "$S/claude" "$R/linux-x64/claude" ||
              { echo "Claude Code $V download failed"; rm -rf "$S"; }
            exit 0
        env:
          CLAUDE_CODE_VERSION: &claudeCodeVersion "2.1.322"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi
        securityContext: *securityContext
      # Installs the download only when Anthropic's release key signed its manifest (sqv, Sequoia's verifier, is
      #   in Debian's base image) and the binary matches the manifest's checksum. It checks the installed binary
      #   again on every start
      claude-verify:
        dependsOn: claude-download
        image:
          repository: jacob.pub/docker.io/library/debian
          tag: 13.7-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
          pullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            V=$CLAUDE_CODE_VERSION
            D=/opt/data/hermes/claude-code
            check() {
              sqv --keyring /config/claude-code.asc --signature-file "$1/manifest.json.sig" "$1/manifest.json" >/dev/null &&
                grep -q "\"version\": \"$V\"" "$1/manifest.json" &&
                sum=$(sed -n '/"linux-x64": {/,/}/s/.*"checksum": "\([0-9a-f]\{64\}\)".*/\1/p' "$1/manifest.json") &&
                [ -n "$sum" ] && echo "$sum  $1/claude" | sha256sum -c --quiet
            }
            if [ ! -x "$D/versions/$V/claude" ] && [ -d "$D/staging-$V" ]; then
              if check "$D/staging-$V"; then
                chmod 755 "$D/staging-$V/claude" && mv "$D/staging-$V" "$D/versions/$V"
              else
                echo "Claude Code $V failed verification; not installed"
                rm -rf "$D/staging-$V"
              fi
            fi
            # On a rollout the old pod's gateway still runs from this volume: swap the link in one rename, and keep the
            #   version it links to until the next start
            prev=$(readlink /opt/data/hermes/bin/claude 2>/dev/null || true)
            if [ -x "$D/versions/$V/claude" ] && check "$D/versions/$V"; then
              install -d -m 700 /opt/data/hermes/bin && ln -sfn "$D/versions/$V/claude" /opt/data/hermes/bin/.claude.new &&
                mv -Tf /opt/data/hermes/bin/.claude.new /opt/data/hermes/bin/claude && echo "Claude Code $V verified"
            else
              if [ -x "$D/versions/$V/claude" ]; then
                echo "Installed Claude Code $V failed verification; removed"
                rm -rf "$D/versions/$V"
              fi
              rm -f /opt/data/hermes/bin/claude
            fi
            for old in "$D"/versions/*; do
              case "$old" in "$D/versions/$V" | "${prev%/claude}") ;; *) rm -rf "$old" ;; esac
            done
            exit 0
        env:
          CLAUDE_CODE_VERSION: *claudeCodeVersion
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        securityContext: *securityContext
      # Installs the Claude account pool (talaria-claude-pool, private) and the subagent-routes and project-memory
      #   plugins (plugins/ in the talaria repo) into the volume on every start, each only when its content changed. The init
      #   container below enables them. Not part of the Hermes image, so the image keeps its own releases
      plugins:
        dependsOn: claude-verify
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/talaria-private-plugins
          tag: v0.2.13-tp0.1.5@sha256:af2b5910ea1ee5fec968f0a10afd588e7d9b9dac62b6a1100dfc79d4a15d81cb
          pullPolicy: IfNotPresent
        command: [/usr/local/bin/talaria-install-plugins, /opt/data/hermes/plugins]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        securityContext: *securityContext
      # One gateway per home, as a native sidecar
      gateway:
        dependsOn: init
        restartPolicy: Always
        image: *image
        # Once the pod is stopping (the acp-host container's preStop marks it), a gateway that exited is not started
        #   again: it would contend with the new pod's gateway for the lock
        command:
          - /bin/sh
          - -c
          - |
            [ -e /tmp/pod-stopping ] && exec sleep infinity
            exec /opt/hermes/.venv/bin/hermes gateway run --no-supervise --external-supervisor
        workingDir: /opt/data/hermes
        env:
          <<: *env
          API_SERVER_HOST: 0.0.0.0
          API_SERVER_PORT: "8642"
          API_SERVER_KEY:
            valueFrom:
              secretKeyRef:
                name: hermes-kittykat-api
                key: API_SERVER_KEY
        # The gateway serves the Webapp listener (webapp: in the managed config) that talaria-hub signs in to
        envFrom:
          - secretRef:
              name: hermes-kittykat-hub-auth
          # DEEPINFRA_API_KEY for the deepinfra provider
          - secretRef:
              name: hermes-kittykat-deepinfra
              optional: true
        # The takeover boot is CPU-bound (about 0.25 CPU-seconds); at 50m on a busy node it took 3 s
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            memory: 8Gi
        probes:
          # A warmed-up standby (gateway.standby on the volume, touched within 10 s and naming this pod) counts as
          #   started and alive, so the other containers
          #   start while it waits for the old pod's gateway and only this gateway's readiness gates the takeover
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command: &gatewayProbe
                  - /bin/sh
                  - -c
                  - |-
                    f=/opt/data/hermes/gateway.standby; { find "$f" -newermt '-10 seconds' 2>/dev/null | grep -q . && grep -qF "\"hostname\": \"$(cat /etc/hostname)\"" "$f"; } || curl -fsS -m 5 -o /dev/null http://127.0.0.1:8642/health
              periodSeconds: 1
              timeoutSeconds: 6
              failureThreshold: 960
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command: *gatewayProbe
              periodSeconds: 30
              timeoutSeconds: 11
              failureThreshold: 5
          # The Webapp listener answers only while this gateway owns the volume: 200 when serving and in the
          #   restart wait (approvals stay answerable there), 503 while starting or stopping. The hub uses it.
          #   A starting gateway holds the probe until READY (listener_start_hold_seconds), hence the timeout
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 9120
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2
        securityContext: *securityContext
    containers:
      # Hosts one hermes acp per editor connection that the hub forwards. Its own container, so editor sessions
      #   outlive gateway restarts; the binary comes from the talaria image, mounted read-only
      acp-host:
        image: *image
        command: ["/opt/talaria/talaria", "acp-host"]
        workingDir: /opt/data/hermes
        env:
          <<: *env
          TMPDIR: /tmp
          # Its own pod, for the preStop's check of metadata.deletionTimestamp
          POD_NAME:
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          POD_NAMESPACE:
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          TALARIA_ACP_HOST_LISTEN: ":9130"
          TALARIA_ACP_HOST_BACKEND_ID: kittykat
          TALARIA_ACP_HOST_PLACEHOLDER: /opt/data/hermes/device-placeholder
          TALARIA_ACP_HOST_HERMES: /opt/hermes/.venv/bin/hermes
          TALARIA_ACP_HOST_HUB_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAiuaEZ3j30C2FUMJrm1r10rJZyt1EwAYGKor/3LZqjSA=
            -----END PUBLIC KEY-----
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 4Gi
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 9130
              periodSeconds: 1
              timeoutSeconds: 2
              failureThreshold: 2
          # A hung acp-host is restarted alone: the preStop below sees the pod is not being deleted and leaves the
          #   gateway running. 3 failures 20 s apart (60 s) ride out a busy moment. The probe's own grace period is
          #   short because a stopped (SIGSTOP) or hung process never acts on SIGTERM, and the pod's 780 s would
          #   hold the restart that long
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 9130
              periodSeconds: 20
              timeoutSeconds: 5
              failureThreshold: 3
              terminationGracePeriodSeconds: 30
        # A pod stop restarts the gateway gracefully: SIGTERM with gateway.sigterm_restart_wait opens the restart
        #   wait, where running turns finish and approvals stay answerable. This container stays up (and the pod
        #   ready) until it ends; only then does the kubelet stop the gateway sidecar. The hook checks with the API that
        #   the pod is being deleted, so a liveness restart of this container leaves the gateway alone
        lifecycle:
          preStop:
            exec:
              command: ["/opt/hermes/.venv/bin/python", "-I", "/etc/hermes-prestop.py", "signal"]
        securityContext: *securityContext

serviceAccount:
  hermes: {}

# Only acp-host gets the token (the projected volume below; the pod itself automounts none), to read its own pod in
#   the preStop. Pod names change with every rollout, so resourceNames cannot pin it; get on pods in this
#   namespace, which holds only this app's pods, is the narrowest rule that works
rbac:
  roles:
    hermes:
      type: Role
      rules:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get"]
  bindings:
    hermes:
      type: RoleBinding
      roleRef:
        identifier: hermes
      subjects:
        - identifier: hermes

# No ingress or route: talaria-hub, her front end, will reach this Service in-cluster
service:
  hermes:
    controller: hermes
    ports:
      api:
        port: 8642
      webapp:
        port: 9120
      acp:
        port: 9130

configMaps:
  managed:
    data:
      # Pinned on top of /opt/data/hermes/config.yaml, and merged into it at start; other settings
      #   persist on the PVC
      config.yaml: |
        # New chats start on Sonnet 5.5 with its 1M window, through the Claude account pool
        model:
          default: claude-sonnet-5-5[1m]
          provider: claude-pool
        # The Nous provider would use the pod's default Claude login; claude-accounts offers the pool (claude-pool)
        #   instead of one provider per account (claude-<id>, one line per slot in plugins.entries below). anthropic
        #   has no ANTHROPIC_API_KEY here, so it stays out of the pickers
        model_catalog:
          excluded_providers:
            - claude-subscription-directsdk-experimental
            - anthropic
            - claude-jaam
            - claude-jamaag
            - claude-ja2000aag
            - claude-caam
            - claude-maam
        providers:
          # Open-weight models on DeepInfra, pay per token (hermes-kittykat-deepinfra)
          deepinfra:
            name: DeepInfra
            base_url: https://api.deepinfra.com/v1/openai
            key_env: DEEPINFRA_API_KEY
            api_mode: chat_completions
            discover_models: false
            models: [moonshotai/Kimi-K3.1-Pro, moonshotai/Kimi-K3, deepseek-ai/DeepSeek-V4.1-Flash-1017]
        # Hermes detects Ollama and asks it for num_ctx, capped at this window for every model on this route
        #   (subagents too; another num_ctx reloads the model). Not model.ollama_num_ctx: that one also capped a
        #   chat switched to Claude at 131072
        custom_providers:
          - name: local-ollama
            base_url: http://ollama-priority-proxy.ollama-priority-proxy.svc.cluster.local:11434/v1
            context_length: 131072
        # Subagent routes. Each chat's Subagents setting in the hub (subagent-routes) decides which of them its subagents
        #   use: Auto lets the agent pick per subagent by these descriptions, a route pins every subagent to it, "<route>
        #   when stuck" (helper: true) keeps subagents on the chat's own model with one helper at a time on that route,
        #   and No subagents refuses them. A subagent with no route runs on the chat's own model. Claude routes go
        #   through claude-pool, which gives each subagent session an account by the soonest-reset rule; the
        #   claude-api-* providers are never routes. qwen3.5:2b fits in VRAM next to the main model (qwen3.5:4b does not)
        delegation:
          backend: model_map
          # A subagent started as an orchestrator may run its own helpers, one level down
          max_spawn_depth: 2
          # Room for a whole fix-test-release task; the default 250 cut off long tasks before they released
          max_iterations: 400
          # Each chat runs up to 10 background subagents (the default); more wait in a queue and start when one of
          #   that chat's slots frees, never inside the turn (talaria-hermes 0064)
          # A pod restart hands running background subagents to the new pod, which resumes them from their stored
          #   transcripts under the same delegation, so a rollout never loses one (talaria-hermes 0016)
          restart_handoff: true
          # A subagent is stopped at a clean point as soon as the restart wait ends; a command it runs then moves to
          #   the background at once and the new pod hands the real result back (measured on upstairs-pc and the
          #   sandbox). Waiting 5 s first only made every stop with a running subagent 5 s longer
          restart_handoff_grace_seconds: 0
          # A background subagent on a provider that queues the request or answers 429 fails after one stale window
          #   (no first chunk in 180 s) or at once, instead of 15+ minutes of retries (talaria-hermes 0023)
          stream_stale_giveup: 1
          auto_recovery_cycles: 0
          # Background processes a subagent leaves running move to its parent instead of dying with it, also when it is
          #   stopped for a restart handoff (talaria-hermes 0027)
          keep_child_processes: true
          # Each task of a delegate_task call returns as soon as it finishes instead of when the whole call does
          #   (upstream's delegation.independent_completions; ungrouped tasks complete one by one, tasks sharing a group together)
          independent_completions: true
          # A subagent that has agent_send is told it can answer its parent mid-run with agent_send(to="parent", ...),
          #   in its system prompt and in each delegate_task steer (talaria-hermes 0042)
          parent_reply_guidance: true
          backends:
            model_map:
              guidance:
                picker: "local and Haiku for volume, Sonnet for normal work, Opus or Fable only for hard judgment or after a cheaper route failed"
                note: "local routes or haiku for volume work, sonnet for normal work, opus or fable only for hard judgment or after a cheaper route failed"
                description: "Prefer the local routes or haiku for volume work, sonnet for normal work, and opus or fable only for hard judgment or after a cheaper route failed."
              options:
                - name: quick
                  title: Local small (qwen3.5:2b)
                  description: "Small fast local model. Only for simple, single-step work: look up a fact, read or list a few files, summarize given text, a short mechanical edit. Not for debugging, planning, multi-step changes or anything that needs judgment."
                  base_url: http://ollama-priority-proxy.ollama-priority-proxy.svc.cluster.local:11434/v1
                  model: qwen3.5:2b
                  line: "Every subagent runs on qwen3.5:2b on the local GPU."
                  emphasis: "qwen3.5:2b"
                  reasoning_effort: none
                - name: local
                  title: Local (qwen3.8:27b)
                  description: "The local 27B model on the home GPU. Free and private, slower than Claude. Routine multi-step work with clear instructions: searches across files, gathering facts, drafting, simple code changes."
                  base_url: http://ollama-priority-proxy.ollama-priority-proxy.svc.cluster.local:11434/v1
                  model: qwen3.8:27b
                  line: "Every subagent runs on qwen3.8:27b on the local GPU."
                  emphasis: "qwen3.8:27b"
                - name: haiku
                  title: Haiku 5.5
                  description: "Claude Haiku 5.5. Fast and the cheapest Claude route. Volume work and many parallel tasks: searches, reading and summarizing files, data gathering, simple code changes and checks."
                  provider: claude-pool
                  via: the Claude account pool
                  model: claude-haiku-5-5
                - name: flash
                  title: DeepSeek V4.1 Flash
                  description: "DeepSeek V4.1 Flash on DeepInfra, pay per token and very cheap. Volume work when the Claude accounts are low: searches, reading and summarizing files, data gathering, simple code changes. Weaker than Sonnet on hard agentic work."
                  provider: deepinfra
                  via: DeepInfra, pay per token
                  model: deepseek-ai/DeepSeek-V4.1-Flash-1017
                  # Pinned use only: Auto never picks a pay-per-token route
                  auto: false
                # Kimi K3, not K3.1 Pro: DeepInfra answers K3.1 Pro with 429 engine_overloaded since it launched (Nov 11)
                - name: kimi
                  title: Kimi K3
                  description: "Kimi K3 on DeepInfra, pay per token. Strong open model for real coding and analysis, close to Sonnet; uses no Claude account limits. Slower to start because it always thinks first."
                  provider: deepinfra
                  via: DeepInfra, pay per token
                  model: moonshotai/Kimi-K3
                  # Pinned use only: Auto never picks a pay-per-token route
                  auto: false
                - name: sonnet
                  title: Sonnet 5.5
                  description: "Claude Sonnet 5.5. Normal coding and analysis: multi-step changes, debugging with clear evidence, reviews, writing tests. The default choice for real work that is not trivial."
                  provider: claude-pool
                  via: the Claude account pool
                  model: claude-sonnet-5-5
                - name: opus
                  title: Opus 5.5
                  description: "Claude Opus 5.5. Hard judgment only: subtle bugs, design decisions, careful reviews of risky changes, or a task a cheaper route already failed. Uses the most of the accounts' limits."
                  provider: claude-pool
                  via: the Claude account pool
                  model: claude-opus-5-5
                  helper: true
                - name: fable
                  title: Fable 5.2
                  description: "Claude Fable 5.2. Hard judgment only, like opus: a second strong model for the hardest problems, or when opus is stuck. Uses much of the accounts' limits."
                  provider: claude-pool
                  via: the Claude account pool
                  model: claude-fable-5-2
                  helper: true
        # Title generation runs in the background, so it goes through /low; compression holds up the turn, so it does not
        auxiliary:
          # The background skill and memory reviewer is off, per Jacob's skill policy
          background_review:
            enabled: false
          title_generation:
            provider: custom
            base_url: http://ollama-priority-proxy.ollama-priority-proxy.svc.cluster.local:11434/low/v1
            model: qwen3.5:2b
            reasoning_effort: none
            # /low waits behind people's turns on the GPU; a title can wait instead of falling back to another model
            timeout: 180
          compression:
            provider: custom
            base_url: http://ollama-priority-proxy.ollama-priority-proxy.svc.cluster.local:11434/v1
            model: qwen3.5:2b
            reasoning_effort: none
            context_length: 131072
            # Chats on Claude summarize on their own model at their 1M window's threshold (patch 0001 of
            #   talaria-hermes), and so does any chat whose window is larger than this model's (DeepInfra, ChatGPT);
            #   other chats use the small local model above
            main_model_when_larger: true
            main_model_providers: [claude-pool, claude-jaam, claude-jamaag, claude-ja2000aag, claude-caam, claude-maam]
        # Sessions bound to one of her computers run commands there; every other session runs in her sandbox pod
        terminal:
          backend: device
          cwd: /opt/data/hermes/empty-cwd
          # A foreground command still running after 2 minutes moves to the background and notifies on exit
          #   (talaria-hermes 0002; talaria 0.19.5 and later does the same for device commands)
          auto_background_seconds: 120
          # Background commands on her computers and in her sandbox keep running when the pod restarts; the new
          #   gateway reattaches them and still sends their notices (talaria-hermes 0012). Nothing runs in this pod
          process_handoff_backends: [device]
        # Compaction keeps the newest loaded skill, up to 12,000 chars (about 3K tokens), instead of a reload marker
        #   (talaria-hermes 0015). A larger skill still gets the marker
        # Older agent messages drop their repeated instructions paragraph (talaria-hermes 0070)
        context:
          collapse_agent_messages: true
        compression:
          # Compaction writes a short structured summary and keeps a decision ledger of the user's approvals and
          #   choices, which rides every handoff (talaria-hermes 0078, 0079)
          summary_style: compact
          decision_ledger_chars: 6000
          keep_last_skill_chars: 20000
          # Old tool output is pruned once the context passes 100K tokens, keeping the last skill (talaria-hermes 0071)
          proactive_prune_tokens: 100000
          # Compact at 80% of the window (upstream default is 50% for windows of 512K and up)
          threshold: 0.80
        # The device browser and agent-messaging tools stay in the tool list instead of behind tool_search, so the
        #   model calls them directly (talaria-hermes 0013). Hermes sends them only while a computer offers them
        tools:
          tool_search:
            eager: [device-browser, device-agents, project-memory]
        # image.render (TUI inline previews) reads only images Hermes stored (talaria-hermes 0003)
        security:
          image_render_paths: media
        # The hermes-agent skill's index entry was the last mention of the product in the system prompt
        skills:
          # A new skill that overlaps an existing one must say why it is new (talaria-hermes 0076)
          create_overlap_threshold: 0.35
          disabled: [hermes-agent]
        sessions:
          # A background process that exits, or a background subagent that finishes, while nobody is viewing its
          #   chat runs as an agent turn, up to 10 in a row for both together, so the agent picks the work back
          #   up (talaria-hermes 0007)
          unviewed_completion_turns: 10
          # A background subagent's result that arrives while its chat's turn is running rides that turn's next tool
          #   result instead of waiting for the turn to end (talaria-hermes 0022)
          mid_turn_subagent_results: true
          # A newer model pick settles the one still stored for its chat: one that is asked replaces it, one that is
          #   refused clears it, and the confirmation of a replaced pick is refused (talaria-hermes 0045)
          newest_pick_supersedes: true
          # A turn lease this gateway wrote but no turn of it still holds (its release write failed) is reclaimed
          #   at once, so picks on an idle chat are not deferred for up to 300 s (talaria-hermes 0046)
          reclaim_orphaned_turn_leases: true
          # Editors (ACP session/list) also offer chats the hub, TUI and CLI started (talaria-hermes 0008)
          acp_list_sources: [acp, gui, local, tui, cli]
        web:
          search_backend: searxng
        browser:
          chromium_args:
            - --no-sandbox
            - --disable-dev-shm-usage
        memory:
          provider: honcho
          # Honcho's recalled context leaves older turns once the prompt cache is cold (an hour idle) or at compaction,
          #   and is cut by section to 8000 characters (talaria-hermes 0069, 0075)
          recall_history: false
          recall_max_chars: 8000
          recall_cold_after_seconds: 3600
          # Hermes's defaults: its own notes (MEMORY.md, USER.md) next to Honcho, managed in the hub's Memory page
          memory_enabled: true
          user_profile_enabled: true
          nudge_interval: 10
        auth:
          adopt_external_logins: false
        updates:
          check: false
        # Cron schedules ("every monday 9am") and the agent's clock use US Central, not the pod's UTC
        timezone: America/Chicago
        # For talaria-hub
        # Hub chats run as platform "desktop", and chats imported from Claude Code as "cli"; upstream's hint describes the Hermes desktop app (widgets, math), which the
        #   hub does not render
        platform_hints:
          desktop:
            replace: "You are chatting through Talaria: the hub web app (hub.mcswain.dev) or its Telegram bot, which show the same chats. The web app renders GitHub-flavored Markdown: headings, lists, task lists, tables, links and fenced code with syntax highlighting. It does not render math, HTML widgets or ::directives, so do not use them. Show an image with standard Markdown: ![description](/absolute/path.png). Link any other file the same way: [name](/absolute/path). The hub serves files your reply names this way. Save such files in the chat's working folder or below it, never in /tmp: the hub can only fetch files from there. Telegram shows the same reply in a narrow view, so keep tables to a few short columns."
          cli:
            replace: "You are chatting through Talaria: the hub web app (hub.mcswain.dev) or its Telegram bot, which show the same chats. The web app renders GitHub-flavored Markdown: headings, lists, task lists, tables, links and fenced code with syntax highlighting. It does not render math, HTML widgets or ::directives, so do not use them. Show an image with standard Markdown: ![description](/absolute/path.png). Link any other file the same way: [name](/absolute/path). The hub serves files your reply names this way. Save such files in the chat's working folder or below it, never in /tmp: the hub can only fetch files from there. Telegram shows the same reply in a narrow view, so keep tables to a few short columns."
        # A pod stop is a graceful restart. With gateway.restart_turn_handoff running turns go to the new pod at
        #   once; without it they finish first (up to 9 minutes, under the hub's 10-minute prompt hold) while
        #   approvals stay answerable and new prompts wait for the new pod; then a short drain
        # Settings Flux pins here show read-only in the hub; writes to them are refused (talaria-hermes 0062)
        # Screenshots keep small text readable: up to 2000 px and 512 KB, scaled to fit instead of halved (talaria-hermes 0061)
        vision:
          embed_max_dimension: 2000
          embed_target_bytes: 524288
          resize_mode: fit
        dashboard:
          managed_read_only: true
        # An approval, a subagent's included, waits 30 minutes before it fails closed: the 300-second default ended
        #   a prompt before anyone saw its card (talaria-hermes 0080 shows a subagent's in its parent chat)
        approvals:
          # Smart approval also blocks a step that a file, page, tool output or subagent claims the user approved
          #   (talaria-hermes 0077)
          smart_provenance: true
          timeout: 1800
          # Smart approval: Sonnet for both stages through the Claude pool (Haiku as stage 1 let repo changes through)
          smart_fast_model:
            provider: claude-pool
            model: claude-sonnet-5-5
          smart_model:
            provider: claude-pool
            model: claude-sonnet-5-5
        agent:
          restart_after_turn_timeout: 540
          # One warning at 80% of the step budget so a subagent wraps up and reports instead of being cut off
          budget_warning_ratio: 0.8
          # A question to the user waits 30 minutes; the 90-second default timed out before anyone saw it
          clarify_timeout: 1800
          restart_drain_timeout: 30
          # No paragraph pointing at the Hermes docs (talaria-hermes 0017)
          product_help_guidance: false
          # No hosted connectors through Nous (manage_connections) and no installs from the online catalog (manage_catalog)
          disabled_toolsets:
            - connections
            - catalog
        plugins:
          entries:
            # Subagents (each turn) and chats (once) are told to wait with terminal(background=true) and
            #   process_manage wait, and a foreground terminal command that waits by sleeping is refused with that
            #   advice (subagent-routes waiting.py)
            subagent-routes:
              settings:
                wait_guidance: true
                sleep_guard: true
            device:
              # Lets the plugin hide Hermes's browser_vault tool
              granted_capabilities: [tools.override]
              settings:
                backend_id: kittykat
                placeholder: /opt/data/hermes/device-placeholder
                fallback: device
                fallback_device: sandbox-kittykat
                fallback_root: /work
                # How long a device keeps a command for the next gateway after a leg drops: the device's own cap
                #   (device.max-grace, 10 minutes)
                grace_seconds: 600
                # A tool call for a device that is away (a gateway handoff, a hub restart) waits up to this long for it to
                #   reconnect before it fails with "not connected" (talaria 0.25.0)
                reconnect_wait_seconds: 60
                # The one hub user of this backend: sandbox chats and scheduled jobs use this user's Firefox
                user: kittykat
            # One Claude subscription per slot; the login lives in /opt/data/hermes/claude/<id>. The pickers offer
            #   claude-pool, which runs each chat on a signed-in slot with room (the soonest weekly reset; a chat
            #   keeps its slot until that slot is at a limit). claude-<id> still serves chats that picked a slot
            #   before. Rename a slot by its label only: the id names its login directory. api_billing_day (1-28,
            #   default 1) is the day the slot's plan bills, when its API credits refresh; the hub's API credit
            #   estimate counts from it
            claude-accounts:
              settings:
                accounts:
                  - id: jaam
                    label: Claude (jaam)
                  - id: jamaag
                    label: Claude (jamaag)
                  - id: ja2000aag
                    label: Claude (ja2000aag)
                  - id: caam
                    label: Claude (caam)
                  - id: maam
                    label: Claude (maam)
        # Rolling updates (talaria-hermes 0010, 0011): SIGTERM opens the restart wait, and the new pod's gateway waits
        #   for this one's lock instead of exiting
        gateway:
          # The replay ring keeps a whole turn (bounded by its 4 MiB byte cap), so a hub that re-attaches mid-reply
          #   replays it instead of getting snapshot_required and showing the reply split (talaria-hermes 0056)
          replay_buffer_events: 0
          sigterm_restart_wait: true
          runtime_lock_wait_seconds: 840
          # Her devices' connections (talaria) may come back during that wait, so turns still running there finish
          restart_wait_plugin_sockets: [device]
          # Idle agents release together within 5 s on the way out, instead of up to 30 s each while Honcho
          #   waits out its read-ahead for a next turn (talaria-hermes 0011)
          restart_agent_cleanup_seconds: 5
          # Subagents are handed to the new pod instead (delegation.restart_handoff); set explicitly, because a key
          #   dropped from this overlay stays in config.yaml
          restart_wait_delegations: false
          # The old gateway's Webapp listener stays up through its stop until it releases the profile lock, so the new
          #   pod's standby takes over with well under 2 s without a gateway (talaria-hermes 0031)
          restart_listener_handover: true
          # After it released the lock, that listener stays open and relays each connection to the new pod's
          #   gateway, retrying until it listens, which holds it until READY: clients wait instead of being
          #   refused, and this pod stays serving until the new one is ready (talaria-hermes 0035, 0036)
          restart_listener_relay_seconds: 30
          listener_start_hold_seconds: 20
          # From the stop signal to the release, what this gateway would refuse (writes, sign-in and new
          #   sockets once the restart wait ends) waits instead and is forwarded to the new pod's gateway once it
          #   took over; GET reads are served during the restart wait, and the hub's sockets stay open through
          #   it (talaria-hermes 0037)
          restart_listener_hold_seconds: 90
          # Requests still running when the stop seals the listener get 0.5 s, and so do the ones cancelled then:
          #   the hub's device-bus long poll (up to 25 s in a worker thread) held every idle stop 15 to 23 s
          #   (talaria-hermes 0041)
          restart_reads_grace_seconds: 0.5
          # The socket tickets this gateway minted still open sockets on the new pod's gateway (talaria-hermes 0039)
          restart_ticket_handover: true
          # A socket still relayed when the relay window ends gets close 1012, which the hub reconnects from at
          #   once, instead of a cut connection (talaria-hermes 0040)
          restart_listener_relay_close_sockets: true
          # The hub's sockets kept through the restart wait end their sessions at the stop but get their close
          #   frame only 1 s after the new pod's gateway answers ready, so the hub reconnects once, straight to the
          #   new pod, instead of once at the stop and again when the relay ends (talaria-hermes 0043)
          restart_socket_close_delay_seconds: 1
          # Idle chats' memory providers (Honcho) shut down after the release, once their writes were flushed, and
          #   this pod waits up to 30 s for them before it exits: a Honcho read-ahead held every busy stop 7 s
          #   (talaria-hermes 0044)
          restart_memory_shutdown_after_release_seconds: 30
          # The hub's read-only socket calls (Activity panel lists, transcript, settings, command menu) are answered
          #   during the restart wait instead of runtime_draining (talaria-hermes 0047)
          restart_wait_ws_reads: true
          # A pod stop hands running turns to the new pod instead of waiting for them: each is stopped like a Stop,
          #   and the new pod's gateway queues a turn that continues it, so other chats' new prompts run within
          #   seconds of the takeover instead of after the longest turn (talaria-hermes 0048)
          restart_turn_handoff: true
          restart_turn_handoff_wait_seconds: 0
          # No stop trace (talaria-hermes 0038); set explicitly, because a key dropped from this overlay stays in
          #   config.yaml
          stop_trace: false
        webapp:
          enabled: true
          host: 0.0.0.0
          port: 9120
