# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/values.schema.json

defaultPodOptions:
  automountServiceAccountToken: false

controllers:
  hermes:
    replicas: 1
    # The new pod boots next to the old one as a standby: its gateway waits for the old gateway's lock
    #   (gateway.runtime_lock_wait_seconds) and takes over within a second of its exit. Both pods mount the RWO
    #   volume on one node. maxUnavailable 0 would deadlock: the old pod only stops once the new one is ready
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: 1
    pod:
      # Restart wait for running turns (agent.restart_after_turn_timeout, 540 s), the drain (30 s), Hermes'
      #   shutdown watchdog (60 s) and a margin
      terminationGracePeriodSeconds: 720
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/controller: hermes
                  app.kubernetes.io/instance: hermes-kittykat
                  app.kubernetes.io/name: hermes-kittykat
              topologyKey: kubernetes.io/hostname
      # The image's s6 entrypoint needs root, so hermes runs as PID 1's child here; the pause container reaps zombies
      shareProcessNamespace: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    initContainers:
      # The device plugin, from the hermes-device image, so client, plugin and protocol share one release
      device-plugin:
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/hermes-device
          tag: v0.22.0@sha256:04bf96cd39c8c03ec99b051aa44cbc6c58a61e147bd542dc223daf5316d07030
          pullPolicy: IfNotPresent
        command: ["/hermes-device", "plugin", "install", "--dest", "/opt/data/hermes/plugins/device"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
      init:
        dependsOn: device-plugin
        image: &image
          # Hermes Agent with the patches in github.com/USA-RedDragon/hermes-patches; the tag before -p is the upstream release
          repository: &hermesRepository jacob.pub/ghcr.io/usa-reddragon/hermes-patches
          tag: &hermesTag v0.23.1-p6@sha256:8e117755367e24daf861e08850340638d07916033bee24c41395a71422b39313
          pullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -ec
          - |
            # Hermes wants its home owned by its own uid, and the volume root is root's
            install -d -m 700 /opt/data/hermes /opt/data/hermes/workspace
            /opt/hermes/.venv/bin/python /opt/hermes/tools/skills_sync.py || echo "skills_sync failed; continuing"
            # Keep config.yaml in step with the managed overlay for clients that read it directly. Every write here
            #   replaces the file whole: on a rollout the old pod's gateway still runs on this volume
            /opt/hermes/.venv/bin/python /config/merge-managed.py
            # Memory: Honcho. The plugin and its honcho-ai dependency live on this volume (the image's venv is
            #   sealed); hermes re-execs into the environment that has it
            install -m 600 /config/honcho.json /opt/data/hermes/.honcho.json.new && mv -f /opt/data/hermes/.honcho.json.new /opt/data/hermes/honcho.json
            [ -d /opt/data/hermes/plugins/honcho ] || /opt/hermes/.venv/bin/hermes plugins install honcho --yes-deps
            /opt/hermes/.venv/bin/hermes plugins enable honcho || true
            # Model routes for subagents (delegation.backend: model_map)
            [ -d /opt/data/hermes/plugins/advanced-delegation ] || /opt/hermes/.venv/bin/hermes plugins install advanced-delegation --yes-deps || echo "advanced-delegation install failed; continuing"
            /opt/hermes/.venv/bin/hermes plugins enable advanced-delegation || true
            # Device sessions run with this server cwd; their commands run in the device directory
            install -d -m 700 /opt/data/hermes/device-placeholder
            # The server cwd of sessions that run in the sandbox; Hermes reads AGENTS.md and git state from it, so keep it empty
            install -d -m 700 /opt/data/hermes/empty-cwd
            /opt/hermes/.venv/bin/hermes plugins enable device || true
        env: &env
          HOME: /opt/data/hermes
          USER: hermes
          HERMES_HOME: /opt/data/hermes
          # The image the gateway runs, which the device plugin reports so that talaria chat runs the same build
          HERMES_IMAGE_REPOSITORY: *hermesRepository
          HERMES_IMAGE_TAG: *hermesTag
          # The upstream image hermes-patches builds on, which devices can pull when they cannot pull the patched one
          HERMES_BASE_IMAGE: docker.io/nousresearch/hermes-agent:v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08
          # Commands run on her paired computers or in her sandbox pod; the devices enforce their own roots
          HERMES_WRITE_SAFE_ROOT: /opt/data/hermes:/home:/work
          HERMES_DEVICE_HUB_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAiuaEZ3j30C2FUMJrm1r10rJZyt1EwAYGKor/3LZqjSA=
            -----END PUBLIC KEY-----
          HERMES_MANAGED_DIR: /etc/hermes-managed
          HERMES_API_TIMEOUT: "1800"
          HONCHO_API_KEY:
            valueFrom:
              secretKeyRef:
                name: hermes-kittykat-honcho
                key: HONCHO_API_KEY
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 1Gi
        securityContext: &securityContext
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
      # One gateway per home. As a native sidecar it takes the lock before the dashboard starts, so the dashboard
      #   attaches to it instead of spawning its own
      gateway:
        dependsOn: init
        restartPolicy: Always
        image: *image
        # Once the pod is stopping (the hermes container's preStop marks it), a gateway that exited is not started
        #   again: it would contend with the new pod's gateway for the lock
        command:
          - /bin/sh
          - -c
          - |
            [ -e /tmp/pod-stopping ] && exec sleep infinity
            exec /opt/hermes/.venv/bin/hermes gateway run --no-supervise --external-supervisor
        workingDir: /opt/data/hermes
        env:
          <<: *env
          API_SERVER_HOST: 0.0.0.0
          API_SERVER_PORT: "8642"
          API_SERVER_KEY:
            valueFrom:
              secretKeyRef:
                name: hermes-kittykat-api
                key: API_SERVER_KEY
        # The gateway serves the Webapp listener (webapp: in the managed config) that hermes-hub signs in to; the
        #   dashboard container never gets this provider, so its loopback listener stays open behind the proxy
        envFrom:
          - secretRef:
              name: hermes-kittykat-hub-auth
        resources:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            memory: 8Gi
        probes:
          # A standby waits up to gateway.runtime_lock_wait_seconds (720 s) for the old pod's gateway, then boots
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8642
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 900
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8642
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
          # The Webapp listener answers only while this gateway owns the volume: 200 when serving and in the
          #   restart wait (approvals stay answerable there), 503 while starting or stopping. The hub uses it
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 9120
              periodSeconds: 1
              timeoutSeconds: 2
              failureThreshold: 2
        securityContext: *securityContext
    containers:
      # Hosts one hermes acp per editor connection that the hub forwards. Its own container, so editor sessions
      #   outlive gateway restarts; the binary comes from the hermes-device image, mounted read-only
      acp-host:
        image: *image
        command: ["/opt/hermes-device/hermes-device", "acp-host"]
        workingDir: /opt/data/hermes
        env:
          <<: *env
          TMPDIR: /tmp
          TALARIA_ACP_HOST_LISTEN: ":9130"
          TALARIA_ACP_HOST_BACKEND_ID: kittykat
          TALARIA_ACP_HOST_PLACEHOLDER: /opt/data/hermes/device-placeholder
          TALARIA_ACP_HOST_HERMES: /opt/hermes/.venv/bin/hermes
          TALARIA_ACP_HOST_HUB_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAiuaEZ3j30C2FUMJrm1r10rJZyt1EwAYGKor/3LZqjSA=
            -----END PUBLIC KEY-----
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 4Gi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 9130
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 9130
              periodSeconds: 1
              timeoutSeconds: 2
              failureThreshold: 2
        # Stays up, so the pod stays ready, until the gateway leaves its restart wait
        lifecycle:
          preStop:
            exec:
              command: ["/opt/hermes/.venv/bin/python", "-I", "/etc/hermes-prestop.py"]
        securityContext: *securityContext
      hermes:
        image: *image
        command:
          - /opt/hermes/.venv/bin/hermes
          - dashboard
          - --host
          - 127.0.0.1
          - --port
          - "9119"
          - --no-open
        workingDir: /opt/data/hermes
        env: *env
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 8Gi
        # No probes: only the operator uses the dashboard, so the hub's traffic need not wait for it, and its preStop
        #   below must run only on a pod stop, never on a liveness restart
        # A pod stop restarts the gateway gracefully: SIGTERM with gateway.sigterm_restart_wait opens the restart
        #   wait, where running turns finish and approvals stay answerable. The main containers stay up (and the
        #   pod ready) until it ends; only then does the kubelet stop the gateway sidecar
        lifecycle:
          preStop:
            exec:
              command: ["/opt/hermes/.venv/bin/python", "-I", "/etc/hermes-prestop.py", "signal"]
        securityContext: *securityContext
      # The dashboard demands a login on any non-loopback bind. It stays on loopback, and this proxy presents
      #   requests as loopback ones; the network policy is the only access control, and it admits nothing yet
      proxy:
        image:
          repository: jacob.pub/docker.io/nginxinc/nginx-unprivileged
          tag: 1.31.6-alpine@sha256:b9241c6e7b8e9a862f129d8d4199ab64b10390949a78bdd5603379b32c844083
          pullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 128Mi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
              periodSeconds: 1
              failureThreshold: 2
        # Stays up, so the pod stays ready, until the gateway leaves its restart wait
        lifecycle:
          preStop:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  i=0
                  while [ ! -e /tmp/pod-stopping ]; do [ $i -ge 25 ] && exit 0; sleep 0.2; i=$((i+1)); done
                  f=0 i=0
                  while [ $i -lt 700 ] && [ $f -lt 3 ]; do
                    if wget -q -T 2 -O /dev/null http://127.0.0.1:9120/api/health; then f=0; else f=$((f+1)); fi
                    sleep 1; i=$((i+1))
                  done
        securityContext: *securityContext

# No ingress or route: hermes-hub, her front end, will reach this Service in-cluster
service:
  hermes:
    controller: hermes
    ports:
      http:
        port: 8080
      api:
        port: 8642
      webapp:
        port: 9120
      acp:
        port: 9130

configMaps:
  managed:
    data:
      # Pinned on top of /opt/data/hermes/config.yaml, and merged into it at start; other settings changed in the
      #   dashboard persist on the PVC
      config.yaml: |
        model:
          default: qwen3.8:27b
          provider: custom
          base_url: http://ollama-priority-proxy.ollama-priority-proxy.svc.cluster.local:11434/v1
          context_length: 131072
          # Every agent, subagents too, asks Ollama for the window it loads models with; another num_ctx reloads them
          ollama_num_ctx: 131072
        # Small model: qwen3.5:2b fits in VRAM next to the main model (qwen3.5:4b does not). The agent picks a route
        #   per subagent; a subagent with no route runs on the main model. To add Claude Haiku, add a route with
        #   provider: anthropic and the key; "default: <route>" sends every unrouted subagent to one route
        delegation:
          backend: model_map
          backends:
            model_map:
              options:
                - name: quick
                  description: "Small fast local model. Only for simple, single-step work: look up a fact, read or list a few files, summarize given text, a short mechanical edit. Not for debugging, planning, multi-step changes or anything that needs judgment."
                  base_url: http://ollama-priority-proxy.ollama-priority-proxy.svc.cluster.local:11434/v1
                  model: qwen3.5:2b
                  reasoning_effort: none
        # Title generation runs in the background, so it goes through /low; compression holds up the turn, so it does not
        auxiliary:
          title_generation:
            provider: custom
            base_url: http://ollama-priority-proxy.ollama-priority-proxy.svc.cluster.local:11434/low/v1
            model: qwen3.5:2b
            reasoning_effort: none
          compression:
            provider: custom
            base_url: http://ollama-priority-proxy.ollama-priority-proxy.svc.cluster.local:11434/v1
            model: qwen3.5:2b
            reasoning_effort: none
            context_length: 131072
        # Sessions bound to one of her computers run commands there; every other session runs in her sandbox pod
        terminal:
          backend: device
          cwd: /opt/data/hermes/empty-cwd
          # A foreground command still running after 2 minutes moves to the background and notifies on exit
          #   (hermes-patches 0002; talaria 0.19.5 and later does the same for device commands)
          auto_background_seconds: 120
          # Background commands on her computers and in her sandbox keep running when the pod restarts; the new
          #   gateway reattaches them and still sends their notices (hermes-patches 0012). Nothing runs in this pod
          process_handoff_backends: [device]
        # Compaction keeps the newest loaded skill, up to 12,000 chars (about 3K tokens), instead of a reload marker
        #   (hermes-patches 0015). A larger skill still gets the marker
        compression:
          keep_last_skill_chars: 12000
        # The device browser and agent-messaging tools stay in the tool list instead of behind tool_search, so the
        #   model calls them directly (hermes-patches 0013). Hermes sends them only while a computer offers them
        tools:
          tool_search:
            eager: [device-browser, device-agents]
        # image.render (TUI inline previews) reads only images Hermes stored (hermes-patches 0003)
        security:
          image_render_paths: media
        sessions:
          # A background process that exits, or a background subagent that finishes, while nobody is viewing its
          #   chat runs as an agent turn, up to 10 in a row for both together, so the agent picks the work back
          #   up (hermes-patches 0007)
          unviewed_completion_turns: 10
          # Editors (ACP session/list) also offer chats the hub, TUI and CLI started (hermes-patches 0008)
          acp_list_sources: [acp, gui, local, tui, cli]
        browser:
          chromium_args:
            - --no-sandbox
            - --disable-dev-shm-usage
        memory:
          provider: honcho
          # Hermes's defaults: its own notes (MEMORY.md, USER.md) next to Honcho, managed in the hub's Memory page
          memory_enabled: true
          user_profile_enabled: true
          nudge_interval: 10
        auth:
          adopt_external_logins: false
        updates:
          check: false
        # Cron schedules ("every monday 9am") and the agent's clock use US Central, not the pod's UTC
        timezone: America/Chicago
        # For hermes-hub. A wildcard bind is behind dashboard sign-in: the gateway's basic provider, user hub
        # A pod stop is a graceful restart: running turns finish (up to 9 minutes, under the hub's 10-minute prompt
        #   hold) while approvals stay answerable and new prompts wait for the new pod; then a short drain
        agent:
          restart_after_turn_timeout: 540
          restart_drain_timeout: 30
          # No hosted connectors through Nous (manage_connections) and no installs from the online catalog (manage_catalog)
          disabled_toolsets:
            - connections
            - catalog
        plugins:
          entries:
            device:
              # Lets the plugin hide Hermes's browser_vault tool
              granted_capabilities: [tools.override]
              settings:
                backend_id: kittykat
                placeholder: /opt/data/hermes/device-placeholder
                fallback: device
                fallback_device: sandbox-kittykat
                fallback_root: /work
                # How long a device keeps a command for the next gateway after a leg drops: the device's own cap
                #   (device.max-grace, 10 minutes)
                grace_seconds: 600
                # The one hub user of this backend: sandbox chats and scheduled jobs use this user's Firefox
                user: kittykat
        # Rolling updates (hermes-patches 0010, 0011): SIGTERM opens the restart wait, and the new pod's gateway waits
        #   for this one's lock instead of exiting
        gateway:
          sigterm_restart_wait: true
          runtime_lock_wait_seconds: 720
          # Her devices' connections (talaria) may come back during that wait, so turns still running there finish
          restart_wait_plugin_sockets: [device]
        webapp:
          enabled: true
          host: 0.0.0.0
          port: 9120
  config:
    data:
      merge-managed.py: |
        import os
        from hermes_yaml import safe_dump, safe_load

        path = "/opt/data/hermes/config.yaml"
        with open("/etc/hermes-managed/config.yaml") as f:
            managed = safe_load(f) or {}
        config = {}
        if os.path.exists(path):
            with open(path) as f:
                config = safe_load(f) or {}

        def merge(base, top):
            for key, value in top.items():
                if isinstance(value, dict) and isinstance(base.get(key), dict):
                    merge(base[key], value)
                else:
                    base[key] = value

        merge(config, managed)
        with open(path + ".tmp", "w") as f:
            safe_dump(config, f, sort_keys=False)
        os.replace(path + ".tmp", path)
      # preStop of the main containers: keep the container, and so the pod's readiness, up while the gateway
      #   sidecar is in its restart wait, so the hub still reaches it to answer approvals. With "signal" (the
      #   dashboard, which has no liveness probe, so its preStop runs only on a pod stop) it first marks the pod
      #   stopping and sends the gateway SIGTERM, which opens that wait (gateway.sigterm_restart_wait)
      hermes-prestop.py: |
        import os
        import signal
        import sys
        import time
        import urllib.request

        marker = "/tmp/pod-stopping"
        if sys.argv[1:] == ["signal"]:
            open(marker, "w").close()
            for pid in filter(str.isdigit, os.listdir("/proc")):
                try:
                    with open(f"/proc/{pid}/cmdline", "rb") as f:
                        argv = f.read().split(b"\0")
                except OSError:
                    continue
                if b"gateway" in argv and b"run" in argv and b"--external-supervisor" in argv:
                    os.kill(int(pid), signal.SIGTERM)
        # Without the marker this is a restart of this container alone (a failed liveness probe), not a pod stop
        start = time.monotonic()
        while not os.path.exists(marker):
            if time.monotonic() - start > 5:
                sys.exit(0)
            time.sleep(0.2)
        deadline = time.monotonic() + 700
        failures = 0
        while time.monotonic() < deadline and failures < 3:
            try:
                urllib.request.urlopen("http://127.0.0.1:9120/api/health", timeout=2).close()
                failures = 0
            except Exception:
                failures += 1
            time.sleep(1)
      # Tools that look up the running uid need a passwd entry
      passwd: |
        root:x:0:0:root:/root:/bin/sh
        hermes:x:568:568:hermes:/opt/data/hermes:/bin/bash
        nobody:x:65534:65534:nobody:/nonexistent:/usr/sbin/nologin
      group: |
        root:x:0:
        hermes:x:568:
        nogroup:x:65534:
      # Her own workspace, so her memory never mixes with Jacob's
      honcho.json: |
        {
          "hosts": {
            "hermes": {
              "baseUrl": "http://honcho.honcho.svc.cluster.local:8000",
              "workspace": "kittykat",
              "peerName": "kittykat",
              "aiPeer": "hermes",
              "sessionStrategy": "per-session",
              "pinUserPeer": true
            }
          }
        }
      nginx.conf: |
        pid /tmp/nginx.pid;
        events {}
        http {
          access_log off;
          client_body_temp_path /tmp/cb; proxy_temp_path /tmp/p; fastcgi_temp_path /tmp/f;
          uwsgi_temp_path /tmp/u; scgi_temp_path /tmp/s;
          map $http_upgrade $connection_upgrade {
            default upgrade;
            '' close;
          }
          server {
            listen 8080;
            client_max_body_size 512m;
            location = /healthz { return 200 "ok\n"; }
            include /etc/nginx/dashboard.conf;
          }
        }
      # The Chat tab's TUI would be a shell in this pod
      dashboard.conf: |
        location /api/pty { return 403; }
        location / {
          proxy_pass http://127.0.0.1:9119;
          proxy_http_version 1.1;
          proxy_set_header Host 127.0.0.1:9119;
          proxy_set_header Origin http://127.0.0.1:9119;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header X-Forwarded-For "";
          proxy_buffering off;
          proxy_read_timeout 24h;
          proxy_send_timeout 24h;
        }

persistence:
  data:
    type: persistentVolumeClaim
    forceRename: hermes-kittykat
    retain: true
    storageClass: longhorn-nvme
    accessMode: ReadWriteOnce
    size: 40Gi
    advancedMounts:
      hermes:
        init:
          - path: /opt/data
        gateway:
          - path: /opt/data
        hermes:
          - path: /opt/data
        acp-host:
          - path: /opt/data
        device-plugin:
          - path: /opt/data
  managed:
    type: configMap
    identifier: managed
    advancedMounts:
      hermes:
        hermes:
          - &managed
            path: /etc/hermes-managed
            readOnly: true
        init:
          - *managed
        gateway:
          - *managed
        acp-host:
          - *managed
  config:
    type: configMap
    identifier: config
    advancedMounts:
      hermes:
        init:
          - path: /config
            readOnly: true
          - &passwd
            path: /etc/passwd
            subPath: passwd
            readOnly: true
          - &group
            path: /etc/group
            subPath: group
            readOnly: true
        gateway:
          - *passwd
          - *group
        hermes:
          - *passwd
          - *group
          - &prestop
            path: /etc/hermes-prestop.py
            subPath: hermes-prestop.py
            readOnly: true
        acp-host:
          - *passwd
          - *group
          - *prestop
        proxy:
          - path: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
          - path: /etc/nginx/dashboard.conf
            subPath: dashboard.conf
            readOnly: true
  tmp:
    type: emptyDir
    advancedMounts:
      hermes:
        init:
          - path: /tmp
        gateway:
          - path: /tmp
        hermes:
          - path: /tmp
        proxy:
          - path: /tmp
        acp-host:
          - path: /tmp
  # The hermes-device binary, for acp-host
  device-bin:
    type: custom
    volumeSpec:
