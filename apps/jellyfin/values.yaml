# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json

controllers:
  jellyfin:
    replicas: 1
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        # video and render groups, so uid 568 can open the Arc's /dev/dri nodes
        supplementalGroups: [44, 109]
        fsGroupChangePolicy: OnRootMismatch
    containers:
      jellyfin:
        image:
          repository: jacob.pub/ghcr.io/jellyfin/jellyfin
          tag: 12.2@sha256:c3efa69a22f2691fc88d6bb035e87a8560e395a6047f062fb381c61c3185e8f5
          pullPolicy: IfNotPresent
        resources:
          requests:
            cpu: '2'
            memory: 10Gi
          limits:
            cpu: '4'
            memory: 15Gi
            gpu.intel.com/i915: 1
        probes:
          liveness:
            enabled: true
            spec:
              initialDelaySeconds: 20
          readiness:
            enabled: true
            spec:
              initialDelaySeconds: 20
          startup:
            enabled: true
            spec:
              initialDelaySeconds: 20
        env:
          - name: JELLYFIN_PublishedServerUrl
            value: https://jellyfin.mcswain.dev
          - name: JELLYFIN_FFmpeg__probesize
            value: 20M
          - name: JELLYFIN_LOG_DIR
            value: "/log"
          - name: TMPDIR
            value: /tmp
        securityContext:
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

service:
  jellyfin:
    controller: jellyfin
    ports:
      http:
        port: 8096

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 100Gi
    storageClass: longhorn-nvme
  cache:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 15Gi
    storageClass: longhorn-ssd
  cache-transcodes:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 10Gi
    globalMounts:
      - path: /cache/transcodes
  log:
    enabled: true
    type: emptyDir
    sizeLimit: 10Gi
  tmp:
    enabled: true
    type: emptyDir
    sizeLimit: 30Gi
  media:
    enabled: true
    existingClaim: media

ingress:
  tailscale:
    enabled: true
    className: tailscale
    hosts:
      - host: jellyfin
        paths:
        - path: /
          pathType: Prefix
          service:
              identifier: jellyfin
              port: http
    tls:
      - hosts:
          - jellyfin

route:
  jellyfin:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: public
        namespace: envoy-gateway-system
        sectionName: https
    hostnames:
      - jellyfin.mcswain.dev
    rules:
      - backendRefs:
          - name: jellyfin
            port: 8096
        matches:
          - path:
              type: PathPrefix
              value: /
        timeouts:
          request: 0s
          backendRequest: 0s

serviceMonitor:
  jellyfin:
    enabled: true
    serviceName: jellyfin
    endpoints:
      - port: http
        scheme: http
        path: /metrics
        interval: 10s
        scrapeTimeout: 10s
