apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 1h
  targetNamespace: jellyfin
  path: ./apps/jellyfin/resources/app
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: restic
  namespace: jellyfin
spec:
  interval: 1h
  targetNamespace: jellyfin
  path: ./apps/jellyfin/resources/restic
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  commonMetadata:
    annotations:
      kustomize.toolkit.fluxcd.io/prune: disabled
