apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: http-logger
  namespace: http-logger
spec:
  interval: 1h
  targetNamespace: http-logger
  path: ./apps/http-logger/resources
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
