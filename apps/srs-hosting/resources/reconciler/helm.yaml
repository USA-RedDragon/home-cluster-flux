apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reconciler
  namespace: srs-hosting
spec:
  install:
    remediation:
      retries: -1
  interval: 60m0s
  maxHistory: 2
  driftDetection:
    mode: enabled
  releaseName: reconciler
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: reconciler-chart-values
