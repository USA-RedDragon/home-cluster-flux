# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
controllers:
  reconciler:
    replicas: 1
    strategy: RollingUpdate
    serviceAccount:
      identifier: reconciler
    containers:
      reconciler:
        image:
          repository: jacob.pub/ghcr.io/srs-hosting/reconciler
          tag: v0.0.9
        env:
          - name: METRICS_ENABLED
            value: "true"
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: postgresql-app
                key: uri
        resources:
          limits: {}
          requests: {}
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch

serviceAccount:
  reconciler: {}

rbac:
  roles:
    reconciler:
      type: ClusterRole
      rules:
        - apiGroups: [""]
          resources: ["namespaces"]
          verbs: ["get", "list", "watch", "create", "update", "patch"]
        - apiGroups: [""]
          resources: ["nodes"]
          verbs: ["get", "list"]
        - apiGroups: [""]
          resources: ["pods", "endpoints"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["secrets", "configmaps", "services", "serviceaccounts"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: [""]
          resources: ["persistentvolumeclaims"]
          verbs: ["get", "list", "watch", "create", "update", "patch"]
        - apiGroups: ["apps"]
          resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: ["batch"]
          resources: ["jobs", "cronjobs"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: ["networking.k8s.io"]
          resources: ["ingresses", "networkpolicies"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: ["gateway.networking.k8s.io"]
          resources:
            - httproutes
            - grpcroutes
            - tcproutes
            - udproutes
            - tlsroutes
            - referencegrants
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: ["policy"]
          resources: ["poddisruptionbudgets"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: ["autoscaling"]
          resources: ["horizontalpodautoscalers"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: ["monitoring.coreos.com"]
          resources: ["servicemonitors", "podmonitors", "prometheusrules"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: ["cilium.io"]
          resources: ["ciliumnetworkpolicies"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: ["rbac.authorization.k8s.io"]
          resources: ["roles", "rolebindings"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: ["scheduling.k8s.io"]
          resources: ["priorityclasses"]
          verbs: ["get", "list"]
  bindings:
    reconciler:
      type: ClusterRoleBinding
      roleRef:
        identifier: reconciler
      subjects:
        - identifier: reconciler

service:
  reconciler:
    controller: reconciler
    ports:
      metrics:
        port: 9090
        protocol: TCP

serviceMonitor:
  reconciler:
    enabled: true
    serviceName: reconciler
    endpoints:
      - port: metrics
        scheme: http
        path: /metrics
        interval: 10s
        scrapeTimeout: 10s
