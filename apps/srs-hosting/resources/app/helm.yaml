apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: srs-hosting
  namespace: srs-hosting
spec:
  install:
    remediation:
      retries: -1
  interval: 60m0s
  driftDetection:
    mode: enabled
  releaseName: srs-hosting
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: chart-values
