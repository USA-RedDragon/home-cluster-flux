# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
controllers:
  srs-hosting:
    replicas: 1
    strategy: RollingUpdate
    containers:
      srs-hosting:
        image:
          repository: jacob.pub/ghcr.io/srs-hosting/platform
          tag: v0.0.7@sha256:c8f60d08983eb34f3bd6e0ce98482ac1ba4be040b004ce6dd23426f4226408d7
        env:
          - name: METRICS_ENABLED
            value: "true"
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: postgresql-app
                key: uri
          - name: OIDC_ISSUER_URL
            value: 'https://authentik.mcswain.dev/application/o/srs-hosting/'
          - name: OIDC_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: srs-hosting
                key: oidc-client-id
          - name: OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: srs-hosting
                key: oidc-client-secret
          - name: OIDC_REDIRECT_URL
            value: 'https://srshost.ing/api/v1/auth/callback'
          - name: SESSION_SECRET
            valueFrom:
              secretKeyRef:
                name: srs-hosting
                key: session-secret
        resources:
          limits: {}
          requests: {}
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch

service:
  srs-hosting:
    controller: srs-hosting
    ports:
      http:
        port: 8080
        protocol: TCP
        primary: true
      metrics:
        port: 9090
        protocol: TCP

serviceMonitor:
  srs-hosting:
    enabled: true
    serviceName: srs-hosting
    endpoints:
      - port: metrics
        scheme: http
        path: /metrics
        interval: 10s
        scrapeTimeout: 10s

route:
  srs-hosting:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: public
        namespace: envoy-gateway-system
        sectionName: https
    hostnames:
      - srshost.ing
    rules:
      - backendRefs:
          - name: srs-hosting
            port: 8080
        matches:
          - path:
              type: PathPrefix
              value: /
