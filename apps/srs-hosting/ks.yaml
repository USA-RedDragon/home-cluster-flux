apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: srs-hosting
  namespace: srs-hosting
spec:
  interval: 1h
  targetNamespace: srs-hosting
  path: ./apps/srs-hosting/resources
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
