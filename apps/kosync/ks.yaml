apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kosync
  namespace: kosync
spec:
  interval: 1h
  targetNamespace: kosync
  path: ./apps/kosync/resources/app
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: restic
  namespace: kosync
spec:
  interval: 1h
  targetNamespace: kosync
  path: ./apps/kosync/resources/restic
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
