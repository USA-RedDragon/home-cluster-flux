apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  namespace: talaria-hub
spec:
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job.longhorn.io/trim: enabled
  # Two instances, so a node drain or an operator upgrade fails over instead of stopping the hub
  instances: 2
  imageName: jacob.pub/ghcr.io/cloudnative-pg/postgresql:17.11-system-bookworm@sha256:1d4180c155a2a7b4c59f4f13b7cdc5a1795bb8d85f3c92fd7647dae9e929f72e
  enableSuperuserAccess: false
  # Recovered from hermes-hub's barman archive, which also proves that archive restores; at the cutover the hub's
  #   data is brought current with pg_dump/pg_restore from hermes-hub after its hub is stopped
  bootstrap:
    recovery:
      database: hub
      owner: hub
      source: postgresql
  externalClusters:
    - name: postgresql
      barmanObjectStore:
        destinationPath: s3://cnpg/hermes-hub
        endpointURL: https://s3.mcswain.dev
        s3Credentials:
          accessKeyId:
            name: cnpg-minio
            key: AWS_ACCESS_KEY_ID
          secretAccessKey:
            name: cnpg-minio
            key: AWS_SECRET_ACCESS_KEY
        wal:
          compression: zstd
  backup:
    barmanObjectStore:
      destinationPath: "s3://cnpg/talaria-hub"
      endpointURL: "https://s3.mcswain.dev"
      s3Credentials:
        accessKeyId:
          name: cnpg-minio
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-minio
          key: AWS_SECRET_ACCESS_KEY
      data:
        compression: lz4
      wal:
        compression: zstd
    retentionPolicy: "4w"
  storage:
    storageClass: longhorn-nvme-r1
    size: 2Gi
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
  smartShutdownTimeout: 30
  stopDelay: 300
---
apiVersion: v1
kind: Secret
metadata:
 name: cnpg-minio
 annotations:
   reflector.v1.k8s.emberstack.com/reflects: reflector/cnpg-minio
type: Opaque
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: backup
spec:
  immediate: true
  schedule: "0 16 * * * *"
  backupOwnerReference: self
  cluster:
    name: postgresql
