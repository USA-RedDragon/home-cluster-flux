apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: talaria-hub
  namespace: talaria-hub
spec:
  interval: 1h
  targetNamespace: talaria-hub
  path: ./apps/talaria-hub/resources
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
