apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  namespace: rtz
spec:
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job.longhorn.io/trim: enabled
  instances: 3
  imageName: jacob.pub/ghcr.io/cloudnative-pg/postgresql:17.11-system-bookworm@sha256:9cf9466e674a794aee83693b9c28d8b3103d612a943bf144117a718b97b9d1db
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: rtz
      owner: rtz
  backup:
    barmanObjectStore:
      destinationPath: "s3://cnpg/rtz"
      endpointURL: "https://s3.mcswain.dev"
      s3Credentials:
        accessKeyId:
          name: cnpg-minio
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-minio
          key: AWS_SECRET_ACCESS_KEY
      data:
        compression: lz4
      wal:
        compression: zstd
    retentionPolicy: "4w"
  storage:
    storageClass: longhorn-nvme-r1
    size: 20Gi
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      memory: 200Mi
      cpu: 100m
  smartShutdownTimeout: 30
  stopDelay: 300
---
apiVersion: v1
kind: Secret
metadata:
 name: cnpg-minio
 annotations:
   reflector.v1.k8s.emberstack.com/reflects: reflector/cnpg-minio
type: Opaque
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: backup
spec:
  immediate: true
  schedule: "0 10 * * * *"
  backupOwnerReference: self
  cluster:
    name: postgresql
