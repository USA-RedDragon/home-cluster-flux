apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rdio-scanner
  namespace: rdio-scanner
spec:
  interval: 1h
  targetNamespace: rdio-scanner
  path: ./apps/rdio-scanner/resources/app
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: restic
  namespace: rdio-scanner
spec:
  interval: 1h
  targetNamespace: rdio-scanner
  path: ./apps/rdio-scanner/resources/restic
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
