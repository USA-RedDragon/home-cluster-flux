# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json

defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

controllers:
  rdio-scanner:
    replicas: 1
    pod:
      labels:
        policy.mcswain.dev/egress-coredns: "true"
        policy.mcswain.dev/egress-namespace: "true"
    containers:
      rdio-scanner:
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/rdio-scanner
          tag: v7.2.30@sha256:93c610aafb9a94eada4e4d1d3b8c1d0bef91675dcdc56e80339099d841885794
          pullPolicy: IfNotPresent
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          limits:
            memory: 150Mi
          requests:
            cpu: 30m
            memory: 128Mi
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
        env:
          - name: TZ
            value: America/Chicago
          - name: METRICS_PORT
            value: '9108'
          - name: DB_HOST
            valueFrom:
              secretKeyRef:
                name: postgresql-app
                key: host
          - name: DB_TYPE
            value: postgresql
          - name: DB_PORT
            value: "5432"
          - name: DB_NAME
            valueFrom:
              secretKeyRef:
                name: postgresql-app
                key: dbname
          - name: DB_SSLMODE
            value: "require"
          - name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: postgresql-app
                key: password
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: postgresql-app
                key: username

persistence:
  data:
    type: emptyDir
    globalMounts:
      - path: /app/data
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp

service:
  rdio-scanner:
    controller: rdio-scanner
    ports:
      http:
        port: 3000
      metrics:
        port: 9108

route:
  rdio-scanner:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: public
        namespace: envoy-gateway-system
        sectionName: https
    hostnames:
      - scanner.mcswain.dev
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /admin
          - path:
              type: PathPrefix
              value: /api/admin
          - path:
              type: PathPrefix
              value: /metrics
        filters:
          - type: ExtensionRef
            extensionRef:
              group: gateway.envoyproxy.io
              kind: HTTPRouteFilter
              name: not-found
      - backendRefs:
          - name: rdio-scanner
            port: 3000
        matches:
          - path:
              type: PathPrefix
              value: /
        timeouts:
          request: 0s
          backendRequest: 0s

serviceMonitor:
  rdio-scanner:
    enabled: true
    serviceName: rdio-scanner
    endpoints:
      - port: metrics
        scheme: http
        path: /metrics
        interval: 10s
        scrapeTimeout: 10s
