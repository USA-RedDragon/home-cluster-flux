# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: restic
  namespace: rmfakecloud
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  maxHistory: 2
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: -1
  values:
    defaultPodOptions:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: rmfakecloud

    controllers:
      restic:
        type: cronjob
        cronjob:
          schedule: 8 1 * * *
          timeZone: America/Chicago
          concurrencyPolicy: Forbid
          ttlSecondsAfterFinished: 3600
        containers:
          restic:
            image: &image
              repository: jacob.pub/ghcr.io/gabe565/restic
              tag: 0.19.1@sha256:495346252a3c601e9c98b216030149db3278a7295d90d0e325c8684419d277ef
            workingDir: /data
            envFrom: &envFrom
              - secretRef:
                  name: restic-b2
              - secretRef:
                  name: restic-envs
            env: &env
              TZ: America/Chicago
              RESTIC_HOST:
                fieldRef:
                  fieldPath: metadata.namespace
            command:
              - sh
              - -c
              # language=sh
              - |
                exec > >(ts '%H:%M:%S') 2>&1
                set -eu
                restic backup --tag=files /data
                restic forget --prune --keep-daily=90 --keep-weekly=24 --keep-monthly=24 --keep-yearly=20
                restic cache --cleanup
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
      init:
        type: job
        annotations:
          helm.sh/hook: post-install
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
        containers:
          init:
            image: *image
            workingDir: /data
            envFrom: *envFrom
            env: *env
            command: [sh, -c, "restic init || true"]

    persistence:
      data:
        existingClaim: rmfakecloud
