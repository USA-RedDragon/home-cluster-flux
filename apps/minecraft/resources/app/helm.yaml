  namespace: minecraft
spec:
  interval: 60m0s
  driftDetection:
    mode: enabled
  releaseName: minecraft
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: chart-values
