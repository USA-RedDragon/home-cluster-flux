apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: minecraft
  namespace: minecraft
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: minecraft
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: sessionserver.mojang.com
        - matchPattern: api.minecraftservices.com
        - matchPattern: api.mojang.com
        - matchPattern: authserver.mojang.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
