# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
controllers:
  filebrowser:
    replicas: 1
    strategy: RollingUpdate
    initContainers:
      rcon-seed:
        image:
          repository: jacob.pub/ghcr.io/srs-hosting/rcon
          tag: v0.0.4@sha256:d2c2a62ea0d83aad7ebbd8ba39c066568f5f7dc6be9e0fbdf74ec5ca99aafab3
          pullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            cp /rcon /opt/bin/rcon
            cat > /opt/bin/mc-restart <<'SCRIPT'
            #!/bin/sh
            /opt/bin/rcon -a minecraft-rcon:25575 "/save-all"
            /opt/bin/rcon -a minecraft-rcon:25575 "/stop"
            SCRIPT
            chmod +x /opt/bin/mc-restart
        securityContext: &security-context
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
    containers:
      filebrowser:
        image:
          repository: jacob.pub/docker.io/filebrowser/filebrowser
          tag: v2.63.23@sha256:a469ea076d4a1b4b1d86a41d130f2f536cd9da996a2b1fb39c0d7635f9d89b9a
        args:
          - --database
          - /database/filebrowser.db
          - --address
          - 0.0.0.0
          - --noauth
          - --root
          - /srv
        env:
          - name: RCON_PASSWORD
            valueFrom:
              secretKeyRef:
                name: minecraft
                key: rcon-password
        resources:
          limits: {}
          requests: {}
        securityContext: *security-context
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: minecraft

service:
  filebrowser:
    controller: filebrowser
    ports:
      http:
        port: 8080
        protocol: TCP

persistence:
  srv:
    existingClaim: minecraft
  config:
    enabled: true
    type: configMap
    name: filebrowser
    globalMounts:
    - path: /config/settings.json
      subPath: settings.json
  database:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: longhorn-ssd
  bin:
    enabled: true
    type: emptyDir
    sizeLimit: 32Mi
    advancedMounts:
      filebrowser:
        rcon-seed:
          - path: /opt/bin
        filebrowser:
          - path: /opt/bin

ingress:
  tailscale:
    enabled: true
    className: tailscale
    hosts:
      - host: mc-files
        paths:
        - path: /
          pathType: Prefix
          service:
              identifier: filebrowser
              port: http
    tls:
      - hosts:
          - mc-files

configMaps:
  config:
    data:
      settings.json: |
        {
          "disableExec": false
        }
