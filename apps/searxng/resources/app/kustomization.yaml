apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: searxng
resources:
  - helm.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: chart-values
    files:
      - values.yaml=values.yaml
  - name: searxng-settings
    files:
      - settings.yml
    options:
      disableNameSuffixHash: true
configurations:
  - kustomizeconfig.yaml
