apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: searxng
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
# DNS and internet egress for the app pod come from the policy.mcswain.dev labels on the pod (values.yaml)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: searxng-ingress
  namespace: searxng
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/controller: searxng
      app.kubernetes.io/instance: searxng
      app.kubernetes.io/name: searxng
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: envoy-gateway-system
            gateway.envoyproxy.io/owning-gateway-name: internal
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: hermes
            app.kubernetes.io/controller: hermes
        - matchLabels:
            io.kubernetes.pod.namespace: hermes-kittykat
            app.kubernetes.io/controller: hermes
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
