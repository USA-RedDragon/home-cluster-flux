loadBalancerClass: "metallb"

prometheus:
  serviceMonitor:
    enabled: true

  prometheusRule:
    enabled: true
    addressPoolExhausted:
      excludePools: public
    addressPoolUsage:
      excludePools: public

  rbacPrometheus: false

controller:
  image:
    repository: quay.io/metallb/controller
    tag: v0.16.2@sha256:34a6f107f29c4fc6e9d084a7f3bdb781aae7b5ee2b534195a2775ab68c09c503
  resources: {}

speaker:
  image:
    repository: quay.io/metallb/speaker
    tag: v0.16.2@sha256:01666518b091a6651d68891c802db84b2219495d7e0e41c2e61c46f9976be231
  resources: {}
  updateStrategy:
    type: OnDelete

  reloader:
    resources: {}

  frrMetrics:
    resources: {}

  extraContainers: []

frrk8s:
  enabled: false

crds:
  enabled: true
  validationFailurePolicy: Fail
