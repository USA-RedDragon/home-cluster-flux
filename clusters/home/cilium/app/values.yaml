ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 172.17.0.0/16
    clusterPoolIPv4MaskSize: 24
    clusterPoolIPv6PodCIDRList:
      - fdeb:abba:237c:fefe:0::/96
    clusterPoolIPv6MaskSize: 112

extraConfig:
  enable-ipv6-ndp: "true"
  ipv6-service-range: "fdeb:abba:237c:fefe:1::/112"

operator:
  replicas: 3

# Needed for pod-to-pod Wireguard connections
socketLB:
  hostNamespaceOnly: true

loadBalancer:
  mode: hybrid
  dsrDispatch: geneve

routingMode: tunnel
tunnelProtocol: geneve

externalIPs:
  enabled: true

dnsProxy:
  dnsRejectResponseCode: nameError

cni:
  exclusive: true

bpf:
  policyMapMax: 32768
  masquerade: true

ipv4:
  enabled: true

ipv6:
  enabled: true

enableIPv6Masquerade: false

global:
  encryption:
    enabled: true
    nodeEncryption: true

policyEnforcementMode: default

kubeProxyReplacement: true

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# TEMPORARY step to 1.19.6: the agent sat on 1.18.5 since January because
# Renovate bumped only the tag while this digest stayed pinned. Cilium upgrades
# one minor at a time; next step removes this and the envoy override so the
# 1.20.2 chart sets matched images.
image:
  repository: "quay.io/cilium/cilium"
  tag: "v1.19.6"
  digest: "sha256:0df5b2750b64c49843aba1d649e9eaf61467cb0645ad3171db6f6962c095ac92"

priorityClassName: system-node-critical

annotateK8sNode: true
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

k8sServiceHost: localhost
k8sServicePort: 7445

hubble:
  metrics:
    enabled:
    - dns:query;ignoreAAAA
    - drop
    - tcp
    - flow
    - icmp
    - http

  # method: helm (the default) issues the Hubble certs once and reuses them on
  # every upgrade, so they expired after 365 days (2026-07-28) and hubble-relay
  # crash-looped. The certgen CronJob reissues them on tls.auto.schedule.
  tls:
    auto:
      enabled: true
      method: cronJob

  ui:
    enabled: true
    replicas: 1
    ingress:
      enabled: true
      className: tailscale
      hosts:
        - hubble
      tls:
        - hosts:
            - hubble

  relay:
    enabled: true

envoy:
  image:
    repository: "quay.io/cilium/cilium-envoy"
    # chart 1.19.6 default; TEMPORARY with the agent pin above
    tag: "v1.36.9-1782267392-edeb3f2af56c37c407efa1f63f0b32f595399bbc"
    digest: "sha256:767101fb8a5e38f055778cb43b7aa8eed80450b37f8121effac3d9de9e06dc99"
