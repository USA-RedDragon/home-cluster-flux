repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-case-conflict

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: remove-crlf
      - id: remove-tabs
        types: [yaml]

  - repo: https://github.com/gabe565/pre-commit-fluxcd
    rev: v0.5.1
    hooks:
      - id: check-charts-support-renovate
      - id: check-secrets-encrypted

  - repo: local
    hooks:
      - id: check-charts-pinned
        name: Check for unpinned chart versions
        entry: .github/scripts/check-charts-pinned.py
        language: python
        additional_dependencies:
          - pyyaml==6.0.3
        types: [yaml]

  - repo: https://github.com/gabe565/template-kubernetes-apps-markdown
    rev: v0.5.1
    hooks:
      - id: template
        args:
          - --dirs=apps,infrastructure,services
          - --paths-re=^.+?/(?P<cluster>.+?)/
          - --supporting-services=postgres,postgresql,redis,valkey,mariadb
          - --exclude-hidden
