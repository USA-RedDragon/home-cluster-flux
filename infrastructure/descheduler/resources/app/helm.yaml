---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: descheduler
  namespace: descheduler
spec:
  interval: 1h0m0s
  url: https://kubernetes-sigs.github.io/descheduler/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: descheduler
spec:
  install:
    remediation:
      retries: -1
  interval: 1h0m0s
  maxHistory: 2
  driftDetection:
    mode: enabled
  releaseName: descheduler
  chart:
    spec:
      chart: descheduler
      sourceRef:
        kind: HelmRepository
        name: descheduler
      version: '0.37.0'
      interval: 1h0m0s
  values:
    image:
      repository: jacob.pub/registry.k8s.io/descheduler/descheduler
    serviceMonitor:
      enabled: true
    podLabels:
      policy.mcswain.dev/egress-coredns: "true"
      policy.mcswain.dev/egress-kubeapi: "true"
    deschedulerPolicy:
      # Runs every 2 min, so keep each pass small and let it converge.
      maxNoOfPodsToEvictPerNamespace: 1
      maxNoOfPodsToEvictPerNode: 2
      maxNoOfPodsToEvictTotal: 4
      # Control-plane nodes are tainted; don't let them skew the averages.
      nodeSelector: "!node-role.kubernetes.io/control-plane,!descheduler.mcswain.dev/exclude"
      profiles:
        - name: default
          pluginConfig:
            - name: DefaultEvictor
              args:
                ignorePvcPods: false
                evictLocalStoragePods: false
                evictSystemCriticalPods: false
                evictDaemonSetPods: false
                evictFailedBarePods: true
            - name: RemovePodsHavingTooManyRestarts
              args:
                podRestartThreshold: 3
                includingInitContainers: true
            - name: RemovePodsViolatingNodeAffinity
              args:
                nodeAffinityType:
                - requiredDuringSchedulingIgnoredDuringExecution
            - name: RemovePodsViolatingNodeTaints
            - name: RemovePodsViolatingInterPodAntiAffinity
            - name: PodLifeTime
              args:
                maxPodLifeTimeSeconds: 300
                states:
                  - CreateContainerError
                namespaces:
                  include:
                    - dump978
                    - rtl-433
                    - trunk-recorder
                    - ultrafeeder
          plugins:
            deschedule:
              enabled:
                - RemovePodsHavingTooManyRestarts
                - RemovePodsViolatingNodeTaints
                - RemovePodsViolatingNodeAffinity
                - RemovePodsViolatingInterPodAntiAffinity
                - PodLifeTime
        - name: balance
          pluginConfig:
            - name: DefaultEvictor
              args:
                ignorePvcPods: true
                evictLocalStoragePods: false
                evictSystemCriticalPods: false
                evictDaemonSetPods: false
                nodeFit: true
                minPodAge: 1h
            - name: RemoveDuplicates
            - name: RemovePodsViolatingTopologySpreadConstraint
            # Relative to the worker average (fixed 20% floors never matched: every
            # worker sits at 60-99% requested). Underutilized = below average - 10
            # on all resources; overutilized = above average + 10 on any.
            - name: LowNodeUtilization
              args:
                # No pods threshold: the evicted pods are small, so pod count on
                # the target fills up long before its CPU/memory do.
                useDeviationThresholds: true
                thresholds:
                  cpu: 10
                  memory: 10
                targetThresholds:
                  cpu: 10
                  memory: 10
                evictableNamespaces:
                  exclude:
                    - actions-runner-system
                    - anubis
                    - aredn-piaware
                    - authentik
                    - cert-manager
                    - cnpg-system
                    - crowdsec
                    - descheduler
                    - dump978
                    - envoy-gateway-system
                    - external-dns-internal
                    - flux-system
                    - frigate
                    - gigalearn
                    - kube-system
                    - kyverno
                    - longhorn-system
                    - metallb-system
                    - minecraft
                    - minio
                    - monitoring
                    - mosquitto
                    - path-of-titans
                    - piaware
                    - reflector
                    - reloader
                    - rtl-433
                    - tailscale-operator
                    - tailscale-peer-relay
                    - tfe
                    - trunk-recorder
                    - ultrafeeder
                    - wireguard
                    - zot
          plugins:
            balance:
              enabled:
                - RemoveDuplicates
                - RemovePodsViolatingTopologySpreadConstraint
                - LowNodeUtilization
