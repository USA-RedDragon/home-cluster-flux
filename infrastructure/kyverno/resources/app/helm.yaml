---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 1h0m0s
  url: https://kyverno.github.io/kyverno/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  install:
    remediation:
      retries: -1
  interval: 1h0m0s
  maxHistory: 2
  driftDetection:
    mode: enabled
  releaseName: kyverno
  chart:
    spec:
      chart: kyverno
      sourceRef:
        kind: HelmRepository
        name: kyverno
      version: '3.9.1'
      interval: 1h0m0s
  values:
    # Policies are Audit-only; an hourly rescan rewrote ~2000 policy reports
    # (~8k etcd writes/h) for no new information.
    features:
      backgroundScan:
        backgroundScanInterval: 24h
      omitEvents:
        eventTypes:
          - PolicyApplied
          - PolicySkipped
          - PolicyViolation
      ttlController:
        reconciliationInterval: 1h
    global:
      image:
        registry: jacob.pub/reg.kyverno.io
      imagePullSecrets:
        - name: registry-zot
    admissionController:
      replicas: 2
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: admission-controller
              app.kubernetes.io/instance: kyverno
      container:
        resources:
          requests:
            memory: 200Mi
    backgroundController:
      resources:
        requests:
          memory: 200Mi
        limits:
          memory: 400Mi
    reportsController:
      resyncPeriod: 6h
      resources:
        requests:
          cpu: 300m
          memory: 400Mi
        limits:
          memory: 400Mi
