apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 1h
  targetNamespace: kyverno
  path: ./infrastructure/kyverno/resources/app
  prune: true
  dependsOn:
    - name: secrets
      namespace: flux-system
    - name: reflector
      namespace: reflector
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-policies
  namespace: kyverno
spec:
  interval: 1h
  targetNamespace: kyverno
  path: ./infrastructure/kyverno/resources/policies
  prune: true
  dependsOn:
    - name: kyverno
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
