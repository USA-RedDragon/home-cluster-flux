apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: b2-backup-operator
  namespace: b2-backup-operator-system
spec:
  interval: 1h
  url: oci://ghcr.io/usa-reddragon/b2-backup-operator-manifests
  ref:
    tag: v0.1.8
    digest: sha256:5b183ccfde9e363ba78b8f2b0c29e64b79091d51cff42b00a45dc703dd8c198c
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: b2-backup-operator
  namespace: b2-backup-operator-system
spec:
  interval: 1h
  targetNamespace: b2-backup-operator-system
  path: ./
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: b2-backup-operator
  images:
    - name: ghcr.io/usa-reddragon/b2-backup-operator
      newName: jacob.pub/ghcr.io/usa-reddragon/b2-backup-operator
  patches:
    - target:
        kind: Namespace
        name: b2-backup-operator-system
      patch: |
        $patch: delete
        apiVersion: v1
        kind: Namespace
        metadata:
          name: not-used
    - target:
        kind: CustomResourceDefinition
        name: .*\.b2backup\.mcswain\.dev
      patch: |
        - op: add
          path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1prune
          value: disabled
    - target:
        kind: Deployment
        name: b2-backup-operator-controller-manager
      patch: |
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --backup-image=jacob.pub/ghcr.io/usa-reddragon/restic:0.19.1@sha256:64d729f52e278c1c1f887ad5c56b47095d986ea0564024c0a6adf0977620126b
        - op: add
          path: /spec/template/metadata/labels/policy.mcswain.dev~1egress-kubeapi
          value: "true"
        - op: add
          path: /spec/template/metadata/labels/policy.mcswain.dev~1egress-coredns
          value: "true"
        - op: add
          path: /spec/template/metadata/labels/policy.mcswain.dev~1egress-internet
          value: "true"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: b2-backup-operator-config
  namespace: b2-backup-operator-system
spec:
  interval: 1h
  targetNamespace: b2-backup-operator-system
  path: ./infrastructure/b2-backup-operator/resources
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
