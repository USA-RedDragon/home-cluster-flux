apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: b2-backup-operator
  namespace: b2-backup-operator-system
spec:
  interval: 1h
  url: oci://ghcr.io/usa-reddragon/b2-backup-operator-manifests
  ref:
    tag: v0.1.6
    digest: sha256:174521024dc6403ea839b66b7e4009bc3faadbf177e0a88d24eeffb57cfb0dc7
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: b2-backup-operator
  namespace: b2-backup-operator-system
spec:
  interval: 1h
  targetNamespace: b2-backup-operator-system
  path: ./
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: b2-backup-operator
  images:
    - name: ghcr.io/usa-reddragon/b2-backup-operator
      newName: jacob.pub/ghcr.io/usa-reddragon/b2-backup-operator
  patches:
    - target:
        kind: Namespace
        name: b2-backup-operator-system
      patch: |
        $patch: delete
        apiVersion: v1
        kind: Namespace
        metadata:
          name: not-used
    - target:
        kind: CustomResourceDefinition
        name: .*\.b2backup\.mcswain\.dev
      patch: |
        - op: add
          path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1prune
          value: disabled
    - target:
        kind: Deployment
        name: b2-backup-operator-controller-manager
      patch: |
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --backup-image=jacob.pub/ghcr.io/usa-reddragon/restic:0.19.1@sha256:db566112ce1d490c47b04f3cfec2436f30de3e6187b2b0f092d3b3ea50da519e
        - op: add
          path: /spec/template/metadata/labels/policy.mcswain.dev~1egress-kubeapi
          value: "true"
        - op: add
          path: /spec/template/metadata/labels/policy.mcswain.dev~1egress-coredns
          value: "true"
        - op: add
          path: /spec/template/metadata/labels/policy.mcswain.dev~1egress-internet
          value: "true"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: b2-backup-operator-config
  namespace: b2-backup-operator-system
spec:
  interval: 1h
  targetNamespace: b2-backup-operator-system
  path: ./infrastructure/b2-backup-operator/resources
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
