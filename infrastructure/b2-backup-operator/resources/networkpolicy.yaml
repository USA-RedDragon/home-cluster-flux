apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: b2-backup-operator-system
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: b2-backup-operator-system
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: b2-backup-operator-ingress
  namespace: b2-backup-operator-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: b2-backup-operator
      control-plane: controller-manager
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
