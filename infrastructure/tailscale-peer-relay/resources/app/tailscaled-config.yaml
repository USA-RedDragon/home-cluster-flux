apiVersion: v1
kind: ConfigMap
metadata:
  name: tailscaled-config
data:
  cap-120.hujson: |
    {
      "Version": "alpha0",
      "Hostname": "home-peer-relay",
      "AuthKey": "file:/etc/tailscale-auth/TS_AUTHKEY",
      "acceptDNS": false,
      "acceptRoutes": false,
      "RelayServerPort": 40000,
      "RelayServerStaticEndpoints": ["192.0.2.1:40000"]
    }
