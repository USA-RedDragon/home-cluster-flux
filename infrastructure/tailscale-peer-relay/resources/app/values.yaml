controllers:
  tailscale:
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
    containers:
      app:
        resources:
          limits:
            memory: 96Mi
        image:
          repository: jacob.pub/ghcr.io/tailscale/tailscale
          tag: v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
        env:
          TS_KUBE_SECRET: tailscale-state
          TS_USERSPACE: "true"
          TS_EXPERIMENTAL_VERSIONED_CONFIG_DIR: /etc/tailscaled
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]

persistence:
  config:
    enabled: true
    type: configMap
    name: tailscaled-config
    globalMounts:
      - path: /etc/tailscaled
        readOnly: true
  auth:
    enabled: true
    type: secret
    name: tailscale-env
    globalMounts:
      - path: /etc/tailscale-auth
        readOnly: true
  run:
    enabled: true
    type: emptyDir
    sizeLimit: 1Gi
    medium: Memory
    globalMounts:
      - path: /var/run/tailscale
  tmp:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 1Gi

serviceAccount:
  tailscale-peer-relay:
    enabled: true

rbac:
  roles:
    tailscale:
      enabled: true
      type: Role
      rules:
        - apiGroups: [""]
          resources:
            - secrets
          # Create can not be restricted to a resource name.
          verbs:
            - create
        - apiGroups: [""]
          resources:
            - secrets
          verbs:
            - get
            - update
            - patch
          resourceNames:
            - tailscale-state
  bindings:
    tailscale:
      enabled: true
      type: RoleBinding
      roleRef:
        identifier: tailscale
      subjects:
        - identifier: tailscale-peer-relay

service:
  tailscale:
    controller: tailscale
    ports:
      relay:
        port: 40000
        protocol: UDP

route:
  tailscale:
    enabled: true
    kind: UDPRoute
    parentRefs:
      - name: public
        namespace: envoy-gateway-system
        sectionName: tailscale-peer-relay
    rules:
      - backendRefs:
          - identifier: tailscale
            port: 40000
