---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dockers-private-runner-set
  namespace: actions-runners
spec:
  interval: 1h0m0s
  maxHistory: 2
  driftDetection:
    mode: enabled
  releaseName: dockers-private-runner-set
  chart:
    spec:
      chart: gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        namespace: actions-runner-system
        name: actions-runner-controller
      version: 0.15.1
      interval: 1h0m0s
  install:
    remediation:
      retries: -1
  values:
    controllerServiceAccount:
      namespace: actions-runner-system
      name: arc-gha-rs-controller
    githubConfigSecret: github-app
    githubConfigUrl: "https://github.com/USA-RedDragon/dockers-private"
    maxRunners: 10
    containerMode:
      type: kubernetes-novolume
    template:
      metadata:
        labels:
          policy.mcswain.dev/egress-kubeapi: "true"
      spec:
        securityContext:
          fsGroup: 1001
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values: [alpha, beta]
        containers:
        - name: runner
          image: jacob.pub/ghcr.io/usa-reddragon/arc-runner:2.338.2@sha256:12b4f570a681eb28247e055db777f1b23255900fca1dad8292803e3605d770b2
          command: ["/home/runner/run.sh"]
          env:
            - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
              value: "false"
            - name: CUSTOM_ACTIONS_RESULTS_URL
              value: http://actions-cache.actions-cache.svc.cluster.local:3000
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop:
                - ALL
