---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dockers-private-runner-set
  namespace: actions-runners
spec:
  interval: 1m0s
  driftDetection:
    mode: enabled
  releaseName: dockers-private-runner-set
  chart:
    spec:
      chart: gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        namespace: actions-runner-system
        name: actions-runner-controller
      version: 0.14.2
      interval: 1m0s
  install:
    remediation:
      retries: -1
  values:
    githubConfigSecret: github-app
    githubConfigUrl: "https://github.com/USA-RedDragon/dockers-private"
    maxRunners: 10
    containerMode:
      type: kubernetes-novolume
    template:
      metadata:
        labels:
          policy.mcswain.dev/egress-kubeapi: "true"
      spec:
        securityContext:
          fsGroup: 1001
        containers:
        - name: runner
          image: jacob.pub/ghcr.io/usa-reddragon/arc-runner:2.337.0@sha256:0c75e1ed6ee7454613068ddd1704b38593fb7b049869db07bb29b877ab0da014
          command: ["/home/runner/run.sh"]
          env:
            - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
              value: "false"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop:
                - ALL
