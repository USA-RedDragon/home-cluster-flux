apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: csi-snapshotter
  namespace: kube-system
spec:
  interval: 1h
  targetNamespace: kube-system
  path: ./infrastructure/csi-snapshotter/resources
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
