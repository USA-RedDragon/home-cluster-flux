apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: public-proxy
  namespace: envoy-gateway-system
spec:
  ipFamily: DualStack
  concurrency: 4
  backendTLS:
    alpnProtocols:
      - http/1.1
    minVersion: "1.2"
    maxVersion: "1.3"
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        loadBalancerClass: metallb
        annotations:
          metallb.io/loadBalancerIPs: "192.168.254.254,2600:8803:a30a:2a00::e:1"
      envoyPDB:
        minAvailable: 1
      envoyDeployment:
        replicas: 2
        pod:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - alpha
                          - beta
                          - gamma
                          - delta
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
                  gateway.envoyproxy.io/owning-gateway-name: public
              matchLabelKeys:
                - pod-template-hash
        container:
          resources:
            requests:
              cpu: 100m
              memory: 640Mi
            limits:
              cpu: "2"
              memory: 1Gi
