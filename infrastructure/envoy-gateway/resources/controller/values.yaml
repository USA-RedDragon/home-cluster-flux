global:
  imagePullSecrets:
    - name: registry-docker-hub

deployment:
  replicas: 2
  priorityClassName: "system-cluster-critical"
  envoyGateway:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

podDisruptionBudget:
  minAvailable: 1

config:
  envoyGateway:
    extensionApis:
      enableBackend: true
      enableEnvoyPatchPolicy: true
      enableLua: true
