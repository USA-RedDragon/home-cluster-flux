apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-operator
  namespace: tailscale-operator
spec:
  interval: 1h
  targetNamespace: tailscale-operator
  path: ./infrastructure/tailscale-operator/resources/app
  prune: true
  dependsOn:
    - name: secrets
      namespace: flux-system
    - name: reflector
      namespace: reflector
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-operator-config
  namespace: tailscale-operator
spec:
  interval: 1h
  dependsOn:
    - name: tailscale-operator
  targetNamespace: tailscale-operator
  path: ./infrastructure/tailscale-operator/resources/config
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
