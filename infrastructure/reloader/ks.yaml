apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: resources
  namespace: reloader
spec:
  interval: 1h
  targetNamespace: reloader
  path: ./infrastructure/reloader/resources
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  decryption:
    provider: sops
