apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-power-limit
  namespace: gpu-operator
  labels:
    app.kubernetes.io/name: gpu-power-limit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-power-limit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-power-limit
    spec:
      runtimeClassName: nvidia
      automountServiceAccountToken: false
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: power-limit
          image: jacob.pub/docker.io/library/debian:13-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
          command:
            - /bin/sh
            - /scripts/power-limit.sh
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: utility
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: gpu-power-limit
