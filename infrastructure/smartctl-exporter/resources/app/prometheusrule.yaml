apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: disk-health
  namespace: smartctl-exporter
spec:
  groups:
    - name: disk-smart
      rules:
        # Keyed by node + serial_number: nvme0/nvme1 and sda/sdb names can swap
        # across reboots. model_name!~"VIRTUAL-DISK" drops Longhorn iSCSI
        # attachments that land on sda/sdb on NVMe-only nodes.
        - record: disk:info
          expr: max by (node, device, serial_number, model_name, firmware_version, interface) (smartctl_device{model_name!~".*VIRTUAL-DISK.*"})

        - alert: DiskSmartFailed
          expr: (smartctl_device_smart_status == 0) * on (node, device) group_left (serial_number, model_name) disk:info
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "SMART overall health FAILED on {{ $labels.node }} {{ $labels.model_name }} {{ $labels.serial_number }}"
            description: "{{ $labels.node }} {{ $labels.model_name }} {{ $labels.serial_number }}: The drive reports its own SMART self-assessment as failed. Replace it."

        - alert: DiskCriticalWarning
          expr: (smartctl_device_critical_warning != 0) * on (node, device) group_left (serial_number, model_name) disk:info
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "NVMe critical warning on {{ $labels.node }} {{ $labels.model_name }} {{ $labels.serial_number }}"
            description: "{{ $labels.node }} {{ $labels.model_name }} {{ $labels.serial_number }}: SMART CriticalWarning={{ $value }}. Replace it."

        - alert: DiskAvailableSpareLow
          expr: |
            (smartctl_device_available_spare < on (node, device) smartctl_device_available_spare_threshold)
              * on (node, device) group_left (serial_number, model_name) disk:info
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "NVMe spare blocks exhausted on {{ $labels.node }} {{ $labels.serial_number }}"
            description: "{{ $labels.node }} {{ $labels.model_name }} {{ $labels.serial_number }}: AvailableSpare is {{ $value }}%, below the drive's own threshold."

        - alert: DiskAvailableSpareDropping
          expr: (smartctl_device_available_spare < 90) * on (node, device) group_left (serial_number, model_name) disk:info
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "NVMe spare blocks at {{ $value }}% on {{ $labels.node }} {{ $labels.serial_number }}"
            description: "{{ $labels.node }} {{ $labels.model_name }} {{ $labels.serial_number }}: The drive has been retiring blocks. Healthy drives sit at 100%."

        # Rated-endurance used: NVMe PercentageUsed, or for SATA 100 minus the
        # normalized Wear_Leveling_Count (Samsung 870 EVO: 100 new -> 0 worn).
        - record: disk:endurance_used:percent
          expr: |
            (
              smartctl_device_percentage_used
              or
              (100 - smartctl_device_attribute{attribute_name="Wear_Leveling_Count", attribute_value_type="value"})
            ) * on (node, device) group_left (serial_number, model_name) disk:info

        # Lifetime bytes written: NVMe reports it; SATA via Total_LBAs_Written x 512.
        - record: disk:bytes_written:total
          expr: |
            (
              smartctl_device_bytes_written
              or
              (smartctl_device_attribute{attribute_name="Total_LBAs_Written", attribute_value_type="raw"} * 512)
            ) * on (node, device) group_left (serial_number, model_name) disk:info

        # Only alert on wear that will run out soon (user rule, 2026-10-09: no
        # fixed % thresholds; a drive at 95% with 250 days left is a planned
        # swap, not an alert). Days left = remaining % / %-per-day, where
        # %-per-day = 7d byte rate x lifetime %-per-byte. Bytes rather than the
        # integer endurance %, which ticks and extrapolates wildly.
        - alert: DiskWearExhaustionProjected
          expr: |
            (
              (100 - max without (attribute_name, attribute_value_type, attribute_id, attribute_flags_short, attribute_flags_long) (disk:endurance_used:percent))
              / on (node, device, serial_number, model_name) (
                  rate(disk:bytes_written:total[7d]) * 86400
                * on (node, device, serial_number, model_name) max without (attribute_name, attribute_value_type, attribute_id, attribute_flags_short, attribute_flags_long) (disk:endurance_used:percent)
                / disk:bytes_written:total
              )
            ) < 90
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.node }} {{ $labels.model_name }} {{ $labels.serial_number }} reaches 100% rated endurance in {{ $value | humanize }} days"
            description: "{{ $labels.node }} {{ $labels.model_name }} {{ $labels.serial_number }} will pass 100% of its rated endurance in {{ $value | humanize }} days at the last 7 days' write rate. Order a replacement and check what writes to it."

        - alert: DiskMediaErrorsGrowing
          expr: increase(smartctl_device_media_errors[24h]) * on (node, device) group_left (serial_number, model_name) disk:info > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "New media errors on {{ $labels.node }} {{ $labels.serial_number }}"
            description: "{{ $labels.node }} {{ $labels.model_name }} {{ $labels.serial_number }}: {{ $value }} new uncorrectable media errors in 24h. This drive is failing."

        - alert: DiskSataAttributeGrowing
          expr: |
            increase(smartctl_device_attribute{attribute_value_type="raw", attribute_name=~"Reallocated_Sector_Ct|Uncorrectable_Error_Cnt|CRC_Error_Count|Program_Fail_Cnt_Total|Erase_Fail_Count_Total"}[24h])
              * on (node, device) group_left (serial_number, model_name) disk:info > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.attribute_name }} rising on {{ $labels.node }} {{ $labels.serial_number }}"
            description: "{{ $labels.node }} {{ $labels.model_name }} {{ $labels.serial_number }}: {{ $value }} new in 24h. CRC errors usually mean a cable/backplane fault; the others are the drive."

        - alert: DiskBadBlocksGrowing
          expr: |
            increase(smartctl_device_attribute{attribute_value_type="raw", attribute_name="Added_Bad_Flash_Blk_Ct"}[24h])
              * on (node, device) group_left (serial_number, model_name) disk:info > 10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Bad flash blocks accumulating on {{ $labels.node }} {{ $labels.serial_number }}"
            description: "{{ $labels.node }} {{ $labels.model_name }} {{ $labels.serial_number }}: {{ $value }} new bad flash blocks in 24h. A slow trickle is normal wear; a jump is not."
