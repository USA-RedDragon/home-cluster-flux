apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backup-sync
  namespace: backup-sync
spec:
  interval: 1h
  targetNamespace: backup-sync
  path: ./infrastructure/backup-sync/resources
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
