# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backup-sync-mcswain-minio
  namespace: backup-sync
spec:
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: bjw-s
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    controllers:
      backup-sync:
        type: cronjob
        serviceAccount:
          name: backup-sync
        cronjob:
          schedule: 0 6 * * *
          concurrencyPolicy: Replace
          ttlSecondsAfterFinished: 3600
        containers:
          backup-sync:
            image:
              repository: jacob.pub/ghcr.io/rclone/rclone
              tag: 1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
            env:
              - name: AWS_ROLE_ARN
                value: arn:aws:iam::803205869942:role/backup-sync
              - name: AWS_WEB_IDENTITY_TOKEN_FILE
                value: /var/run/secrets/aws/token
              - name: AWS_REGION
                value: us-east-1
              - name: RCLONE_CONFIG_B2_ACCOUNT
                valueFrom:
                  secretKeyRef:
                    name: b2-backup-credentials
                    key: account
              - name: RCLONE_CONFIG_B2_KEY
                valueFrom:
                  secretKeyRef:
                    name: b2-backup-credentials
                    key: key
            args:
              - --config
              - /rclone.conf
              - --log-level=NOTICE
              - --stats-log-level=NOTICE
              - --stats=30s
              - --stats-one-line-date
              - --s3-storage-class
              - DEEP_ARCHIVE
              - sync
              - b2:mcswain-minio
              - s3:mcswain-backups/minio
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi

    configMaps:
      config:
        data:
          rclone.conf: |
            [b2]
            type = b2
            hard_delete = true
            [s3]
            type = s3
            provider = AWS
            env_auth = true
            no_check_bucket = true

    persistence:
      aws-token:
        enabled: true
        type: custom
        volumeSpec:
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
        advancedMounts:
          backup-sync:
            backup-sync:
              - path: /var/run/secrets/aws
                readOnly: true
      config:
        enabled: true
        type: configMap
        name: backup-sync-mcswain-minio
        advancedMounts:
          backup-sync:
            backup-sync:
              - path: /rclone.conf
                subPath: rclone.conf
