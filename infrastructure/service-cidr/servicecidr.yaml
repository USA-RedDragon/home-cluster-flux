# The default `kubernetes` ServiceCIDR was created with fdeb:ffff:237c::/108 and
# never follows later --service-cluster-ip-range changes. This adds the IPv6
# range the API servers and kubelets are configured with (kube-dns needs
# fdeb:abba:237c:fefe:1::a from it).
apiVersion: networking.k8s.io/v1
kind: ServiceCIDR
metadata:
  name: talos-ipv6
spec:
  cidrs:
    - fdeb:abba:237c:fefe:1::/112
