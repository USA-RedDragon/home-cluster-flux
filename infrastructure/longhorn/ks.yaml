apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  targetNamespace: longhorn-system
  path: ./infrastructure/longhorn/resources/app
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-config
  namespace: longhorn-system
spec:
  dependsOn:
    - name: longhorn
    - name: external-snapshotter-crds
      namespace: kube-system
  interval: 1h
  targetNamespace: longhorn-system
  path: ./infrastructure/longhorn/resources/config
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-prometheus
  namespace: longhorn-system
spec:
  dependsOn:
    - name: longhorn
    - name: prometheus
      namespace: monitoring
    - name: cert-manager-certs
      namespace: cert-manager
  interval: 1h
  targetNamespace: longhorn-system
  path: ./infrastructure/longhorn/resources/prometheus
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
