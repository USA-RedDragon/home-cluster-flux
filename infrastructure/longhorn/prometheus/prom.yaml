apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  selector:
    matchLabels:
      app: longhorn-manager
  endpoints:
    - port: manager
      interval: 1m
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn-disk-health
  namespace: longhorn-system
spec:
  groups:
    - name: disk-smart
      rules:
        - alert: DiskCriticalWarning
          expr: longhorn_disk_health_attribute_raw{attribute="CriticalWarning"} != 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "NVMe critical warning on {{ $labels.node }}/{{ $labels.disk }}"
            description: "The drive is reporting SMART CriticalWarning={{ $value }}. Replace it."

        - alert: DiskAvailableSpareLow
          expr: |
            longhorn_disk_health_attribute_raw{attribute="AvailableSpare"}
              < on(node, disk) longhorn_disk_health_attribute_raw{attribute="AvailableSpareThreshold"}
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "NVMe spare blocks exhausted on {{ $labels.node }}/{{ $labels.disk }}"
            description: "AvailableSpare is {{ $value }}%, below the drive's own threshold."

        - alert: DiskWearCritical
          expr: longhorn_disk_health_attribute_raw{attribute="PercentageUsed"} >= 90
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.node }}/{{ $labels.disk }} at {{ $value }}% of rated endurance"
            description: "Replace this drive."

        # No fixed "wear high" threshold: a drive at 73% writing 67 GB/day has
        # years left. Warn on the trend instead, and on real defects (spare,
        # media errors) below.
        - alert: DiskWearExhaustionProjected
          expr: |
            predict_linear(longhorn_disk_health_attribute_raw{attribute="PercentageUsed"}[30d], 180 * 24 * 3600) >= 100
              and longhorn_disk_health_attribute_raw{attribute="PercentageUsed"} < 90
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.node }}/{{ $labels.disk }} projected to exhaust endurance within 180 days"
            description: "Rising fast enough over the last 30 days to reach 100% of rated endurance inside 180 days. Plan a replacement and check what is driving writes to this disk."

        - alert: DiskAvailableSpareDropping
          expr: longhorn_disk_health_attribute_raw{attribute="AvailableSpare"} < 90
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "NVMe spare blocks at {{ $value }}% on {{ $labels.node }}/{{ $labels.disk }}"
            description: "The drive has been retiring blocks. Healthy drives sit at 100%; plan a replacement before it reaches the drive's own threshold."

        - alert: DiskMediaErrorsGrowing
          expr: increase(longhorn_disk_health_attribute_raw{attribute="MediaErrors"}[24h]) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "New media errors on {{ $labels.node }}/{{ $labels.disk }}"
            description: "{{ $value }} new uncorrectable media errors in 24h. This drive is failing."

        - alert: DiskReallocatedSectorsGrowing
          expr: increase(longhorn_disk_health_attribute_raw{attribute="Reallocated_Sector_Ct"}[24h]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "New reallocated sectors on {{ $labels.node }}/{{ $labels.disk }}"
            description: "{{ $value }} newly reallocated sectors in 24h."

        - alert: DiskUncorrectableErrorsGrowing
          expr: increase(longhorn_disk_health_attribute_raw{attribute="Uncorrectable_Error_Cnt"}[24h]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "New uncorrectable errors on {{ $labels.node }}/{{ $labels.disk }}"
            description: "{{ $value }} new uncorrectable errors in 24h."

        - alert: DiskBadBlocksGrowing
          expr: increase(longhorn_disk_health_attribute_raw{attribute="Added_Bad_Flash_Blk_Ct"}[24h]) > 10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Bad flash blocks accumulating on {{ $labels.node }}/{{ $labels.disk }}"
            description: "{{ $value }} new bad flash blocks in 24h. A slow trickle is normal wear; a jump is not."

        - alert: DiskLinkCRCErrorsGrowing
          expr: increase(longhorn_disk_health_attribute_raw{attribute="CRC_Error_Count"}[24h]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "SATA link CRC errors on {{ $labels.node }}/{{ $labels.disk }}"
            description: "{{ $value }} new CRC errors in 24h. Usually a cable or backplane fault, not the drive."
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn-volume-health
  namespace: longhorn-system
spec:
  groups:
    - name: longhorn-volumes
      rules:
        # Only the manager on the volume's owner node reports it, but dedupe
        # anyway so an ownership handoff can't double-fire.
        - alert: LonghornVolumeFaulted
          expr: max by (volume, pvc, pvc_namespace) (longhorn_volume_robustness{state="faulted"}) == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} is faulted"
            description: "{{ $labels.volume }} has no healthy replica it can start from. Its data is at risk and the workload cannot attach it. Salvage it from the Longhorn UI."

        - alert: LonghornVolumeDegraded
          expr: max by (volume, pvc, pvc_namespace) (longhorn_volume_robustness{state="degraded"}) == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} degraded for 30m"
            description: "{{ $labels.volume }} is running with fewer healthy replicas than requested and has not finished rebuilding."
