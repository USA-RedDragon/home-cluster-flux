apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-nvme
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "3"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: ext4
  dataLocality: best-effort
  diskSelector: "nvme"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-ssd
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "3"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: ext4
  dataLocality: best-effort
  diskSelector: "ssd"
---
# A single replica must follow its pod (best-effort locality), or one node can
# hold every replica of something that is spread for HA at the app layer: all
# three authentik CNPG replicas sat on beta when it died (2026-09-30).
# StorageClass parameters are immutable, so force lets Flux recreate on change.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-r1
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: ext4
  dataLocality: best-effort
  disableRevisionCounter: "true"
  unmapMarkSnapChainRemoved: "ignored"
  dataEngine: v1
  backupTargetName: default
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-nvme-r1
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: ext4
  dataLocality: best-effort
  diskSelector: "nvme"
---
# Scratch for sustained bulk writes (astro-stacker). The "fast" tag is on the
# 990 PRO-class data NVMes only: not the DRAM-less 980s (750 ms writes under
# load), not node system disks, not alpha-nvme-2 (worn). Tags live on the
# Longhorn Node objects, not in Git.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-fast-r1
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: ext4
  dataLocality: best-effort
  diskSelector: "fast"
  recurringJobSelector: '[{"name":"trim","isGroup":false}]'
