---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1m0s
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  install:
    remediation:
      retries: -1
  chart:
    spec:
      chart: longhorn
      sourceRef:
        kind: HelmRepository
        namespace: longhorn-system
        name: longhorn
      version: 1.13.0
  interval: 60m0s
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: chart-values
  # Longhorn treats a NotReady manager pod as a down node and rebuilds every
  # replica on it. With the chart's default probe (1s timeout, 3 failures) a
  # ~25s node freeze on epsilon (2026-09-29 22:27) did exactly that. Allow ~1m.
  # The freeze was astro-stacker saturating all 16 CPUs; the manager ships with
  # no requests (BestEffort, the smallest CPU share), so give it a real one.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: longhorn-manager
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: longhorn-manager
                namespace: longhorn-system
              spec:
                template:
                  spec:
                    containers:
                      - name: longhorn-manager
                        readinessProbe:
                          timeoutSeconds: 5
                          failureThreshold: 6
                        resources:
                          requests:
                            cpu: 100m
