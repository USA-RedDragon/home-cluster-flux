# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json

controllers:
  reticulum:
    replicas: 1

    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch

    containers:
      reticulum:
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        image:
          repository: jacob.pub/ghcr.io/usa-reddragon/reticulum
          tag: "1.5.5@sha256:ef00928bdc1fbfc3cab4e305033521f8b274395fa0fd9315dab23c36e0b3aa5b"
        # A CPU request keeps it off the BestEffort share, so node-wide stalls
        # (astro-stacker bursts on epsilon) don't starve it first.
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        env:
          - name: PYTHONUNBUFFERED
            value: "1"
        # RNS listens with a backlog of 1, so a probe SYN can be dropped and
        # only retried after 1s. A 5s timeout covers the retry, and liveness
        # needs ~60s of failures before it kills the pod.
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 4242
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 4242
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          startup:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 4242
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 60

configMaps:
  config:
    data:
      config.toml: |

        [reticulum]
          enable_transport = true
          enable_remote_management = true
          remote_management_allowed = 24cdc22514b8456c56399cb95bad021e

        [logging]
          loglevel = 7

        [interfaces]
          [[Server]]
            type = BackboneInterface
            enabled = true
            mode = gateway
            listen_on = 0.0.0.0
            port = 4242
            # Every client arrives through the Envoy TCPRoute, so RNS sees one
            # source IP; fast-flap blocking banned it and locked out everyone.
            block_fast_flapping = no

            discoverable = true
            discovery_name = "Central Oklahoma Reticulum Hub"
            announce_interval = 720
            reachable_on = reticulum.mcswain.dev
            latitude = 35.324577
            longitude = -97.4594459
            height = 4

          [[RNode LoRa]]
            type = RNodeInterface
            enabled = true
            mode = boundary
            port = tcp://172.29.1.216
            frequency = 925875000
            bandwidth = 250000
            txpower = 22
            spreadingfactor = 9
            codingrate = 5
            flow_control = true

            #discoverable = true
            discovery_name = "Central Oklahoma Reticulum Hub"
            announce_interval = 720

          [[g00n.cloud Hub]]
            type = BackboneInterface
            enabled = true
            target_host = dfw.us.g00n.cloud
            target_port = 6969

          [[RMAP World]]
            type        = BackboneInterface
            enabled     = true
            target_host = rmap.world
            target_port = 4242

service:
  reticulum:
    controller: reticulum
    ports:
      data:
        port: 4242

persistence:
  config:
    enabled: true
    type: configMap
    name: reticulum
    advancedMounts:
      reticulum:
        reticulum:
        - path: /app/.reticulum/config
          subPath: config.toml
  storage:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: longhorn-ssd
    advancedMounts:
      reticulum:
        reticulum:
          - path: /app/.reticulum/storage
  interfaces:
    enabled: true
    type: emptyDir
    sizeLimit: 1Gi
    advancedMounts:
      reticulum:
        reticulum:
          - path: /app/.reticulum/interfaces
  tmp:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 1Gi

route:
  data:
    enabled: true
    kind: TCPRoute
    parentRefs:
      - name: public
        namespace: envoy-gateway-system
        sectionName: reticulum-data
    rules:
      - backendRefs:
          - name: reticulum
            port: 4242
