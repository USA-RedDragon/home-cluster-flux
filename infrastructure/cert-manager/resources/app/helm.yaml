---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: cert-manager
spec:
  interval: 1h0m0s
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  install:
    remediation:
      retries: -1
  interval: 1h0m0s
  maxHistory: 2
  driftDetection:
    mode: enabled
  releaseName: cert-manager
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: jetstack
      version: v1.21.2
      interval: 1h0m0s
  values:
    image:
      registry: jacob.pub
    installCRDs: true
    resources:
      requests:
        cpu: 10m
        memory: 70Mi
      limits:
        memory: 100Mi
    webhook:
      replicaCount: 2
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: webhook
              app.kubernetes.io/instance: cert-manager
      image:
        registry: jacob.pub
      resources:
        requests:
          cpu: 10m
          memory: 50Mi
        limits:
          memory: 75Mi
    cainjector:
      image:
        registry: jacob.pub
      resources:
        requests:
          cpu: 10m
          memory: 100Mi
        limits:
          memory: 150Mi
    extraArgs:
    - --dns01-recursive-nameservers-only
    - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
