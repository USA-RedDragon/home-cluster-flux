apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  targetNamespace: cert-manager
  path: ./infrastructure/cert-manager/resources/app
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-certs
  namespace: cert-manager
spec:
  interval: 1h
  dependsOn:
    - name: cert-manager
    - name: secrets
      namespace: flux-system
  targetNamespace: cert-manager
  path: ./infrastructure/cert-manager/resources/certs
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
